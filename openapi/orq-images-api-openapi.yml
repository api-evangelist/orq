openapi: 3.2.0
info:
  title: orq.ai Images API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- name: Images
paths:
  /v2/router/images/generations:
    post:
      operationId: createImage
      summary: Create image
      tags:
      - Images
      x-speakeasy-group: router.images.generations
      x-speakeasy-name-override: create
      x-cli-group: images
      x-cli-name: generate
      x-speakeasy-ignore: false
      x-orq-gateway-group: 'true'
      description: Create an Image
      requestBody:
        required: true
        description: 'The image generation request: the prompt plus optional size, quality, style and format settings.'
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: A text description of the desired image(s).
                background:
                  type:
                  - string
                  - 'null'
                  enum:
                  - transparent
                  - opaque
                  - auto
                  - null
                  description: Allows to set transparency for the background of the generated image(s). This parameter is only supported for `openai/gpt-image-1`.
                model:
                  type: string
                  description: The model to use for image generation. One of `openai/dall-e-2`, `openai/dall-e-3`, or `openai/gpt-image-1`.
                moderation:
                  type:
                  - string
                  - 'null'
                  enum:
                  - low
                  - auto
                  - null
                  description: Control the content-moderation level for images generated by `gpt-image-1`. Must be either `low` or `auto`.
                n:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  maximum: 10
                  default: 1
                  description: The number of images to generate. Must be between 1 and 10. For `dall-e-3`, only `n=1` is supported.
                output_compression:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 100
                  description: The compression level (0-100%) for the generated images. This parameter is only supported for `gpt-image-1` with the `webp` or `jpeg` output formats.
                output_format:
                  type:
                  - string
                  - 'null'
                  enum:
                  - png
                  - jpeg
                  - webp
                  - null
                  description: The format in which the generated images are returned. This parameter is only supported for `openai/gpt-image-1`.
                quality:
                  type:
                  - string
                  - 'null'
                  enum:
                  - auto
                  - high
                  - medium
                  - low
                  - hd
                  - standard
                  - null
                  description: The quality of the image that will be generated. `auto` will automatically select the best quality for the given model.
                response_format:
                  type:
                  - string
                  - 'null'
                  enum:
                  - url
                  - b64_json
                  - null
                  description: The format in which generated images are returned. Must be one of `url` or `b64_json`. This parameter isn't supported for `gpt-image-1` which will always return base64-encoded images.
                size:
                  type:
                  - string
                  - 'null'
                  description: The size of the generated images. Must be one of the specified sizes for each model.
                style:
                  type:
                  - string
                  - 'null'
                  enum:
                  - vivid
                  - natural
                  - null
                  description: The style of the generated images. This parameter is only supported for `openai/dall-e-3`. Must be one of `vivid` or `natural`.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 512
                  description: Optional metadata for the request. This metadata will be stored in the trace and can be used for filtering.
                name:
                  type: string
                  description: The name to display on the trace. If not specified, the default system name will be used.
                fallbacks:
                  type: array
                  items:
                    type: object
                    properties:
                      model:
                        type: string
                        description: Fallback model identifier
                    required:
                    - model
                  description: Array of fallback models to use if primary model fails
                retry:
                  type: object
                  properties:
                    count:
                      type: number
                      minimum: 1
                      maximum: 5
                      default: 3
                      description: Number of retry attempts (1-5)
                      example: 3
                    on_codes:
                      type: array
                      items:
                        type: number
                        minimum: 100
                        maximum: 599
                      minItems: 1
                      description: HTTP status codes that trigger retry logic
                      example:
                      - 429
                      - 500
                      - 502
                      - 503
                      - 504
                  description: Retry configuration for the request
                cache:
                  type: object
                  properties:
                    ttl:
                      type: number
                      minimum: 1
                      maximum: 259200
                      default: 3600
                      description: Time to live for cached responses in seconds. Maximum 259200 seconds (3 days).
                      example: 3600
                    type:
                      type: string
                      enum:
                      - exact_match
                  required:
                  - type
                  description: Cache configuration for the request.
                load_balancer:
                  oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - weight_based
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            model:
                              type: string
                              description: Model identifier for load balancing
                              example: openai/gpt-5.6-sol
                            weight:
                              type: number
                              minimum: 0.001
                              maximum: 1
                              default: 0.5
                              description: Weight assigned to this model for load balancing
                              example: 0.7
                          required:
                          - model
                    required:
                    - type
                    - models
                  description: Load balancer configuration for the request.
                timeout:
                  type: object
                  properties:
                    call_timeout:
                      type: number
                      minimum: 1
                      description: Timeout value in milliseconds
                      example: 30000
                  required:
                  - call_timeout
                  description: Timeout configuration to apply to the request. If the request exceeds the timeout, it will be retried or fallback to the next model if configured.
                plugins:
                  type: array
                  items:
                    $ref: '#/components/schemas/PIIRedactionPlugin'
                  description: Request-scoped transforms applied to the text exchanged with the model. Currently supports `pii_redaction`, which replaces PII with placeholders before the provider sees it and restores the original values in the response.
                orq:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name to display on the trace. If not specified, the default system name will be used.
                    retry:
                      type: object
                      properties:
                        count:
                          type: number
                          minimum: 1
                          maximum: 5
                          default: 3
                          description: Number of retry attempts (1-5)
                          example: 3
                        on_codes:
                          type: array
                          items:
                            type: number
                            minimum: 100
                            maximum: 599
                          minItems: 1
                          description: HTTP status codes that trigger retry logic
                          example:
                          - 429
                          - 500
                          - 502
                          - 503
                          - 504
                      description: Retry configuration for the request
                    fallbacks:
                      type: array
                      items:
                        type: object
                        properties:
                          model:
                            type: string
                            description: Fallback model identifier
                            example: openai/gpt-5.4-mini
                        required:
                        - model
                      description: Array of fallback models to use if primary model fails
                    identity:
                      $ref: '#/components/schemas/PublicIdentity'
                    contact:
                      $ref: '#/components/schemas/PublicContact'
                    cache:
                      type: object
                      properties:
                        ttl:
                          type: number
                          minimum: 1
                          maximum: 259200
                          default: 3600
                          description: Time to live for cached responses in seconds. Maximum 259200 seconds (3 days).
                          example: 3600
                        type:
                          type: string
                          enum:
                          - exact_match
                      required:
                      - type
                      description: Cache configuration for the request.
                    load_balancer:
                      oneOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - weight_based
                          models:
                            type: array
                            items:
                              type: object
                              properties:
                                model:
                                  type: string
                                  description: Model identifier for load balancing
                                  example: openai/gpt-5.6-sol
                                weight:
                                  type: number
                                  minimum: 0.001
                                  maximum: 1
                                  default: 0.5
                                  description: Weight assigned to this model for load balancing
                                  example: 0.7
                              required:
                              - model
                        required:
                        - type
                        - models
                      description: Load balancer configuration for the request.
                      example:
                        type: weight_based
                        models:
                        - model: openai/gpt-4o
                          weight: 0.7
                        - model: anthropic/claude-3-5-sonnet
                          weight: 0.3
                    timeout:
                      type: object
                      properties:
                        call_timeout:
                          type: number
                          minimum: 1
                          description: Timeout value in milliseconds
                          example: 30000
                      required:
                      - call_timeout
                      description: Timeout configuration to apply to the request. If the request exceeds the timeout, it will be retried or fallback to the next model if configured.
                    fallback_on_codes:
                      type: array
                      items:
                        type: integer
                        minimum: 400
                        maximum: 599
                      maxItems: 20
                      description: HTTP status codes that trigger fallback. Enter up to 20 unique integers from 400 to 599. When omitted or empty, defaults to [408, 429, 500, 502, 503, 504, 529].
                fallback_on_codes:
                  type: array
                  items:
                    type: integer
                    minimum: 400
                    maximum: 599
                  maxItems: 20
                  description: HTTP status codes that trigger fallback. Enter up to 20 unique integers from 400 to 599. When omitted or empty, defaults to [408, 429, 500, 502, 503, 504, 529].
              required:
              - prompt
              - model
      responses:
        '200':
          description: Represents an image generation response from the API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: number
                    description: The Unix timestamp (in seconds) of when the image was created.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        revised_prompt:
                          type:
                          - string
                          - 'null'
                          description: The prompt that was used to generate the image, if there was any revision to the prompt.
                        b64_json:
                          type: string
                          description: The base64-encoded JSON of the generated image, if `response_format` is `b64_json`
                        url:
                          type: string
                          description: The url of the generated image, if `response_format` is `url` (default)
                    description: Represents the url or the content of an image generated.
                  usage:
                    type: object
                    properties:
                      input_tokens:
                        type: number
                      input_tokens_details:
                        type: object
                        properties:
                          image_tokens:
                            type: number
                          text_tokens:
                            type: number
                      output_tokens:
                        type: number
                      total_tokens:
                        type: number
                    required:
                    - input_tokens_details
                required:
                - created
                - data
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
  /v2/router/images/edits:
    post:
      operationId: createImageEdit
      summary: Create image edit
      tags:
      - Images
      x-speakeasy-group: router.images.edits
      x-speakeasy-name-override: create
      x-cli-group: images
      x-cli-name: edit
      x-speakeasy-ignore: false
      x-orq-gateway-group: 'true'
      description: Edit an Image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: The model to use for image edit. [Check models](https://docs.orq.ai/ai-gateway/supported-models#image-models)
                image:
                  type: string
                  format: binary
                  description: The image(s) to edit. Must be a supported image file or an array of images.  Each image should be a png, webp, or jpg file less than 50MB. You can provide up to 16 images.
                prompt:
                  type: string
                  description: A text description of the desired image(s).
                n:
                  type:
                  - number
                  - 'null'
                  minimum: 1
                  maximum: 10
                  default: 1
                  description: The number of images to generate. Must be between 1 and 10.
                size:
                  type:
                  - string
                  - 'null'
                  description: The size of the generated images
                quality:
                  type:
                  - string
                  - 'null'
                  enum:
                  - auto
                  - high
                  - medium
                  - low
                  - standard
                  - null
                  description: The quality of the image that will be generated. Auto will automatically select the best quality for the given model.
                response_format:
                  type: string
                  enum:
                  - url
                  - b64_json
                  description: The format in which the generated images are returned. Some of the models only return the image in base64 format.
                user:
                  type: string
                  description: A unique identifier representing your end-user, which can help to monitor and detect abuse.
                name:
                  type: string
                  description: The name to display on the trace. If not specified, the default system name will be used.
                fallbacks:
                  type: array
                  items:
                    type: object
                    properties:
                      model:
                        type: string
                        description: Fallback model identifier
                    required:
                    - model
                  description: Array of fallback models to use if primary model fails
                retry:
                  type: object
                  properties:
                    count:
                      type: number
                      minimum: 1
                      maximum: 5
                      default: 3
                      description: Number of retry attempts (1-5)
                      example: 3
                    on_codes:
                      type: array
                      items:
                        type: number
                        minimum: 100
                        maximum: 599
                      minItems: 1
                      description: HTTP status codes that trigger retry logic
                      example:
                      - 429
                      - 500
                      - 502
                      - 503
                      - 504
                  description: Retry configuration for the request
                cache:
                  type: object
                  properties:
                    ttl:
                      type: number
                      minimum: 1
                      maximum: 259200
                      default: 3600
                      description: Time to live for cached responses in seconds. Maximum 259200 seconds (3 days).
                      example: 3600
                    type:
                      type: string
                      enum:
                      - exact_match
                  required:
                  - type
                  description: Cache configuration for the request.
                load_balancer:
                  oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - weight_based
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            model:
                              type: string
                              description: Model identifier for load balancing
                              example: openai/gpt-5.6-sol
                            weight:
                              type: number
                              minimum: 0.001
                              maximum: 1
                              default: 0.5
                              description: Weight assigned to this model for load balancing
                              example: 0.7
                          required:
                          - model
                    required:
                    - type
                    - models
                  description: Load balancer configuration for the request.
                timeout:
                  type: object
                  properties:
                    call_timeout:
                      type: number
                      minimum: 1
                      description: Timeout value in milliseconds
                      example: 30000
                  required:
                  - call_timeout
                  description: Timeout configuration to apply to the request. If the request exceeds the timeout, it will be retried or fallback to the next model if configured.
                orq:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name to display on the trace. If not specified, the default system name will be used.
                    retry:
                      type: object
                      properties:
                        count:
                          type: number
                          minimum: 1
                          maximum: 5
                          default: 3
                          description: Number of retry attempts (1-5)
                          example: 3
                        on_codes:
                          type: array
                          items:
                            type: number
                            minimum: 100
                            maximum: 599
                          minItems: 1
                          description: HTTP status codes that trigger retry logic
                          example:
                          - 429
                          - 500
                          - 502
                          - 503
                          - 504
                      description: Retry configuration for the request
                    fallbacks:
                      type: array
                      items:
                        type: object
                        properties:
                          model:
                            type: string
                            description: Fallback model identifier
                            example: openai/gpt-5.4-mini
                        required:
                        - model
                      description: Array of fallback models to use if primary model fails
                    prompt:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the prompt to use
                          example: prompt_01ARZ3NDEKTSV4RRFFQ69G5FAV
                        version:
                          type: string
                          enum:
                          - latest
                          description: Version of the prompt to use (currently only "latest" supported)
                          example: latest
                      required:
                      - id
                      - version
                      description: Prompt configuration for the request
                    identity:
                      $ref: '#/components/schemas/PublicIdentity'
                    contact:
                      $ref: '#/components/schemas/PublicContact'
                    cache:
                      type: object
                      properties:
                        ttl:
                          type: number
                          minimum: 1
                          maximum: 259200
                          default: 3600
                          description: Time to live for cached responses in seconds. Maximum 259200 seconds (3 days).
                          example: 3600
                        type:
                          type: string
                          enum:
                          - exact_match
                      required:
                      - type
                      description: Cache configuration for the request.
                    load_balancer:
                      oneOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - weight_based
                          models:
                            type: array
                            items:
                              type: object
                              properties:
                                model:
                                  type: string
                                  description: Model identifier for load balancing
                                  example: openai/gpt-5.6-sol
                                weight:
                                  type: number
                                  minimum: 0.001
                                  maximum: 1
                                  default: 0.5
                                  description: Weight assigned to this model for load balancing
                                  example: 0.7
                              required:
                              - model
                        required:
                        - type
                        - models
                      description: Load balancer configuration for the request.
                      example:
                        type: weight_based
                        models:
                        - model: openai/gpt-4o
                          weight: 0.7
                        - model: anthropic/claude-3-5-sonnet
                          weight: 0.3
                    timeout:
                      type: object
                      properties:
                        call_timeout:
                          type: number
                          minimum: 1
                          description: Timeout value in milliseconds
                          example: 30000
                      required:
                      - call_timeout
                      description: Timeout configuration to apply to the request. If the request exceeds the timeout, it will be retried or fallback to the next model if configured.
                    fallback_on_codes:
                      type: array
                      items:
                        type: integer
                        minimum: 400
                        maximum: 599
                      maxItems: 20
                      description: HTTP status codes that trigger fallback. Enter up to 20 unique integers from 400 to 599. When omitted or empty, defaults to [408, 429, 500, 502, 503, 504, 529].
                fallback_on_codes:
                  type: array
                  items:
                    type: integer
                    minimum: 400
                    maximum: 599
                  maxItems: 20
                  description: HTTP status codes that trigger fallback. Enter up to 20 unique integers from 400 to 599. When omitted or empty, defaults to [408, 429, 500, 502, 503, 504, 529].
              required:
              - model
              - prompt
      responses:
        '200':
          description: Represents an image edit response from the API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: number
                    description: The Unix timestamp (in seconds) of when the image was created.
                  output_format:
                    type: string
                    description: The output format of the image generation
                  size:
                    type: string
                    description: The size of the image generated
                  quality:
                    type: string
                    description: The quality of the image generated
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        b64_json:
                          type: string
                          description: The base64-encoded JSON of the generated image, if response_format is b64_json
                        url:
                          type: string
                          description: The URL of the generated image, if response_format is url (default)
                    description: The list of generated images.
                  usage:
                    type: object
                    properties:
                      total_tokens:
                        type: number
                        description: The total number of tokens (images and text) used for the image generation.
                      input_tokens:
                        type: number
                        description: The number of tokens (images and text) in the input prompt.
                      output_tokens:
                        type: number
                        description: The number of output tokens generated by the model.
                      input_tokens_details:
                        type: object
                        properties:
                          text_tokens:
                            type: number
                            description: The number of text tokens in the input prompt.
                          image_tokens:
                            type: number
                            description: The number of image tokens in the input prompt.
                        required:
                        - text_tokens
                        - image_tokens
                        description: The input tokens detailed information for the image generation.
                    required:
                    - total_tokens
                    - input_tokens
                    - output_tokens
                    - input_tokens_details
                    description: The token usage information for the image generation.
                required:
                - created
                - data
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
  /v2/router/images/variations:
    post:
      operationId: createImageVariation
      summary: Create image variation
      tags:
      - Images
      x-speakeasy-group: router.images.variations
      x-speakeasy-name-override: create
      x-cli-group: images
      x-cli-name: variation
      x-speakeasy-ignore: false
      x-orq-gateway-group: 'true'
      description: Create an Image Variation
