                            type: string
                            description: Fallback model identifier
                            example: openai/gpt-5.4-mini
                        required:
                        - model
                      description: Array of fallback models to use if primary model fails
                    prompt:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the prompt to use
                          example: prompt_01ARZ3NDEKTSV4RRFFQ69G5FAV
                        version:
                          type: string
                          enum:
                          - latest
                          description: Version of the prompt to use (currently only "latest" supported)
                          example: latest
                      required:
                      - id
                      - version
                      description: Prompt configuration for the request
                    identity:
                      $ref: '#/components/schemas/PublicIdentity'
                    contact:
                      $ref: '#/components/schemas/PublicContact'
                    cache:
                      type: object
                      properties:
                        ttl:
                          type: number
                          minimum: 1
                          maximum: 259200
                          default: 3600
                          description: Time to live for cached responses in seconds. Maximum 259200 seconds (3 days).
                          example: 3600
                        type:
                          type: string
                          enum:
                          - exact_match
                      required:
                      - type
                      description: Cache configuration for the request.
                    load_balancer:
                      oneOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - weight_based
                          models:
                            type: array
                            items:
                              type: object
                              properties:
                                model:
                                  type: string
                                  description: Model identifier for load balancing
                                  example: openai/gpt-5.6-sol
                                weight:
                                  type: number
                                  minimum: 0.001
                                  maximum: 1
                                  default: 0.5
                                  description: Weight assigned to this model for load balancing
                                  example: 0.7
                              required:
                              - model
                        required:
                        - type
                        - models
                      description: Load balancer configuration for the request.
                      example:
                        type: weight_based
                        models:
                        - model: openai/gpt-4o
                          weight: 0.7
                        - model: anthropic/claude-3-5-sonnet
                          weight: 0.3
                    timeout:
                      type: object
                      properties:
                        call_timeout:
                          type: number
                          minimum: 1
                          description: Timeout value in milliseconds
                          example: 30000
                      required:
                      - call_timeout
                      description: Timeout configuration to apply to the request. If the request exceeds the timeout, it will be retried or fallback to the next model if configured.
                    fallback_on_codes:
                      type: array
                      items:
                        type: integer
                        minimum: 400
                        maximum: 599
                      maxItems: 20
                      description: HTTP status codes that trigger fallback. Enter up to 20 unique integers from 400 to 599. When omitted or empty, defaults to [408, 429, 500, 502, 503, 504, 529].
                fallback_on_codes:
                  type: array
                  items:
                    type: integer
                    minimum: 400
                    maximum: 599
                  maxItems: 20
                  description: HTTP status codes that trigger fallback. Enter up to 20 unique integers from 400 to 599. When omitted or empty, defaults to [408, 429, 500, 502, 503, 504, 529].
              required:
              - model
      responses:
        '200':
          description: Represents an image variation response from the API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: number
                    description: The Unix timestamp (in seconds) of when the image was created.
                  output_format:
                    type: string
                    description: The output format of the image generation
                  size:
                    type: string
                    description: The size of the image generated
                  quality:
                    type: string
                    description: The quality of the image generated
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        b64_json:
                          type: string
                          description: The base64-encoded JSON of the generated image, if response_format is b64_json
                        url:
                          type: string
                          description: The URL of the generated image, if response_format is url (default)
                    description: The list of generated images.
                  usage:
                    type: object
                    properties:
                      total_tokens:
                        type: number
                        description: The total number of tokens (images and text) used for the image generation.
                      input_tokens:
                        type: number
                        description: The number of tokens (images and text) in the input prompt.
                      output_tokens:
                        type: number
                        description: The number of output tokens generated by the model.
                      input_tokens_details:
                        type: object
                        properties:
                          text_tokens:
                            type: number
                            description: The number of text tokens in the input prompt.
                          image_tokens:
                            type: number
                            description: The number of image tokens in the input prompt.
                        required:
                        - text_tokens
                        - image_tokens
                        description: The input tokens detailed information for the image generation.
                    required:
                    - total_tokens
                    - input_tokens
                    - output_tokens
                    - input_tokens_details
                    description: The token usage information for the image generation.
                required:
                - created
                - data
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
components:
  schemas:
    APIErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/APIError'
      required:
      - error
    PublicContact:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the contact
          example: contact_01ARZ3NDEKTSV4RRFFQ69G5FAV
        display_name:
          type: string
          description: Display name of the contact
          example: Jane Doe
        email:
          type: string
          format: email
          description: Email address of the contact
          example: jane.doe@example.com
        metadata:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: A hash of key/value pairs containing any other data about the contact
          example:
          - department: Engineering
            role: Senior Developer
        logo_url:
          type: string
          description: URL to the contact's avatar or logo
          example: https://example.com/avatars/jane-doe.jpg
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the contact
          example:
          - hr
          - engineering
      required:
      - id
      description: '@deprecated Use identity instead. Information about the contact making the request.'
      deprecated: true
    PublicIdentity:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the contact
          example: contact_01ARZ3NDEKTSV4RRFFQ69G5FAV
        display_name:
          type: string
          description: Display name of the contact
          example: Jane Doe
        email:
          type: string
          format: email
          description: Email address of the contact
          example: jane.doe@example.com
        metadata:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: A hash of key/value pairs containing any other data about the contact
          example:
          - department: Engineering
            role: Senior Developer
        logo_url:
          type: string
          description: URL to the contact's avatar or logo
          example: https://example.com/avatars/jane-doe.jpg
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the contact
          example:
          - hr
          - engineering
      required:
      - id
      description: Information about the identity making the request. If the identity does not exist, it will be created automatically.
    APIError:
      additionalProperties: false
      properties:
        code:
          type:
          - string
          - 'null'
        failures: {}
        message:
          type: string
        param:
          type:
          - string
          - 'null'
        type:
          type: string
      required:
      - message
      - type
      - param
      - code
      type: object
    PIIRedactionPlugin:
      type: object
      properties:
        id:
          type: string
          enum:
          - pii_redaction
          description: PII redaction plugin.
        language:
          type: string
          description: Detector language. Accepts "auto" to detect the language per request; GET /v2/pii/capabilities lists the concrete languages and does not include "auto". Omitting the field defaults to "auto".
        regions:
          type: array
          items:
            type: string
          description: 'Region codes selecting whole regions of coverage (e.g. "nl", "gb"). Every entity type those regions cover is redacted, alongside the base catalog. ["all"] is exclusive, and leaving both this and entities empty also runs every region, so selecting nothing is the widest request rather than the narrowest. Combines with entities: the two selections are unioned, so entities adds types on top of the region coverage.'
        entities:
          type: array
          items:
            type: string
          description: The entity types to redact. A named type is redacted even when it belongs to a region, so a region's types can be selected individually without naming the region. On its own this is a strict allowlist; alongside regions it adds to the region coverage. See GET /v2/pii/capabilities for valid types.
        entity_thresholds:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          description: Per-entity confidence cutoff overrides in [0,1]. Tunes confidence only and never changes which types are redacted, so every key must also appear in entities.
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Baseline confidence cutoff applied to every entity type without a per-entity override.
        on_failure:
          type: string
          enum:
          - block
          - passthrough
          description: Behaviour when detection fails.
      required:
      - id
      additionalProperties: false
      title: PII redaction plugin
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  url: https://docs.orq.ai
  description: orq.ai Documentation
x-speakeasy-timeout: 600000
