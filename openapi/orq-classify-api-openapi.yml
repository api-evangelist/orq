openapi: 3.2.0
info:
  title: orq.ai Classify API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- description: Beta. Run typed classification questions against a classify model.
  name: Classify
paths:
  /v3/router/classify:
    post:
      deprecated: true
      description: '**Deprecated.** Use `POST /v3/router/decisions` and `orq.router.decisions.create()` for new integrations. This endpoint remains available for backward compatibility with the same request and response contract.


        **Beta.** Evaluate content against named questions and receive structured answers, probabilities, and usage costs. Send the content as `state` and define each entry in `questions` as:


        - `noul`: estimate the probability that a statement is true.

        - `choice`: select an option from a set.

        - `score`: rate the content on an ordered scale.

        - `box`: locate one target in an image and return its bounding box. Beta, TypeSafe `jev-preview` only.


        Instructions and criteria accept strings or structured JSON. TypeSafe models also accept inline images through `assets` (beta).


        Use a native decision model or a supported chat model. Configure ordered `fallbacks`, optional `retry`, `timeout.call_timeout` in milliseconds, and an exact-match `cache`. Each retry and fallback gets a fresh timeout; omit `retry` to move directly to the next fallback on timeout. The response identifies the model that answered.


        Requires the `classify` API-key permission. PII plugins and guardrails are not applied. See the Decisions guide for supported models, probability interpretation, and refusals.'
      operationId: CreateClassify
      requestBody:
        content:
          application/json:
            examples:
              fallback_retry_identity:
                summary: Decisions with fallbacks, retries and identity
                value:
                  fallbacks:
                  - model: openai/gpt-5.6-luna
                  identity:
                    id: customer-demo
                    display_name: Sample customer
                  model: openai/gpt-6-luna
                  questions:
                    positive:
                      criteria:
                        'false': The customer is unhappy.
                        'true': The customer is happy.
                      instructions: Is the sentiment positive?
                      type: noul
                    rating:
                      criteria:
                      - Negative
                      - Neutral
                      - Positive
                      instructions: Rate sentiment.
                      type: score
                    sentiment:
                      criteria:
                        negative: Negative sentiment
                        neutral: null
                        positive: Positive sentiment
                      instructions: Classify sentiment.
                      type: choice
                  retry:
                    count: 2
                    on_codes:
                    - 429
                    - 502
                    - 503
                    - 504
                  state: 'The customer says: I love this product. It is wonderful!'
                  timeout:
                    call_timeout: 2000
              openai_inline_image:
                description: A small self-contained PNG. Replace it with your own base64 image data URL.
                summary: Classify an inline image with OpenAI Decisions
                value:
                  model: openai/gpt-6-luna
                  questions:
                    contains_text:
                      instructions: Does the image contain text?
                      type: noul
                  state:
                  - content:
                    - text: Evaluate this image.
                      type: input_text
                    - image_url: data:image/png;base64,
                      type: input_image
                    role: user
              openai_text:
                summary: Classify text with OpenAI Decisions
                value:
                  model: openai/gpt-6-luna
                  questions:
                    positive:
                      criteria:
                        'false': The customer is unhappy.
                        'true': The customer is happy.
                      instructions: Is the sentiment positive?
                      type: noul
                    rating:
                      criteria:
                      - Negative
                      - Neutral
                      - Positive
                      instructions: Rate sentiment.
                      type: score
                    sentiment:
                      criteria:
                        negative: Negative sentiment
                        neutral: null
                        positive: Positive sentiment
                      instructions: Classify sentiment.
                      type: choice
                  state: 'The customer says: I love this product. It is wonderful!'
              support_ticket:
                summary: Classify a support message
                value:
                  model: typesafe/jev-latest
                  questions:
                    is_complaint:
                      instructions: Is the customer complaining?
                      type: noul
                    severity:
                      criteria:
                      - Minor
                      - Moderate
                      - Severe
                      instructions: How severe is the issue?
                      type: score
                    topic:
                      criteria:
                        delivery: Shipping or delivery issues
                        other: null
                        product: Product quality
                      instructions: What is the message mainly about?
                      type: choice
                  state: The parcel arrived two days late and the box was crushed.
              typesafe_image_box:
                description: Beta. Replace data_base64 with your own PNG or JPEG of 256 to 1568 px per side.
                summary: Locate an object in an image with TypeSafe
                value:
                  assets:
                    kitchen-photo:
                      type: image
                      data_base64: <base64 JPEG>
                      format: jpg
                  model: typesafe/jev-preview
                  questions:
                    mug:
                      instructions: the coffee mug in `photo`
                      type: box
                    mug_visible:
                      instructions: Is there a coffee mug in `photo`?
                      type: noul
                  state:
                    photo: kitchen-photo
            schema:
              additionalProperties: false
              properties:
                assets:
                  additionalProperties:
                    $ref: '#/components/schemas/ClassifyAsset'
                  description: Beta, TypeSafe models only. Inline images keyed by a reference string. Write the reference in state, instructions or criteria wherever the image belongs; every asset must be referenced. Required for box questions.
                  type: object
                cache:
                  $ref: '#/components/schemas/ClassifyCacheConfig'
                  description: Exact-match response cache for this request. An identical request body from the same workspace and project is served from the stored response, with the X-Cache header reporting HIT or MISS.
                fallback_on_codes:
                  description: HTTP status codes that trigger fallback. Defaults to [408,429,500,502,503,504,529]. Each code must be unique and between 400 and 599.
                  items:
                    format: int64
                    type: integer
                  maxItems: 20
                  type:
                  - array
                  - 'null'
                fallbacks:
                  description: Up to 10 fallback models in order. The gateway retries a model for matching error codes before trying the next model. Every model must support classification and satisfy access checks. Requests with images in state require native OpenAI image-capable fallbacks; requests with assets or box questions require TypeSafe fallbacks.
                  items:
                    $ref: '#/components/schemas/FallbackConfig'
                  maxItems: 10
                  type:
                  - array
                  - 'null'
                identity:
                  $ref: '#/components/schemas/ResponseIdentity'
                  description: The identity to attach to the trace.
                metadata:
                  additionalProperties:
                    type: string
                  description: Key-value metadata attached to the trace.
                  type: object
                model:
                  description: ID of a model that supports native or emulated classify, including openai/gpt-6-luna.
                  type: string
                name:
                  description: The name to display on the trace. If not specified, the default system name will be used.
                  type: string
                questions:
                  additionalProperties:
                    oneOf:
                    - description: Answers with a probability between 0 and 1 that the statement holds.
                      properties:
                        criteria:
                          description: Optional descriptions of what true and false mean.
                          properties:
                            'false':
                              anyOf:
                              - title: String
                                type: string
                              - additionalProperties: true
                                title: Object
                                type: object
                              - items: {}
                                title: Array
                                type: array
                              description: What false means. A string, an object or an array.
                            'true':
                              anyOf:
                              - title: String
                                type: string
                              - additionalProperties: true
                                title: Object
                                type: object
                              - items: {}
                                title: Array
                                type: array
                              description: What true means. A string, an object or an array.
                          type: object
                        instructions:
                          anyOf:
                          - title: String
                            type: string
                          - additionalProperties: true
                            title: Object
                            type: object
                          - items: {}
                            title: Array
                            type: array
                          description: The evaluation prompt for this question. A string, an object or an array.
                        type:
                          enum:
                          - noul
                          type: string
                      required:
                      - type
                      - instructions
                      title: NoulQuestion
                      type: object
                    - description: Picks one of the given options and returns the probability of each.
                      properties:
                        criteria:
                          additionalProperties:
                            anyOf:
                            - title: String
                              type: string
                            - additionalProperties: true
                              title: Object
                              type: object
                            - items: {}
                              title: Array
                              type: array
                            - title: 'Null'
                              type: 'null'
                            description: The option description, or null.
                          description: Options keyed by name, each mapped to a description or null. A description can be a string, an object or an array.
                          minProperties: 1
                          type: object
                        instructions:
                          anyOf:
                          - title: String
                            type: string
                          - additionalProperties: true
                            title: Object
                            type: object
                          - items: {}
                            title: Array
                            type: array
                          description: The evaluation prompt for this question. A string, an object or an array.
                        type:
                          enum:
                          - choice
                          type: string
                      required:
                      - type
                      - instructions
                      - criteria
                      title: ChoiceQuestion
                      type: object
                    - description: Places the state on an ordered scale and returns the probability of each level.
                      properties:
                        criteria:
                          description: Ordered level descriptions from lowest to highest. At least two levels. Each level can be a string, an object or an array.
                          items: {}
                          minItems: 2
                          type: array
                        instructions:
                          anyOf:
                          - title: String
                            type: string
                          - additionalProperties: true
                            title: Object
                            type: object
                          - items: {}
                            title: Array
                            type: array
                          description: The evaluation prompt for this question. A string, an object or an array.
                        type:
                          enum:
                          - score
                          type: string
                      required:
                      - type
                      - instructions
                      - criteria
                      title: ScoreQuestion
                      type: object
                    - description: Beta, TypeSafe jev-preview only. Locates one target in an image from assets and returns its bounding box. Always returns a box; pair it with a noul question to check presence.
                      properties:
                        instructions:
                          anyOf:
                          - title: String
                            type: string
                          - additionalProperties: true
                            title: Object
                            type: object
                          - items: {}
                            title: Array
                            type: array
                          description: The evaluation prompt for this question. A string, an object or an array.
                        type:
                          enum:
                          - box
                          type: string
                      required:
                      - type
                      - instructions
                      title: BoxQuestion
                      type: object
                  description: Typed questions keyed by an identifier of your choice. Each answer is returned under the same key.
                  minProperties: 1
                  type: object
                retry:
                  $ref: '#/components/schemas/ClassifyRetryConfig'
                  description: Retry configuration for the request.
                state:
                  anyOf:
                  - title: String
                    type: string
                  - additionalProperties: true
                    title: Object
                    type: object
                  - items: {}
                    title: Array
                    type: array
                  description: The content to evaluate. A string, an object or an array. For TypeSafe models, reference images declared in assets by writing their reference string. For OpenAI GPT-6 Luna, strings are passed as text and objects or ordinary JSON arrays are serialized as text. User-message arrays accept string content or input_text/input_image parts. Images must be inline base64 data URLs, with at most 128 images across the request. Remote image URLs, file IDs, audio, non-user roles, bare content parts and tool items are rejected.
                timeout:
                  $ref: '#/components/schemas/ClassifyTimeoutConfig'
                  description: Timeout for each model call, including every retry and fallback. A timed-out call returns 408 and advances to the next fallback after configured retries are exhausted.
              required:
              - model
              - state
              - questions
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                openai_answers:
                  summary: OpenAI Decisions answers and usage
                  value:
                    model: openai/gpt-6-luna
                    answers:
                      positive:
                        type: noul
                        noul: 1
                      rating:
                        type: score
                        score: 2
                        legend:
                          '0': Negative
                          '1': Neutral
                          '2': Positive
                        probabilities:
                          '0': 0
                          '1': 0
                          '2': 1
                        confidence: 1
                      sentiment:
                        type: choice
                        choice: positive
                        probabilities:
                          negative: 0
                          neutral: 0
                          positive: 1
                        confidence: 1
                    usage:
                      input_tokens_details:
                        cached_tokens: 0
                        cache_write_tokens: 0
                      input_tokens: 408
                      output_tokens: 0
                      input_cost: 4.08e-05
                      output_cost: 0
                      total_cost: 4.08e-05
                partial_refusal:
                  description: Illustrative response. A provider may refuse one question while answering the rest. Refusals have no scored fields.
                  summary: One question is refused
                  value:
                    model: openai/gpt-6-luna
                    answers:
                      positive:
                        type: refusal
                      rating:
                        type: score
                        score: 2
                        legend:
                          '0': Negative
                          '1': Neutral
                          '2': Positive
                        probabilities:
                          '0': 0
                          '1': 0
                          '2': 1
                        confidence: 1
                      sentiment:
                        type: choice
                        choice: positive
                        probabilities:
                          negative: 0
                          neutral: 0
                          positive: 1
                        confidence: 1
                    usage:
                      input_tokens_details:
                        cached_tokens: 0
                        cache_write_tokens: 0
                      input_tokens: 408
                      output_tokens: 0
                      input_cost: 4.08e-05
                      output_cost: 0
                      total_cost: 4.08e-05
              schema:
                additionalProperties: false
                properties:
                  answers:
                    additionalProperties:
                      $ref: '#/components/schemas/ClassifyAnswer'
                    description: Answers keyed by the question identifiers from the request.
                    type: object
                  model:
                    description: The requested ID of the model that answered. This can be a fallback model.
                    type: string
                  telemetry:
                    $ref: '#/components/schemas/ResponseTelemetry'
                    description: OpenTelemetry trace and span identifiers for this request.
                  usage:
                    $ref: '#/components/schemas/ClassifyUsage'
                    description: The usage information for the request.
                required:
                - model
                - answers
                - usage
                type: object
          description: Returns one answer per question.
        '400':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/APIError'
                required:
                - error
                type: object
          description: Malformed JSON, missing or unsupported model, or invalid retry, timeout, or fallback fields.
        '401':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/APIError'
                required:
                - error
                type: object
          description: Missing, invalid, expired or revoked API key.
        '403':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/APIError'
                required:
                - error
                type: object
          description: The API key lacks classify permission, or the workspace or project cannot access the model.
        '408':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/APIError'
                required:
                - error
                type: object
          description: The final model call exceeded its timeout after available retries and fallbacks were exhausted.
        '422':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/APIError'
                required:
                - error
                type: object
          description: The state or a question violates the classification contract.
        '429':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/APIError'
                required:
                - error
                type: object
          description: A plan rate limit, budget or provider rate limit was exceeded.
        '500':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/APIError'
                required:
                - error
                type: object
          description: An internal model-resolution error occurred.
        '502':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/APIError'
                required:
                - error
                type: object
          description: The upstream provider failed or returned an invalid classification response.
      summary: Classify
      tags:
      - Classify
      x-cli-group: classify
      x-cli-name: create
      x-code-samples:
      - label: Node.js
        lang: typescript
        source: "const result = await orq.router.classify.create({\n  model: \"typesafe/jev-latest\",\n  state: \"The parcel arrived two days late and the box was crushed.\",\n  questions: {\n    is_complaint: { type: \"noul\", instructions: \"Is the customer complaining?\" },\n    topic: {\n      type: \"choice\",\n      instructions: \"What is the message mainly about?\",\n      criteria: { delivery: \"Shipping or delivery issues\", product: \"Product quality\", other: null },\n    },\n    severity: { type: \"score\", instructions: \"How severe is the issue?\", criteria: [\"Minor\", \"Moderate\", \"Severe\"] },\n  },\n});"
      - label: Python
        lang: python
        source: "result = client.router.classify.create(\n    model=\"typesafe/jev-latest\",\n    state=\"The parcel arrived two days late and the box was crushed.\",\n    questions={\n        \"is_complaint\": {\"type\": \"noul\", \"instructions\": \"Is the customer complaining?\"},\n        \"topic\": {\n            \"type\": \"choice\",\n            \"instructions\": \"What is the message mainly about?\",\n            \"criteria\": {\"delivery\": \"Shipping or delivery issues\", \"product\": \"Product quality\", \"other\": None},\n        },\n        \"severity\": {\"type\": \"score\", \"instructions\": \"How severe is the issue?\", \"criteria\": [\"Minor\", \"Moderate\", \"Severe\"]},\n    },\n)"
      - label: 'Node.js: OpenAI text'
        lang: typescript
        source: "import { Orq } from \"@orq-ai/node\";\n\nconst orq = new Orq({ apiKey: process.env[\"ORQ_API_KEY\"] ?? \"\" });\nconst result = await orq.router.classify.create({\n  \"model\": \"openai/gpt-6-luna\",\n  \"questions\": {\n    \"positive\": {\n      \"criteria\": {\n        \"false\": \"The customer is unhappy.\",\n        \"true\": \"The customer is happy.\"\n      },\n      \"instructions\": \"Is the sentiment positive?\",\n      \"type\": \"noul\"\n    },\n    \"rating\": {\n      \"criteria\": [\n        \"Negative\",\n        \"Neutral\",\n        \"Positive\"\n      ],\n      \"instructions\": \"Rate sentiment.\",\n      \"type\": \"score\"\n    },\n    \"sentiment\": {\n      \"criteria\": {\n        \"negative\": \"Negative sentiment\",\n        \"neutral\": null,\n        \"positive\": \"Positive sentiment\"\n      },\n      \"instructions\": \"Classify sentiment.\",\n      \"type\": \"choice\"\n    }\n  },\n  \"state\": \"The customer says: I love this product. It is wonderful!\"\n});\n\nfor (const [name, answer] of Object.entries(result.answers)) {\n  if (answer.type === \"refusal\") {\n    console.log(name, \"refused\");\n    continue;\n  }\n  console.log(name, answer);\n}"
      - label: 'Python: OpenAI text'
        lang: python
        source: "import json\nimport os\nfrom orq_ai_sdk import Orq\n\nclient = Orq(api_key=os.environ[\"ORQ_API_KEY\"])\nrequest = json.loads(\"{\\n  \\\"model\\\": \\\"openai/gpt-6-luna\\\",\\n  \\\"questions\\\": {\\n    \\\"positive\\\": {\\n      \\\"criteria\\\": {\\n        \\\"false\\\": \\\"The customer is unhappy.\\\",\\n        \\\"true\\\": \\\"The customer is happy.\\\"\\n      },\\n      \\\"instructions\\\": \\\"Is the sentiment positive?\\\",\\n      \\\"type\\\": \\\"noul\\\"\\n    },\\n    \\\"rating\\\": {\\n      \\\"criteria\\\": [\\n        \\\"Negative\\\",\\n        \\\"Neutral\\\",\\n        \\\"Positive\\\"\\n      ],\\n      \\\"instructions\\\": \\\"Rate sentiment.\\\",\\n      \\\"type\\\": \\\"score\\\"\\n    },\\n    \\\"sentiment\\\": {\\n      \\\"criteria\\\": {\\n        \\\"negative\\\": \\\"Negative sentiment\\\",\\n        \\\"neutral\\\": null,\\n        \\\"positive\\\": \\\"Positive sentiment\\\"\\n      },\\n      \\\"instructions\\\": \\\"Classify sentiment.\\\",\\n      \\\"type\\\": \\\"choice\\\"\\n    }\\n  },\\n  \\\"state\\\": \\\"The customer says: I love this product. It is wonderful!\\\"\\n}\")\nresult = client.router.classify.create(**request)\n\nfor name, answer in result.answers.items():\n    if answer.type == \"refusal\":\n        print(name, \"refused\")\n        continue\n    print(name, answer)"
      - label: 'cURL: OpenAI text'
        lang: bash
        source: "curl https://my.orq.ai/v3/router/classify \\\n  -H \"Authorization: Bearer $ORQ_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  --data-binary @- <<'JSON'\n{\n  \"model\": \"openai/gpt-6-luna\",\n  \"questions\": {\n    \"positive\": {\n      \"criteria\": {\n        \"false\": \"The customer is unhappy.\",\n        \"true\": \"The customer is happy.\"\n      },\n      \"instructions\": \"Is the sentiment positive?\",\n      \"type\": \"noul\"\n    },\n    \"rating\": {\n      \"criteria\": [\n        \"Negative\",\n        \"Neutral\",\n        \"Positive\"\n      ],\n      \"instructions\": \"Rate sentiment.\",\n      \"type\": \"score\"\n    },\n    \"sentiment\": {\n      \"criteria\": {\n        \"negative\": \"Negative sentiment\",\n        \"neutral\": null,\n        \"positive\": \"Positive sentiment\"\n      },\n      \"instructions\": \"Classify sentiment.\",\n      \"type\": \"choice\"\n    }\n  },\n  \"state\": \"The customer says: I love this product. It is wonderful!\"\n}\nJSON"
      - label: 'Node.js: OpenAI inline image'
        lang: typescript
        source: "import { Orq } from \"@orq-ai/node\";\n\nconst orq = new Orq({ apiKey: process.env[\"ORQ_API_KEY\"] ?? \"\" });\nconst result = await orq.router.classify.create({\n  \"model\": \"openai/gpt-6-luna\",\n  \"questions\": {\n    \"contains_text\": {\n      \"instructions\": \"Does the image contain text?\",\n      \"type\": \"noul\"\n    }\n  },\n  \"state\": [\n    {\n      \"content\": [\n        {\n          \"text\": \"Evaluate this image.\",\n          \"type\": \"input_text\"\n        },\n        {\n          \"image_url\": \"data:image/png;base64,\",\n          \"type\": \"input_image\"\n        }\n      ],\n      \"role\": \"user\"\n    }\n  ]\n});\n\nfor (const [name, answer] of Object.entries(result.answers)) {\n  if (answer.type === \"refusal\") {\n    console.log(name, \"refused\");\n    continue;\n  }\n  console.log(name, answer);\n}"
      - label: 'Python: OpenAI inline image'
        lang: python
        source: "import json\nimport os\nfrom orq_ai_sdk import Orq\n\nclient = Orq(api_key=os.environ[\"ORQ_API_KEY\"])\nrequest = json.loads(\"{\\n  \\\"model\\\": \\\"openai/gpt-6-luna\\\",\\n  \\\"questions\\\": {\\n    \\\"contains_text\\\": {\\n      \\\"instructions\\\": \\\"Does the image contain text?\\\",\\n      \\\"type\\\": \\\"noul\\\"\\n    }\\n  },\\n  \\\"state\\\": [\\n    {\\n      \\\"content\\\": [\\n        {\\n          \\\"text\\\": \\\"Evaluate this image.\\\",\\n          \\\"type\\\": \\\"input_text\\\"\\n        },\\n        {\\n          \\\"image_url\\\": \\\"data:image/png;base64,\\\",\\n          \\\"type\\\": \\\"input_image\\\"\\n        }\\n      ],\\n      \\\"role\\\": \\\"user\\\"\\n    }\\n  ]\\n}\")\nresult = client.router.classify.create(**request)\n\nfor name, answer in result.answers.items():\n    if answer.type == \"refusal\":\n        print(name, \"refused\")\n        continue\n    print(name, answer)"
      - label: 'cURL: OpenAI inline image'
        lang: bash
        source: "curl https://my.orq.ai/v3/router/classify \\\n  -H \"Authorization: Bearer $ORQ_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  --data-binary @- <<'JSON'\n{\n  \"model\": \"openai/gpt-6-luna\",\n  \"questions\": {\n    \"contains_text\": {\n      \"instructions\": \"Does the image contain text?\",\n      \"type\": \"noul\"\n    }\n  },\n  \"state\": [\n    {\n      \"content\": [\n        {\n          \"text\": \"Evaluate this image.\",\n          \"type\": \"input_text\"\n        },\n        {\n          \"image_url\": \"data:image/png;base64,\",\n          \"type\": \"input_image\"\n        }\n      ],\n      \"role\": \"user\"\n    }\n  ]\n}\nJSON"
      - label: 'Node.js: Fallbacks, retries and identity'
        lang: typescript
        source: "import { Orq } from \"@orq-ai/node\";\n\nconst orq = new Orq({ apiKey: process.env[\"ORQ_API_KEY\"] ?? \"\" });\nconst result = await orq.router.classify.create({\n  \"fallbacks\": [\n    {\n      \"model\": \"openai/gpt-5.6-luna\"\n    }\n  ],\n  \"identity\": {\n    \"displayName\": \"Sample customer\",\n    \"id\": \"customer-demo\"\n  },\n  \"model\": \"openai/gpt-6-luna\",\n  \"questions\": {\n    \"positive\": {\n      \"criteria\": {\n        \"false\": \"The customer is unhappy.\",\n        \"true\": \"The customer is happy.\"\n      },\n      \"instructions\": \"Is the sentiment positive?\",\n      \"type\": \"noul\"\n    },\n    \"rating\": {\n      \"criteria\": [\n        \"Negative\",\n        \"Neutral\",\n        \"Positive\"\n      ],\n      \"instructions\": \"Rate sentiment.\",\n      \"type\": \"score\"\n    },\n    \"sentiment\": {\n      \"criteria\": {\n        \"negative\": \"Negative sentiment\",\n        \"neutral\": null,\n        \"positive\": \"Positive sentiment\"\n      },\n      \"instructions\": \"Classify sentiment.\",\n      \"type\": \"choice\"\n    }\n  },\n  \"retry\": {\n    \"count\": 2,\n    \"onCodes\": [\n      429,\n      502,\n      503,\n      504\n    ]\n  },\n  \"state\": \"The customer says: I love this product. It is wonderful!\",\n  \"timeout\": {\n    \"callTimeout\": 2000\n  }\n});\n\nfor (const [name, answer] of Object.entries(result.answers)) {\n  if (answer.type === \"refusal\") {\n    console.log(name, \"refused\");\n    continue;\n  }\n  console.log(name, answer);\n}"
      - label: 'Python: Fallbacks, retries and identity'
        lang: python
        source: "import json\nimport os\nfrom orq_ai_sdk import Orq\n\nclient = Orq(api_key=os.environ[\"ORQ_API_KEY\"])\nrequest = json.loads(\"{\\n  \\\"fallbacks\\\": [\\n    {\\n      \\\"model\\\": \\\"openai/gpt-5.6-luna\\\"\\n    }\\n  ],\\n  \\\"identity\\\": {\\n    \\\"id\\\": \\\"customer-demo\\\",\\n    \\\"display_name\\\": \\\"Sample customer\\\"\\n  },\\n  \\\"model\\\": \\\"openai/gpt-6-luna\\\",\\n  \\\"questions\\\": {\\n    \\\"positive\\\": {\\n      \\\"criteria\\\": {\\n        \\\"false\\\": \\\"The customer is unhappy.\\\",\\n        \\\"true\\\": \\\"The customer is happy.\\\"\\n      },\\n      \\\"instructions\\\": \\\"Is the sentiment positive?\\\",\\n      \\\"type\\\": \\\"noul\\\"\\n    },\\n    \\\"rating\\\": {\\n      \\\"criteria\\\": [\\n        \\\"Negative\\\",\\n        \\\"Neutral\\\",\\n        \\\"Positive\\\"\\n      ],\\n      \\\"instructions\\\": \\\"Rate sentiment.\\\",\\n      \\\"type\\\": \\\"score\\\"\\n    },\\n    \\\"sentiment\\\": {\\n      \\\"criteria\\\": {\\n        \\\"negative\\\": \\\"Negative sentiment\\\",\\n        \\\"neutral\\\": null,\\n        \\\"positive\\\": \\\"Positive sentiment\\\"\\n      },\\n      \\\"instructions\\\": \\\"Classify sentiment.\\\",\\n      \\\"type\\\": \\\"choice\\\"\\n    }\\n  },\\n  \\\"retry\\\": {\\n    \\\"count\\\": 2,\\n    \\\"on_codes\\\": [\\n      429,\\n      502,\\n      503,\\n      504\\n    ]\\n  },\\n  \\\"state\\\": \\\"The customer says: I love this product. It is wonderful!\\\",\\n  \\\"timeout\\\": {\\n    \\\"call_timeout\\\": 2000\\n  }\\n}\")\nresult = client.router.classify.create(**request)\n\nfor name, answer in result.answers.items():\n    if answer.type == \"refusal\":\n        print(name, \"refused\")\n        continue\n    print(name, answer)"
      - label: 'cURL: Fallbacks, retries and identity'
        lang: bash
        source: "curl https://my.orq.ai/v3/router/classify \\\n  -H \"Authorization: Bearer $ORQ_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  --data-binary @- <<'JSON'\n{\n  \"fallbacks\": [\n    {\n      \"model\": \"openai/gpt-5.6-luna\"\n    }\n  ],\n  \"identity\": {\n    \"id\": \"customer-demo\",\n    \"display_name\": \"Sample customer\"\n  },\n  \"model\": \"openai/gpt-6-luna\",\n  \"questions\": {\n    \"positive\": {\n      \"criteria\": {\n        \"false\": \"The customer is unhappy.\",\n        \"true\": \"The customer is happy.\"\n      },\n      \"instructions\": \"Is the sentiment positive?\",\n      \"type\": \"noul\"\n    },\n    \"rating\": {\n      \"criteria\": [\n        \"Negative\",\n        \"Neutral\",\n        \"Positive\"\n      ],\n      \"instructions\": \"Rate sentiment.\",\n      \"type\": \"score\"\n    },\n    \"sentiment\": {\n      \"criteria\": {\n        \"negative\": \"Negative sentiment\",\n        \"neutral\": null,\n        \"positive\": \"Positive sentiment\"\n      },\n      \"instructions\": \"Classify sentiment.\",\n      \"type\": \"choice\"\n    }\n  },\n  \"retry\": {\n    \"count\": 2,\n    \"on_codes\": [\n      429,\n      502,\n      503,\n      504\n    ]\n  },\n  \"state\": \"The customer says: I love this product. It is wonderful!\",\n  \"timeout\": {\n    \"call_timeout\": 2000\n  }\n}\nJSON"
      x-orq-gateway-group: true
      x-speakeasy-group: router.classify
      x-speakeasy-name-override: create
components:
  schemas:
    ClassifyTimeoutConfig:
      additionalProperties: false
      properties:
        call_timeout:
          description: Timeout in milliseconds for each model call. Set 2000 for two seconds. When retry is configured, timeout errors (408) are automatically retried.
          format: int64
          minimum: 1
          type: integer
      required:
      - call_timeout
      type: object
    ClassifyBoxAnswer:
      additionalProperties: false
      properties:
        box:
          $ref: '#/components/schemas/ClassifyBox'
          description: The bounding box of the target. Present for box answers.
        confidence:
          description: 'How sure the model is of the answer it selected: on emulated chat models the largest value in probabilities, so it adds nothing the distribution does not; native providers return their own confidence value, which can sit below the largest probability. Present for choice, score and box answers.'
          format: double
          type: number
        type:
          enum:
          - box
          type: string
      required:
      - type
      - box
      title: ClassifyBoxAnswer
      type: object
    ClassifyInputTokensDetails:
      additionalProperties: false
      properties:
        cache_write_tokens:
          description: Input tokens written to cache.
          format: int64
          type: integer
        cached_tokens:
          description: Input tokens read from cache.
          format: int64
          type: integer
      required:
      - cached_tokens
      - cache_write_tokens
      type: object
    ClassifyRetryConfig:
      additionalProperties: false
      properties:
        count:
          description: Number of retries per model after the initial attempt (1-5). No retries are made when retry is omitted.
          format: int64
          maximum: 5
          minimum: 1
          type: integer
        on_codes:
          description: HTTP status codes that trigger retries, between 100 and 599. Retry-After is honored; otherwise the gateway waits one second.
          items:
            format: int64
            maximum: 599
            minimum: 100
            type: integer
          minItems: 1
          type: array
      required:
      - count
      - on_codes
      type: object
    ClassifyScoreAnswer:
      additionalProperties: false
      properties:
        confidence:
          description: 'How sure the model is of the answer it selected: on emulated chat models the largest value in probabilities, so it adds nothing the distribution does not; native providers return their own confidence value, which can sit below the largest probability. Present for choice, score and box answers.'
          format: double
          type: number
        legend:
          additionalProperties:
            type: string
          description: Level index to level description. Present for score answers.
          type: object
        probabilities:
          additionalProperties:
            format: double
            type: number
          description: Probability distribution over the options or levels. Present for choice and score answers.
          type: object
        score:
          description: 'Position on the scale, not an index: on emulated chat models and OpenAI Decisions the weighted index, each level index multiplied by that level probability and summed, so the value is usually fractional; typesafe/jev-latest returns its own score. Present for score answers.'
          format: double
          type: number
        type:
          enum:
          - score
          type: string
      required:
      - type
      - score
      title: ClassifyScoreAnswer
      type: object
    ClassifyNoulAnswer:
      additionalProperties: false
      properties:
        noul:
          description: Probability between 0 and 1 that the statement holds. Present for noul answers.
          format: double
          type: number
        type:
          enum:
          - noul
          type: string
      required:
      - type
      - noul
      title: ClassifyNoulAnswer
      type: object
    FallbackConfig:
      additionalProperties: false
      properties:
        model:
          type: string
      required:
      - model
      type: object
    ClassifyAsset:
      additionalProperties: false
      properties:
        data_base64:
          description: 'Standard base64 with padding, without whitespace or a data: prefix. PNG or JPEG still images, 256 to 1568 px per side, at most 16 MiB each.'
          type: string
        format:
          description: The image format.
          enum:
          - png
          - jpg
          - jpeg
          type: string
        type:
          description: The asset type. Only image is supported.
          enum:
          - image
          type: string
      required:
      - data_base64
      - format
      type: object
    ResponseTelemetry:
      additionalProperties: false
      properties:
        span_id:
          type: string
        trace_id:
          type: string
      required:
      - trace_id
      - span_id
      type: object
    ClassifyChoiceAnswer:
      additionalProperties: false
      properties:
        choice:
          description: The selected option. Present for choice answers.
          type: string
        confidence:
          description: 'How sure the model is of the answer it selected: on emulated chat models the largest value in probabilities, so it adds nothing the distribution does not; native providers return their own confidence value, which can sit below the largest probability. Present for choice, score and box answers.'
          format: double
          type: number
        probabilities:
          additionalProperties:
            format: double
            type: number
          description: Probability distribution over the options or levels. Present for choice and score answers.
          type: object
        type:
          enum:
          - choice
          type: string
      required:
      - type
      - choice
      title: ClassifyChoiceAnswer
      type: object
    ResponseIdentity:
      additionalProperties: false
      properties:
        display_name:
          type: string
        email:
          type: string
        id:
          type: string
        metadata:
          items:
            additionalProperties: {}
            type: object
          type:
          - array
          - 'null'
        tags:
          items:
            type: string
          type:
          - array
          - 'null'
      required:
      - id
      type: object
    ClassifyCacheConfig:
      additionalProperties: false
      properties:
        ttl:
          description: Time to live for the cached response in seconds, up to 259200 (3 days). Defaults to 3600.
          format: int64
          maximum: 259200
          minimum: 1
          type: integer
        type:
          description: Cache type. Only exact_match is supported.
          enum:
          - exact_match
          type: string
      required:
      - type
      type: object
    ClassifyAnswer:
      description: One answer to a classification question. The type selects the answer fields. A refusal contains only type.
      discriminator:
        mapping:
          box: '#/components/schemas/ClassifyBoxAnswer'
          choice: '#/components/schemas/ClassifyChoiceAnswer'
          noul: '#/components/schemas/ClassifyNoulAnswer'
          refusal: '#/components/schemas/ClassifyRefusalAnswer'
          score: '#/components/schemas/ClassifyScoreAnswer'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/ClassifyNoulAnswer'
      - $ref: '#/components/schemas/ClassifyChoiceAnswer'
      - $ref: '#/components/schemas/ClassifyScoreAnswer'
      - $ref: '#/components/schemas/ClassifyBoxAnswer'
      - $ref: '#/components/schemas/ClassifyRefusalAnswer'
    APIError:
      additionalProperties: false
      properties:
        code:
          type:
          - string
          - 'null'
        failures: {}
        message:
          type: string
        param:
          type:
          - string
          - 'null'
        type:
          type: string
      required:
      - message
      - type
      - param
      - code
      type: object
    ClassifyUsage:
      additionalProperties: false
      properties:
        input_cost:
          description: Cost (USD) of input tokens. Present when billing was computed for this request.
          format: double
          type: number
        input_tokens:
          description: The number of input tokens processed.
          format: int64
          type: integer
        input_tokens_details:
          $ref: '#/components/schemas/ClassifyInputTokensDetails'
          description: Provider-reported cache token usage. OpenAI Decisions does not charge for cache reads or writes.
        output_cost:
          description: Cost (USD) of output tokens. 0 for native classify providers, including OpenAI Decisions. Present when billing was computed for this request.
          format: double
          type: number
        output_tokens:
          description: The number of output tokens generated. Free for native classify providers, billed at the model rate for emulated chat models.
          format: int64
          type: integer
        total_cost:
          description: Total cost (USD) of the request. Present when billing was computed for this request.
          format: double
          type: number
      required:
      - input_tokens
      - output_tokens
      type: object
    ClassifyBox:
      additionalProperties: false
      properties:
        bottom:
          description: Distance of the bottom edge from the top of the image, as a fraction of the image height.
          format: double
          maximum: 1
          minimum: 0
          type: number
        left:
          description: Distance of the left edge from the left of the image, as a fraction of the image width.
          format: double
          maximum: 1
          minimum: 0
          type: number
        right:
          description: Distance of the right edge from the left of the image, as a fraction of the image width.
          format: double
          maximum: 1
          minimum: 0
          type: number
        top:
          description: Distance of the top edge from the top of the image, as a fraction of the image height.
          format: double
          maximum: 1
          minimum: 0
          type: number
      required:
      - top
      - bottom
      - left
      - right
      type: object
    ClassifyRefusalAnswer:
      additionalProperties: false
      properties:
        type:
          enum:
          - refusal
          type: string
      required:
      - type
      title: ClassifyRefusalAnswer
      type: object
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  url: https://docs.orq.ai
  description: orq.ai Documentation
x-speakeasy-timeout: 600000
