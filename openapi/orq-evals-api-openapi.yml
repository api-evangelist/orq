openapi: 3.2.0
info:
  title: orq.ai Evals API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- name: Evals
  description: Run an evaluator against a conversation and its result
paths:
  /v2/evaluators:
    get:
      tags:
      - Evals
      summary: Get all Evaluators
      description: List all evaluators in the workspace.
      operationId: GetEvals
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
          description: A limit on the number of objects to be returned. Limit can range between 1 and 200, and the default is 10
        required: false
        description: A limit on the number of objects to be returned. Limit can range between 1 and 200, and the default is 10
        name: limit
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        required: false
        description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        name: starting_after
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        required: false
        description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        name: ending_before
        in: query
      - schema:
          type: string
        required: false
        name: search
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
        required: false
        name: sort
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: project_id
        in: query
      responses:
        '200':
          description: Returns a list of evals
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  data:
                    type: array
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/EvaluatorResponseLlm'
                      - $ref: '#/components/schemas/EvaluatorResponseJsonSchema'
                      - $ref: '#/components/schemas/EvaluatorResponseHttp'
                      - $ref: '#/components/schemas/EvaluatorResponsePython'
                      - $ref: '#/components/schemas/EvaluatorResponseFunction'
                      - $ref: '#/components/schemas/EvaluatorResponseRagas'
                      - $ref: '#/components/schemas/EvaluatorResponseTypescript'
                      discriminator:
                        propertyName: type
                        mapping:
                          llm_eval: '#/components/schemas/EvaluatorResponseLlm'
                          json_schema: '#/components/schemas/EvaluatorResponseJsonSchema'
                          http_eval: '#/components/schemas/EvaluatorResponseHttp'
                          python_eval: '#/components/schemas/EvaluatorResponsePython'
                          function_eval: '#/components/schemas/EvaluatorResponseFunction'
                          ragas: '#/components/schemas/EvaluatorResponseRagas'
                          typescript_eval: '#/components/schemas/EvaluatorResponseTypescript'
                  has_more:
                    type: boolean
                required:
                - object
                - data
                - has_more
        '404':
          description: Workspace ID is not found on the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
      x-speakeasy-group: evals
      x-speakeasy-name-override: all
      x-cli-group: evals
      x-cli-name: all
      x-code-samples:
      - lang: typescript
        label: Node.js - List evaluators
        source: 'import { Orq } from ''@orq-ai/node'';


          const orq = new Orq({ apiKey: process.env.ORQ_API_KEY });

          const evaluators = await orq.evals.all({ limit: 20 });


          console.log(evaluators.data);

          '
