      responses:
        '200':
          description: Represents a completion response from the API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: A unique identifier for the completion.
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        finish_reason:
                          type: string
                          enum:
                          - stop
                          - length
                          - content_filter
                          - tool_calls
                          description: The reason the model stopped generating tokens.
                        index:
                          type: number
                          description: The index of the choice in the list of choices.
                        text:
                          type: string
                      required:
                      - finish_reason
                      - index
                      - text
                    description: The list of completion choices the model generated for the input prompt.
                  created:
                    anyOf:
                    - type: string
                    - type: number
                    description: The Unix timestamp (in seconds) of when the chat completion was created.
                  model:
                    type: string
                    description: The model used for the chat completion.
                  system_fingerprint:
                    type: string
                    description: This fingerprint represents the backend configuration that the model runs with.
                  object:
                    type: string
                    description: The object type
                  usage:
                    type: object
                    properties:
                      completion_tokens:
                        type: number
                        description: Number of tokens in the generated completion.
                      prompt_tokens:
                        type: number
                        description: Number of tokens in the prompt.
                      total_tokens:
                        type: number
                        description: Total number of tokens used in the request (prompt + completion).
                      prompt_tokens_details:
                        type:
                        - object
                        - 'null'
                        properties:
                          cached_tokens:
                            type:
                            - integer
                            - 'null'
                          cache_creation_tokens:
                            type:
                            - integer
                            - 'null'
                          audio_tokens:
                            type:
                            - integer
                            - 'null'
                            description: The number of audio input tokens consumed by the request.
                      completion_tokens_details:
                        type:
                        - object
                        - 'null'
                        properties:
                          reasoning_tokens:
                            type:
                            - number
                            - 'null'
                          accepted_prediction_tokens:
                            type:
                            - number
                            - 'null'
                          rejected_prediction_tokens:
                            type:
                            - number
                            - 'null'
                          audio_tokens:
                            type:
                            - integer
                            - 'null'
                            description: The number of audio output tokens produced by the response.
                    description: Usage statistics for the completion request.
                required:
                - id
                - choices
                - model
                - object
            text/event-stream:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: A unique identifier for the completion.
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        finish_reason:
                          type: string
                          enum:
                          - stop
                          - length
                          - content_filter
                          - tool_calls
                          description: The reason the model stopped generating tokens.
                        index:
                          type: number
                          description: The index of the choice in the list of choices.
                        text:
                          type: string
                      required:
                      - finish_reason
                      - index
                      - text
                    description: The list of completion choices the model generated for the input prompt.
                  created:
                    anyOf:
                    - type: string
                    - type: number
                    description: The Unix timestamp (in seconds) of when the chat completion was created.
                  model:
                    type: string
                    description: The model used for the chat completion.
                  system_fingerprint:
                    type: string
                    description: This fingerprint represents the backend configuration that the model runs with.
                  object:
                    type: string
                    description: The object type
                  usage:
                    type: object
                    properties:
                      completion_tokens:
                        type: number
                        description: Number of tokens in the generated completion.
                      prompt_tokens:
                        type: number
                        description: Number of tokens in the prompt.
                      total_tokens:
                        type: number
                        description: Total number of tokens used in the request (prompt + completion).
                      prompt_tokens_details:
                        type:
                        - object
                        - 'null'
                        properties:
                          cached_tokens:
                            type:
                            - integer
                            - 'null'
                          cache_creation_tokens:
                            type:
                            - integer
                            - 'null'
                          audio_tokens:
                            type:
                            - integer
                            - 'null'
                            description: The number of audio input tokens consumed by the request.
                      completion_tokens_details:
                        type:
                        - object
                        - 'null'
                        properties:
                          reasoning_tokens:
                            type:
                            - number
                            - 'null'
                          accepted_prediction_tokens:
                            type:
                            - number
                            - 'null'
                          rejected_prediction_tokens:
                            type:
                            - number
                            - 'null'
                          audio_tokens:
                            type:
                            - integer
                            - 'null'
                            description: The number of audio output tokens produced by the response.
                    description: Usage statistics for the completion request.
                required:
                - id
                - choices
                - model
                - object
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
components:
  schemas:
    APIErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/APIError'
      required:
      - error
    PublicContact:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the contact
          example: contact_01ARZ3NDEKTSV4RRFFQ69G5FAV
        display_name:
          type: string
          description: Display name of the contact
          example: Jane Doe
        email:
          type: string
          format: email
          description: Email address of the contact
          example: jane.doe@example.com
        metadata:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: A hash of key/value pairs containing any other data about the contact
          example:
          - department: Engineering
            role: Senior Developer
        logo_url:
          type: string
          description: URL to the contact's avatar or logo
          example: https://example.com/avatars/jane-doe.jpg
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the contact
          example:
          - hr
          - engineering
      required:
      - id
      description: '@deprecated Use identity instead. Information about the contact making the request.'
      deprecated: true
    ThinkingConfigAdaptiveSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - adaptive
          description: Lets the model dynamically determine when and how much to use extended thinking based on the complexity of each request. Supported on Claude Opus 4.6 and Sonnet 4.6.
      required:
      - type
      title: Thinking config adaptive
      description: Enables adaptive thinking mode where the model dynamically determines thinking depth
    PublicIdentity:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the contact
          example: contact_01ARZ3NDEKTSV4RRFFQ69G5FAV
        display_name:
          type: string
          description: Display name of the contact
          example: Jane Doe
        email:
          type: string
          format: email
          description: Email address of the contact
          example: jane.doe@example.com
        metadata:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: A hash of key/value pairs containing any other data about the contact
          example:
          - department: Engineering
            role: Senior Developer
        logo_url:
          type: string
          description: URL to the contact's avatar or logo
          example: https://example.com/avatars/jane-doe.jpg
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the contact
          example:
          - hr
          - engineering
      required:
      - id
      description: Information about the identity making the request. If the identity does not exist, it will be created automatically.
    APIError:
      additionalProperties: false
      properties:
        code:
          type:
          - string
          - 'null'
        failures: {}
        message:
          type: string
        param:
          type:
          - string
          - 'null'
        type:
          type: string
      required:
      - message
      - type
      - param
      - code
      type: object
    ThinkingConfigDisabledSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - disabled
          description: Disables the thinking mode capability
      required:
      - type
      title: Thinking config disabled
      description: Disables the thinking mode capability
    ThinkingConfigEnabledSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - enabled
          description: Enables or disables the thinking mode capability
        budget_tokens:
          type: number
          description: Determines how many tokens the model can use for its internal reasoning process. Larger budgets can enable more thorough analysis for complex problems, improving response quality. Must be ≥1024 and less than `max_tokens`.
        thinking_level:
          type: string
          enum:
          - minimal
          - low
          - medium
          - high
          description: The level of reasoning the model should use. This setting is supported only by `gemini-3` models. If budget_tokens is specified and `thinking_level` is available, `budget_tokens` will be ignored.
      required:
      - type
      - budget_tokens
      title: Thinking config enabled
      description: Enables the thinking mode capability
    PIIRedactionPlugin:
      type: object
      properties:
        id:
          type: string
          enum:
          - pii_redaction
          description: PII redaction plugin.
        language:
          type: string
          description: Detector language. Accepts "auto" to detect the language per request; GET /v2/pii/capabilities lists the concrete languages and does not include "auto". Omitting the field defaults to "auto".
        regions:
          type: array
          items:
            type: string
          description: 'Region codes selecting whole regions of coverage (e.g. "nl", "gb"). Every entity type those regions cover is redacted, alongside the base catalog. ["all"] is exclusive, and leaving both this and entities empty also runs every region, so selecting nothing is the widest request rather than the narrowest. Combines with entities: the two selections are unioned, so entities adds types on top of the region coverage.'
        entities:
          type: array
          items:
            type: string
          description: The entity types to redact. A named type is redacted even when it belongs to a region, so a region's types can be selected individually without naming the region. On its own this is a strict allowlist; alongside regions it adds to the region coverage. See GET /v2/pii/capabilities for valid types.
        entity_thresholds:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          description: Per-entity confidence cutoff overrides in [0,1]. Tunes confidence only and never changes which types are redacted, so every key must also appear in entities.
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Baseline confidence cutoff applied to every entity type without a per-entity override.
        on_failure:
          type: string
          enum:
          - block
          - passthrough
          description: Behaviour when detection fails.
      required:
      - id
      additionalProperties: false
      title: PII redaction plugin
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  url: https://docs.orq.ai
  description: orq.ai Documentation
x-speakeasy-timeout: 600000
