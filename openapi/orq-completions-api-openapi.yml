openapi: 3.2.0
info:
  title: orq.ai Completions API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- name: Completions
paths:
  /v2/router/completions:
    post:
      operationId: createCompletion
      summary: Create completion
      tags:
      - Completions
      x-speakeasy-group: router.completions
      x-speakeasy-name-override: create
      x-cli-group: completions
      x-cli-name: create
      x-speakeasy-ignore: false
      x-orq-gateway-group: 'true'
      description: For sending requests to legacy completion models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  model:
                    type: string
                    description: ID of the model to use
                  prompt:
                    type: string
                    description: The prompt(s) to generate completions for, encoded as a string, array of strings, array of tokens, or array of token arrays.
                  echo:
                    type:
                    - boolean
                    - 'null'
                    default: false
                    description: Echo back the prompt in addition to the completion
                  frequency_penalty:
                    type:
                    - number
                    - 'null'
                    default: 0
                    description: Number between -2.0 and 2.0. Positive values penalize new tokens based on their existing frequency in the text so far, decreasing the model's likelihood to repeat the same line verbatim.
                  max_tokens:
                    type:
                    - integer
                    - 'null'
                    default: 16
                    description: The maximum number of tokens that can be generated in the completion.
                  presence_penalty:
                    type:
                    - number
                    - 'null'
                    minimum: -2
                    maximum: 2
                    default: 0
                    description: Number between -2.0 and 2.0. Positive values penalize new tokens based on whether they appear in the text so far, increasing the model's likelihood to talk about new topics.
                  seed:
                    type:
                    - integer
                    - 'null'
                    description: If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same seed and parameters should return the same result.
                  stop:
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                    - type: 'null'
                    default: null
                    description: Up to 4 sequences where the API will stop generating further tokens. The returned text will not contain the stop sequence.
                  temperature:
                    type:
                    - number
                    - 'null'
                    default: 1
                    description: What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
                  top_p:
                    type:
                    - number
                    - 'null'
                    default: 1
                    description: An alternative to sampling with temperature, called nucleus sampling, where the model considers the results of the tokens with top_p probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered.
                  n:
                    type:
                    - integer
                    - 'null'
                    default: 1
                    description: 'How many completions to generate for each prompt. Note: Because this parameter generates many completions, it can quickly consume your token quota.'
                  user:
                    type: string
                    description: A unique identifier representing your end-user, which can help monitor and detect abuse.
                  name:
                    type: string
                    description: The name to display on the trace. If not specified, the default system name will be used.
                  fallbacks:
                    type: array
                    items:
                      type: object
                      properties:
                        model:
                          type: string
                          description: Fallback model identifier
                      required:
                      - model
                    description: Array of fallback models to use if primary model fails
                  retry:
                    type: object
                    properties:
                      count:
                        type: number
                        minimum: 1
                        maximum: 5
                        default: 3
                        description: Number of retry attempts (1-5)
                        example: 3
                      on_codes:
                        type: array
                        items:
                          type: number
                          minimum: 100
                          maximum: 599
                        minItems: 1
                        description: HTTP status codes that trigger retry logic
                        example:
                        - 429
                        - 500
                        - 502
                        - 503
                        - 504
                    description: Retry configuration for the request
                  cache:
                    type: object
                    properties:
                      ttl:
                        type: number
                        minimum: 1
                        maximum: 259200
                        default: 3600
                        description: Time to live for cached responses in seconds. Maximum 259200 seconds (3 days).
                        example: 3600
                      type:
                        type: string
                        enum:
                        - exact_match
                    required:
                    - type
                    description: Cache configuration for the request.
                  load_balancer:
                    oneOf:
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - weight_based
                        models:
                          type: array
                          items:
                            type: object
                            properties:
                              model:
                                type: string
                                description: Model identifier for load balancing
                                example: openai/gpt-5.6-sol
                              weight:
                                type: number
                                minimum: 0.001
                                maximum: 1
                                default: 0.5
                                description: Weight assigned to this model for load balancing
                                example: 0.7
                            required:
                            - model
                      required:
                      - type
                      - models
                    description: Load balancer configuration for the request.
                  timeout:
                    type: object
                    properties:
                      call_timeout:
                        type: number
                        minimum: 1
                        description: Timeout value in milliseconds
                        example: 30000
                    required:
                    - call_timeout
                    description: Timeout configuration to apply to the request. If the request exceeds the timeout, it will be retried or fallback to the next model if configured.
                  thinking:
                    oneOf:
                    - $ref: '#/components/schemas/ThinkingConfigDisabledSchema'
                    - $ref: '#/components/schemas/ThinkingConfigEnabledSchema'
                    - $ref: '#/components/schemas/ThinkingConfigAdaptiveSchema'
                    - type: 'null'
                    description: Configuration for the thinking mode capability. Set type to `adaptive` for models that support adaptive thinking (e.g. Claude Opus 4.6, Sonnet 4.6), or `enabled` with `budget_tokens` for manual control.
                  plugins:
                    type: array
                    items:
                      $ref: '#/components/schemas/PIIRedactionPlugin'
                    description: Request-scoped transforms applied to the text exchanged with the model. Currently supports `pii_redaction`, which replaces PII with placeholders before the provider sees it and restores the original values in the response.
                  orq:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The name to display on the trace. If not specified, the default system name will be used.
                      retry:
                        type: object
                        properties:
                          count:
                            type: number
                            minimum: 1
                            maximum: 5
                            default: 3
                            description: Number of retry attempts (1-5)
                            example: 3
                          on_codes:
                            type: array
                            items:
                              type: number
                              minimum: 100
                              maximum: 599
                            minItems: 1
                            description: HTTP status codes that trigger retry logic
                            example:
                            - 429
                            - 500
                            - 502
                            - 503
                            - 504
                        description: Retry configuration for the request
                      fallbacks:
                        type: array
                        items:
                          type: object
                          properties:
                            model:
                              type: string
                              description: Fallback model identifier
                              example: openai/gpt-5.4-mini
                          required:
                          - model
                        description: Array of fallback models to use if primary model fails
                      prompt:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique identifier of the prompt to use
                            example: prompt_01ARZ3NDEKTSV4RRFFQ69G5FAV
                          version:
                            type: string
                            enum:
                            - latest
                            description: Version of the prompt to use (currently only "latest" supported)
                            example: latest
                        required:
                        - id
                        - version
                        description: Prompt configuration for the request
                      identity:
                        $ref: '#/components/schemas/PublicIdentity'
                      contact:
                        $ref: '#/components/schemas/PublicContact'
                      thread:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique thread identifier to group related invocations.
                            example: thread_01ARZ3NDEKTSV4RRFFQ69G5FAV
                          tags:
                            type: array
                            items:
                              type: string
                            description: Optional tags to differentiate or categorize threads
                            example:
                            - customer-support
                            - priority-high
                        required:
                        - id
                        description: Thread information to group related requests
                      inputs:
                        anyOf:
                        - type: object
                          additionalProperties: {}
                        - type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              value: {}
                              is_pii:
                                type: boolean
                            required:
                            - key
                        deprecated: true
                        description: '@deprecated Use top-level `variables` field instead. Values to replace in the prompt messages using {{variableName}} syntax.'
                        example:
                          customer_name: John Smith
                          product_name: Premium Plan
                          issue_type: billing
                      cache:
                        type: object
                        properties:
                          ttl:
                            type: number
                            minimum: 1
                            maximum: 259200
                            default: 3600
                            description: Time to live for cached responses in seconds. Maximum 259200 seconds (3 days).
                            example: 3600
                          type:
                            type: string
                            enum:
                            - exact_match
                        required:
                        - type
                        description: Cache configuration for the request.
                      knowledge_bases:
                        type: array
                        items:
                          type: object
                          properties:
                            top_k:
                              type:
                              - integer
                              - 'null'
                              minimum: 1
                              maximum: 100
                              description: The number of results to return. Send `null` or omit to use the knowledge base configured `top_k`.
                            threshold:
                              type:
                              - number
                              - 'null'
                              minimum: 0
                              maximum: 1
                              description: The threshold to apply to the search. Send `null` or omit to use the knowledge base configured `threshold`
                            search_type:
                              type:
                              - string
                              - 'null'
                              enum:
                              - vector_search
                              - keyword_search
                              - hybrid_search
                              - null
                              description: The type of search to perform. Send `null` or omit to use the knowledge base configured `retrieval_type`
                            filter_by:
                              anyOf:
                              - type: object
                                additionalProperties:
                                  anyOf:
                                  - type: object
                                    properties:
                                      eq:
                                        anyOf:
                                        - type: string
                                          title: string
                                          description: String
                                        - type: number
