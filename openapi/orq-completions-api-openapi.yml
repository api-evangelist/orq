                              description: The metadata filter to apply to the search. Check the [Searching a Knowledge Base](https://docs.orq.ai/ai-studio/ai-engineering/knowledge-bases#search-a-knowledge-base) for more information.
                            search_options:
                              type: object
                              properties:
                                include_vectors:
                                  type: boolean
                                  description: Whether to include the vector in the chunk
                                include_metadata:
                                  type: boolean
                                  description: Whether to include the metadata in the chunk
                                include_scores:
                                  type: boolean
                                  description: Whether to include the scores in the chunk
                              description: Additional search options
                            rerank_config:
                              type: object
                              properties:
                                model:
                                  type: string
                                  description: The name of the rerank model to use. Refer to the [model list](https://docs.orq.ai/ai-gateway/supported-models#rerank-models).
                                  example: cohere/rerank-v4.0-pro
                                threshold:
                                  type: number
                                  minimum: 0
                                  maximum: 1
                                  default: 0
                                  description: The threshold value used to filter the rerank results, only documents with a relevance score greater than the threshold will be returned
                                top_k:
                                  type: integer
                                  minimum: 1
                                  maximum: 100
                                  default: 10
                                  description: The number of top results to return after reranking. Defaults to `10`.
                              required:
                              - model
                              description: Override the rerank configuration for this search. If not provided, will use the knowledge base configured rerank settings.
                            agentic_rag_config:
                              type: object
                              properties:
                                model:
                                  type: string
                                  description: The name of the model for the Agent to use. Refer to the [model list](https://docs.orq.ai/ai-gateway/supported-models#chat-models).
                              required:
                              - model
                              description: Override the agentic RAG configuration for this search. If not provided, will use the knowledge base configured agentic RAG settings.
                            knowledge_id:
                              type: string
                              description: Unique identifier of the knowledge base to search
                              example: customer-knowledge-base
                            query:
                              type: string
                              description: The query to use to search the knowledge base. If not provided we will use the last user message from the messages of the requests
