openapi: 3.2.0
info:
  title: orq.ai MCP Gateway API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- name: MCP Gateway
  description: Register upstream MCP servers, discover and sync their tools, and assemble gateways that expose a curated tool surface to MCP clients.
paths:
  /v2/mcp-gateways:
    get:
      tags:
      - MCP Gateway
      summary: List MCP gateways
      description: Returns a paginated list of MCP gateways in the workspace.
      operationId: McpGatewayList
      parameters:
      - name: limit
        in: query
        description: Page size between 1 and 200. Defaults to 25.
        schema:
          type: integer
          format: int32
      - name: starting_after
        in: query
        description: Cursor for the page after the given item id. Mutually exclusive with `ending_before`.
        schema:
          type: string
      - name: ending_before
        in: query
        description: Cursor for the page before the given item id. Mutually exclusive with `starting_after`.
        schema:
          type: string
      - name: search
        in: query
        description: Case-insensitive match against the gateway key and display name.
        schema:
          type: string
      - name: status
        in: query
        description: Returns only gateways in this status.
        schema:
          $ref: '#/components/schemas/McpGatewayStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMcpGatewaysResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: mcpGateways
      x-speakeasy-name-override: list
      x-cli-group: mcpGateways
      x-cli-name: list
      x-code-samples:
      - lang: curl
        label: Core - List MCP gateways
        source: "curl --get 'https://my.orq.ai/v2/mcp-gateways' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --data-urlencode 'limit=25' \\\n  --data-urlencode 'status=MCP_GATEWAY_STATUS_ACTIVE'\n"
      - lang: python
        label: Python - List MCP gateways
        source: "import os\nfrom orq_ai_sdk import Orq\n\nclient = Orq(api_key=os.environ[\"ORQ_API_KEY\"])\n\npage = client.mcp_gateways.list(\n    limit=25,\n    status=\"MCP_GATEWAY_STATUS_ACTIVE\",\n)\n\nfor gateway in page.data:\n    print(gateway.key, gateway.public_url, gateway.exposed_tools_count)\n"
      - lang: typescript
        label: Node.js - List MCP gateways
        source: "import { Orq } from '@orq-ai/node';\n\nconst client = new Orq({\n  apiKey: process.env.ORQ_API_KEY,\n});\n\nconst page = await client.mcpGateways.list({\n  limit: 25,\n  status: 'MCP_GATEWAY_STATUS_ACTIVE',\n});\n\nfor (const gateway of page.data) {\n  console.log(gateway.key, gateway.publicUrl, gateway.exposedToolsCount);\n}\n"
    post:
      tags:
      - MCP Gateway
      summary: Create an MCP gateway
      description: Creates a client-facing MCP gateway that links one or more synced upstream servers and exposes a unified MCP endpoint.
      operationId: McpGatewayCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMcpGatewayRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMcpGatewayResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: mcpGateways
      x-speakeasy-name-override: create
      x-cli-group: mcpGateways
      x-cli-name: create
      x-code-samples:
      - lang: curl
        label: Core - Create MCP gateway
        source: "curl --request POST \\\n  --url 'https://my.orq.ai/v2/mcp-gateways' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"key\": \"support-desk\",\n    \"display_name\": \"Support Desk\",\n    \"description\": \"Tools the support agent is allowed to call.\",\n    \"server_links\": [\n      {\n        \"mcp_server_id\": \"01JQ0K5R8N2ZC7X4M9T3V6HWBD\",\n        \"alias\": \"github\",\n        \"enabled\": true,\n        \"tool_exposure\": { \"mode\": \"MCP_TOOL_EXPOSURE_MODE_ALL\" }\n      }\n    ],\n    \"tool_naming\": \"MCP_TOOL_NAMING_PREFIX_ON_COLLISION\",\n    \"mode\": \"MCP_GATEWAY_MODE_DIRECT\"\n  }'\n"
      - lang: python
        label: Python - Create MCP gateway
        source: "import os\nfrom orq_ai_sdk import Orq\n\nclient = Orq(api_key=os.environ[\"ORQ_API_KEY\"])\n\n# Each link needs an alias and a tool_exposure; both are required.\nresult = client.mcp_gateways.create(\n    key=\"support-desk\",\n    display_name=\"Support Desk\",\n    description=\"Tools the support agent is allowed to call.\",\n    server_links=[\n        {\n            \"mcp_server_id\": \"01JQ0K5R8N2ZC7X4M9T3V6HWBD\",\n            \"alias\": \"github\",\n            \"enabled\": True,\n            \"tool_exposure\": {\"mode\": \"MCP_TOOL_EXPOSURE_MODE_ALL\"},\n        },\n    ],\n    tool_naming=\"MCP_TOOL_NAMING_PREFIX_ON_COLLISION\",\n    mode=\"MCP_GATEWAY_MODE_DIRECT\",\n)\n\nprint(result.mcp_gateway.public_url)\n"
      - lang: typescript
        label: Node.js - Create MCP gateway
        source: "import { Orq } from '@orq-ai/node';\n\nconst client = new Orq({\n  apiKey: process.env.ORQ_API_KEY,\n});\n\n// Each link needs an alias and a toolExposure; both are required.\nconst result = await client.mcpGateways.create({\n  key: 'support-desk',\n  displayName: 'Support Desk',\n  description: 'Tools the support agent is allowed to call.',\n  serverLinks: [\n    {\n      mcpServerId: '01JQ0K5R8N2ZC7X4M9T3V6HWBD',\n      alias: 'github',\n      enabled: true,\n      toolExposure: { mode: 'MCP_TOOL_EXPOSURE_MODE_ALL' },\n    },\n  ],\n  toolNaming: 'MCP_TOOL_NAMING_PREFIX_ON_COLLISION',\n  mode: 'MCP_GATEWAY_MODE_DIRECT',\n});\n\nconsole.log(result.mcpGateway.publicUrl);\n"
  /v2/mcp-gateways/{gateway_id}/tools:
    get:
      tags:
      - MCP Gateway
      summary: List exposed tools for a gateway
      description: Returns the namespaced tool view for a gateway.
      operationId: McpGatewayListTools
      parameters:
      - name: gateway_id
        in: path
        description: Unique identifier of the MCP gateway.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size between 1 and 200. Defaults to 25.
        schema:
          type: integer
          format: int32
      - name: starting_after
        in: query
        description: Cursor for the page after the given `exposed_name`. Mutually exclusive with `ending_before`.
        schema:
          type: string
      - name: ending_before
        in: query
        description: Cursor for the page before the given `exposed_name`. Mutually exclusive with `starting_after`.
        schema:
          type: string
      - name: mcp_server_id
        in: query
        description: Returns only tools contributed by this upstream server.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMcpGatewayToolsResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The resource does not exist. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: mcpGateways
      x-speakeasy-name-override: listTools
      x-cli-group: mcpGateways
      x-cli-name: listTools
      x-code-samples:
      - lang: curl
        label: Core - List the tools a gateway exposes
        source: "curl --get 'https://my.orq.ai/v2/mcp-gateways/01JQ0M8W4T5YB2Q7N1F6K3PZRC/tools' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --data-urlencode 'limit=100'\n"
      - lang: curl
        label: Core - List the tools contributed by one server
        source: "curl --get 'https://my.orq.ai/v2/mcp-gateways/01JQ0M8W4T5YB2Q7N1F6K3PZRC/tools' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --data-urlencode 'mcp_server_id=01JQ0K5R8N2ZC7X4M9T3V6HWBD'\n"
      - lang: python
        label: Python - List the tools a gateway exposes
        source: "import os\nfrom orq_ai_sdk import Orq\n\nclient = Orq(api_key=os.environ[\"ORQ_API_KEY\"])\n\npage = client.mcp_gateways.list_tools(\n    gateway_id=\"01JQ0M8W4T5YB2Q7N1F6K3PZRC\",\n    limit=100,\n)\n\n# exposed_name is what MCP clients call; upstream_tool_name is the original.\nfor tool in page.data:\n    print(tool.exposed_name, \"->\", tool.upstream_tool_name)\n"
      - lang: typescript
        label: Node.js - List the tools a gateway exposes
        source: "import { Orq } from '@orq-ai/node';\n\nconst client = new Orq({\n  apiKey: process.env.ORQ_API_KEY,\n});\n\nconst page = await client.mcpGateways.listTools({\n  gatewayId: '01JQ0M8W4T5YB2Q7N1F6K3PZRC',\n  limit: 100,\n});\n\n// exposedName is what MCP clients call; upstreamToolName is the original.\nfor (const tool of page.data) {\n  console.log(tool.exposedName, '->', tool.upstreamToolName);\n}\n"
  /v2/mcp-gateways/{id}:
    get:
      tags:
      - MCP Gateway
      summary: Retrieve an MCP gateway
      description: Retrieves the details of an existing MCP gateway by its unique ID.
      operationId: McpGatewayGet
      parameters:
      - name: id
        in: path
        description: Unique identifier of the MCP gateway.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMcpGatewayResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The resource does not exist. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: mcpGateways
      x-speakeasy-name-override: retrieve
      x-cli-group: mcpGateways
      x-cli-name: retrieve
      x-code-samples:
      - lang: curl
        label: Core - Retrieve an MCP gateway
        source: "curl --get 'https://my.orq.ai/v2/mcp-gateways/01JQ0M8W4T5YB2Q7N1F6K3PZRC' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\"\n"
      - lang: python
        label: Python - Retrieve an MCP gateway
        source: 'import os

          from orq_ai_sdk import Orq


          client = Orq(api_key=os.environ["ORQ_API_KEY"])


          result = client.mcp_gateways.retrieve(id="01JQ0M8W4T5YB2Q7N1F6K3PZRC")


          # public_url is the endpoint MCP clients connect to.

          print(result.mcp_gateway.public_url, result.mcp_gateway.status)

          '
      - lang: typescript
        label: Node.js - Retrieve an MCP gateway
        source: "import { Orq } from '@orq-ai/node';\n\nconst client = new Orq({\n  apiKey: process.env.ORQ_API_KEY,\n});\n\nconst result = await client.mcpGateways.retrieve({\n  id: '01JQ0M8W4T5YB2Q7N1F6K3PZRC',\n});\n\n// publicUrl is the endpoint MCP clients connect to.\nconsole.log(result.mcpGateway.publicUrl, result.mcpGateway.status);\n"
    delete:
      tags:
      - MCP Gateway
      summary: Delete an MCP gateway
      description: Deletes an MCP gateway from the workspace. The response body is empty when the delete succeeds.
      operationId: McpGatewayDelete
      parameters:
      - name: id
        in: path
        description: Unique identifier of the MCP gateway.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMcpGatewayResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: mcpGateways
      x-speakeasy-name-override: delete
      x-cli-group: mcpGateways
      x-cli-name: delete
      x-code-samples:
      - lang: curl
        label: Core - Delete an MCP gateway
        source: "curl --request DELETE \\\n  --url 'https://my.orq.ai/v2/mcp-gateways/01JQ0M8W4T5YB2Q7N1F6K3PZRC' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\"\n"
      - lang: python
        label: Python - Delete an MCP gateway
        source: 'import os

          from orq_ai_sdk import Orq


          client = Orq(api_key=os.environ["ORQ_API_KEY"])


          # Connected MCP clients start receiving "gateway not found".

          client.mcp_gateways.delete(id="01JQ0M8W4T5YB2Q7N1F6K3PZRC")

          '
      - lang: typescript
        label: Node.js - Delete an MCP gateway
        source: "import { Orq } from '@orq-ai/node';\n\nconst client = new Orq({\n  apiKey: process.env.ORQ_API_KEY,\n});\n\n// Connected MCP clients start receiving \"gateway not found\".\nawait client.mcpGateways.delete({ id: '01JQ0M8W4T5YB2Q7N1F6K3PZRC' });\n"
    patch:
      tags:
      - MCP Gateway
      summary: Update an MCP gateway
      description: Updates mutable fields of an existing MCP gateway. Omitted optional fields keep their current values.
      operationId: McpGatewayUpdate
      parameters:
      - name: id
        in: path
        description: Unique identifier of the MCP gateway.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMcpGatewayRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMcpGatewayResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: mcpGateways
      x-speakeasy-name-override: update
      x-cli-group: mcpGateways
      x-cli-name: update
      x-code-samples:
      - lang: curl
        label: Core - Narrow the tools a gateway exposes
        source: "curl --request PATCH \\\n  --url 'https://my.orq.ai/v2/mcp-gateways/01JQ0M8W4T5YB2Q7N1F6K3PZRC' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"server_links\": [\n      {\n        \"mcp_server_id\": \"01JQ0K5R8N2ZC7X4M9T3V6HWBD\",\n        \"alias\": \"github\",\n        \"enabled\": true,\n        \"tool_exposure\": {\n          \"mode\": \"MCP_TOOL_EXPOSURE_MODE_SELECTED\",\n          \"tool_ids\": [\n            \"01JQ0KA2M7VD9E4R6T8Y1U3XSB\",\n            \"01JQ0KB5P9WF2G7H4J6K8L1NQD\"\n          ]\n        }\n      }\n    ]\n  }'\n"
      - lang: curl
        label: Core - Disable a gateway
        source: "curl --request PATCH \\\n  --url 'https://my.orq.ai/v2/mcp-gateways/01JQ0M8W4T5YB2Q7N1F6K3PZRC' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{ \"status\": \"MCP_GATEWAY_STATUS_DISABLED\" }'\n"
      - lang: python
        label: Python - Narrow the tools a gateway exposes
        source: "import os\nfrom orq_ai_sdk import Orq\n\nclient = Orq(api_key=os.environ[\"ORQ_API_KEY\"])\n\n# tool_ids come from McpTool.id. A tool renamed upstream gets a new id\n# on the next sync, which drops it from this allowlist.\nresult = client.mcp_gateways.update(\n    id=\"01JQ0M8W4T5YB2Q7N1F6K3PZRC\",\n    server_links=[\n        {\n            \"mcp_server_id\": \"01JQ0K5R8N2ZC7X4M9T3V6HWBD\",\n            \"alias\": \"github\",\n            \"enabled\": True,\n            \"tool_exposure\": {\n                \"mode\": \"MCP_TOOL_EXPOSURE_MODE_SELECTED\",\n                \"tool_ids\": [\n                    \"01JQ0KA2M7VD9E4R6T8Y1U3XSB\",\n                    \"01JQ0KB5P9WF2G7H4J6K8L1NQD\",\n                ],\n            },\n        },\n    ],\n)\n\nprint(result.mcp_gateway.exposed_tools_count)\n"
      - lang: typescript
        label: Node.js - Narrow the tools a gateway exposes
        source: "import { Orq } from '@orq-ai/node';\n\nconst client = new Orq({\n  apiKey: process.env.ORQ_API_KEY,\n});\n\n// toolIds come from McpTool.id. A tool renamed upstream gets a new id\n// on the next sync, which drops it from this allowlist.\nconst result = await client.mcpGateways.update({\n  id: '01JQ0M8W4T5YB2Q7N1F6K3PZRC',\n  serverLinks: [\n    {\n      mcpServerId: '01JQ0K5R8N2ZC7X4M9T3V6HWBD',\n      alias: 'github',\n      enabled: true,\n      toolExposure: {\n        mode: 'MCP_TOOL_EXPOSURE_MODE_SELECTED',\n        toolIds: [\n          '01JQ0KA2M7VD9E4R6T8Y1U3XSB',\n          '01JQ0KB5P9WF2G7H4J6K8L1NQD',\n        ],\n      },\n    },\n  ],\n});\n\nconsole.log(result.mcpGateway.exposedToolsCount);\n"
  /v2/mcp-servers:
    get:
      tags:
      - MCP Gateway
      summary: List MCP servers
      description: Returns a paginated list of MCP servers in the workspace.
      operationId: McpServerList
      parameters:
      - name: limit
        in: query
        description: Page size between 1 and 200. Defaults to 25.
        schema:
          type: integer
          format: int32
      - name: starting_after
        in: query
        description: Cursor for the page after the given item id. Mutually exclusive with `ending_before`.
        schema:
          type: string
      - name: ending_before
        in: query
        description: Cursor for the page before the given item id. Mutually exclusive with `starting_after`.
        schema:
          type: string
      - name: search
        in: query
        description: Case-insensitive match against the server key and display name.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMcpServersResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: mcpServers
      x-speakeasy-name-override: list
      x-cli-group: mcpServers
      x-cli-name: list
      x-code-samples:
      - lang: curl
        label: Core - List MCP servers
        source: "curl --get 'https://my.orq.ai/v2/mcp-servers' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --data-urlencode 'limit=25' \\\n  --data-urlencode 'search=github'\n"
      - lang: python
        label: Python - List MCP servers
        source: "import os\nfrom orq_ai_sdk import Orq\n\nclient = Orq(api_key=os.environ[\"ORQ_API_KEY\"])\n\npage = client.mcp_servers.list(\n    limit=25,\n    search=\"github\",\n)\n\nfor server in page.data:\n    print(server.key, server.sync_state.tools_total)\n"
      - lang: typescript
        label: Node.js - List MCP servers
        source: "import { Orq } from '@orq-ai/node';\n\nconst client = new Orq({\n  apiKey: process.env.ORQ_API_KEY,\n});\n\nconst page = await client.mcpServers.list({\n  limit: 25,\n  search: 'github',\n});\n\nfor (const server of page.data) {\n  console.log(server.key, server.syncState.toolsTotal);\n}\n"
    post:
      tags:
      - MCP Gateway
      summary: Create an MCP server
      description: Creates a new upstream MCP server connection in the workspace.
      operationId: McpServerCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMcpServerRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMcpServerResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: mcpServers
      x-speakeasy-name-override: create
      x-cli-group: mcpServers
      x-cli-name: create
      x-code-samples:
      - lang: curl
        label: Core - Create MCP server
        source: "curl --request POST \\\n  --url 'https://my.orq.ai/v2/mcp-servers' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"key\": \"github\",\n    \"display_name\": \"GitHub\",\n    \"description\": \"Repository and issue tools for the platform team.\",\n    \"connection\": {\n      \"type\": \"MCP_CONNECTION_TYPE_HTTP\",\n      \"url\": \"https://api.githubcopilot.com/mcp/\"\n    },\n    \"auth\": {\n      \"type\": \"MCP_AUTH_TYPE_STATIC_HEADERS\",\n      \"static_headers\": [\n        { \"key\": \"Authorization\", \"value\": \"Bearer ghp_example_token\" }\n      ]\n    },\n    \"default_tool_exposure\": { \"mode\": \"MCP_TOOL_EXPOSURE_MODE_ALL\" }\n  }'\n"
      - lang: python
        label: Python - Create MCP server
        source: "import os\nfrom orq_ai_sdk import Orq\n\nclient = Orq(api_key=os.environ[\"ORQ_API_KEY\"])\n\nresult = client.mcp_servers.create(\n    key=\"github\",\n    display_name=\"GitHub\",\n    description=\"Repository and issue tools for the platform team.\",\n    connection={\n        \"type\": \"MCP_CONNECTION_TYPE_HTTP\",\n        \"url\": \"https://api.githubcopilot.com/mcp/\",\n    },\n    auth={\n        \"type\": \"MCP_AUTH_TYPE_STATIC_HEADERS\",\n        \"static_headers\": [\n            {\"key\": \"Authorization\", \"value\": \"Bearer ghp_example_token\"},\n        ],\n    },\n    default_tool_exposure={\"mode\": \"MCP_TOOL_EXPOSURE_MODE_ALL\"},\n)\n\n# A new server has no tools until it is synced.\nprint(result.mcp_server.key)\n"
      - lang: typescript
        label: Node.js - Create MCP server
        source: "import { Orq } from '@orq-ai/node';\n\nconst client = new Orq({\n  apiKey: process.env.ORQ_API_KEY,\n});\n\nconst result = await client.mcpServers.create({\n  key: 'github',\n  displayName: 'GitHub',\n  description: 'Repository and issue tools for the platform team.',\n  connection: {\n    type: 'MCP_CONNECTION_TYPE_HTTP',\n    url: 'https://api.githubcopilot.com/mcp/',\n  },\n  auth: {\n    type: 'MCP_AUTH_TYPE_STATIC_HEADERS',\n    staticHeaders: [\n      { key: 'Authorization', value: 'Bearer ghp_example_token' },\n    ],\n  },\n  defaultToolExposure: { mode: 'MCP_TOOL_EXPOSURE_MODE_ALL' },\n});\n\n// A new server has no tools until it is synced.\nconsole.log(result.mcpServer.key);\n"
  /v2/mcp-servers/{id}:
    get:
      tags:
      - MCP Gateway
      summary: Retrieve an MCP server
      description: Retrieves the details of an existing MCP server by its unique ID.
      operationId: McpServerGet
      parameters:
      - name: id
        in: path
        description: Unique identifier of the MCP server.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMcpServerResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The resource does not exist. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: mcpServers
