openapi: 3.2.0
info:
  title: orq.ai Views API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- name: Views
paths:
  /v3/views:
    get:
      tags:
      - Views
      summary: List visible saved views
      operationId: ViewList
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: uint32
      - name: starting_after
        in: query
        schema:
          type: string
      - name: ending_before
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListViewsResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: views
      x-speakeasy-name-override: list
      x-code-samples:
      - lang: typescript
        label: Node.js
        source: 'import { Orq } from ''@orq-ai/node'';


          const orq = new Orq({ apiKey: process.env.ORQ_API_KEY });

          const result = await orq.views.list({ page: ''traces-studio'', limit: 100 });

          '
    post:
      tags:
      - Views
      summary: Create a saved view
      operationId: ViewCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateViewRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateViewResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: views
      x-speakeasy-name-override: create
      x-code-samples:
      - lang: typescript
        label: Node.js
        source: 'import { Orq } from ''@orq-ai/node'';


          const orq = new Orq({ apiKey: process.env.ORQ_API_KEY });

          const result = await orq.views.create({ displayName: ''Errors'', page: ''traces-studio'', filterBy: '''', columns: [] });

          '
  /v3/views/{view_id}:
    get:
      tags:
      - Views
      summary: Retrieve a saved view
      operationId: ViewGet
      parameters:
      - name: view_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetViewResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: views
      x-speakeasy-name-override: get
      x-code-samples:
      - lang: typescript
        label: Node.js
        source: 'import { Orq } from ''@orq-ai/node'';


          const orq = new Orq({ apiKey: process.env.ORQ_API_KEY });

          const result = await orq.views.get({ viewId: ''01HZXW2K7Y8Q9M0N1P2R3S4T5V'' });

          '
    delete:
      tags:
      - Views
      summary: Delete a saved view
      operationId: ViewDelete
      parameters:
      - name: view_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteViewResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: views
      x-speakeasy-name-override: delete
      x-code-samples:
      - lang: typescript
        label: Node.js
        source: 'import { Orq } from ''@orq-ai/node'';


          const orq = new Orq({ apiKey: process.env.ORQ_API_KEY });

          const result = await orq.views.delete({ viewId: ''01HZXW2K7Y8Q9M0N1P2R3S4T5V'' });

          '
    patch:
      tags:
      - Views
      summary: Update a saved view
      operationId: ViewUpdate
      parameters:
      - name: view_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateViewRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateViewResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: views
      x-speakeasy-name-override: update
      x-code-samples:
      - lang: typescript
        label: Node.js
        source: 'import { Orq } from ''@orq-ai/node'';


          const orq = new Orq({ apiKey: process.env.ORQ_API_KEY });

          const result = await orq.views.update({ viewId: ''01HZXW2K7Y8Q9M0N1P2R3S4T5V'', displayName: ''Production errors'' });

          '
components:
  schemas:
    CreateViewResponse:
      type: object
      properties:
        view:
          $ref: '#/components/schemas/View'
    GetViewResponse:
      type: object
      properties:
        view:
          $ref: '#/components/schemas/View'
    ListViewsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/View'
        has_more:
          type: boolean
    View:
      type: object
      properties:
        id:
          type: string
        display_name:
          type: string
        description:
          type: string
        workspace_id:
          type: string
        page:
          type: string
        filter_by:
          type: string
        columns:
          type: array
          items:
            type: string
        column_labels:
          type: object
          additionalProperties:
            type: string
        is_default:
          type: boolean
        private_for_ids:
          type: array
          items:
            type: string
        version:
          type: integer
          format: uint32
        created_by_id:
          type: string
        updated_by_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message.
        code:
          type: integer
          description: gRPC status code, when the service reports one.
        details:
          type: array
          items: {}
          description: Additional error details, when the service reports any.
      required:
      - message
    CreateViewRequest:
      type: object
      properties:
        display_name:
          type: string
        description:
          type: string
        page:
          type: string
        filter_by:
          type: string
        columns:
          type: array
          items:
            type: string
        column_labels:
          type: object
          additionalProperties:
            type: string
        is_default:
          type: boolean
        is_private:
          type: boolean
        version:
          type: integer
          format: uint32
    UpdateViewResponse:
      type: object
      properties:
        view:
          $ref: '#/components/schemas/View'
    DeleteViewResponse:
      type: object
      properties: {}
    UpdateViewRequest:
      type: object
      properties:
        display_name:
          type: string
        description:
          type: string
        filter_by:
          type: string
        columns:
          type: array
          items:
            type: string
        column_labels:
          type: object
          additionalProperties:
            type: string
        is_default:
          type: boolean
        is_private:
          type: boolean
        version:
          type: integer
          format: uint32
        update_mask:
          type: string
          format: field-mask
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  url: https://docs.orq.ai
  description: orq.ai Documentation
x-speakeasy-timeout: 600000
