        updated:
          type: string
          description: The last update date of the memory store
        ttl:
          type:
          - number
          - 'null'
        embedding_config:
          $ref: '#/components/schemas/MemoryStoreEmbeddingConfig'
        _id:
          type: string
          description: The unique identifier of the memory store
    ListMemoryDocumentsResponse:
