openapi: 3.2.0
info:
  title: orq.ai Deployments API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- name: Deployments
paths:
  /v2/deployments/invoke:
    post:
      tags:
      - Deployments
      operationId: DeploymentInvoke
      summary: Invoke
      description: Invoke a deployment with a given payload
      x-speakeasy-group: deployments
      x-speakeasy-name-override: invoke
      x-cli-group: deployments
      x-cli-name: invoke
      x-code-samples:
      - lang: TypeScript
        source: "import { Orq } from '@orq-ai/node';\n\nconst orq = new Orq({ apiKey: process.env.ORQ_API_KEY ?? '' });\nconst response = await orq.deployments.invoke({\n  key: 'customer-support',\n  inputs: { question: 'What is your refund policy?' },\n});"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeDeploymentRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: ulid
                    pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                    readOnly: true
                    description: A unique identifier for the response. Can be used to add metrics to the transaction.
                  created:
                    type: string
                    format: date-time
                    description: A timestamp indicating when the object was created. Usually in a standardized format like ISO 8601
                  object:
                    type: string
                    enum:
                    - chat
                    - completion
                    - image
                    description: Indicates the type of model used to generate the response
                  model:
                    type: string
                    description: The model used to generate the response
                  provider:
                    type: string
                    enum:
                    - openai
                    - groq
                    - cohere
                    - azure
                    - aws
                    - google
                    - google-ai
                    - huggingface
                    - togetherai
                    - perplexity
                    - anthropic
                    - leonardoai
                    - fal
                    - nvidia
                    - jina
                    - elevenlabs
                    - litellm
                    - cerebras
                    - openailike
                    - bytedance
                    - mistral
                    - deepseek
                    - moonshotai
                    - zai
                    - minimax
                    - xai
                    - alibaba
                    - tensorix
                    - scaleway
                    - hcompany
                    - inceptron
                    - wafer
                    - poolside
                    - tencent
                    - nebius
                    - fireworks
                    - baseten
                    - reson8
                    - meta
                    - greenpt
                    - slack
                    - orq
                    description: The provider used to generate the response
                  is_final:
                    type: boolean
                    description: Indicates if the response is the final response
                  integration_id:
                    type: string
                    description: Indicates integration id used to generate the response
                  telemetry:
                    type: object
                    properties:
                      trace_id:
                        type: string
                        description: The trace id for the request that generated this response
                      span_id:
                        type: string
                        description: The span id for the request that generated this response
                    required:
                    - trace_id
                    - span_id
                  finalized:
                    type: string
                    format: date-time
                    description: A timestamp indicating when the object was finalized. Usually in a standardized format like ISO 8601
                  system_fingerprint:
                    type:
                    - string
                    - 'null'
                    description: Provider backed system fingerprint.
                  retrievals:
                    type: array
                    items:
                      type: object
                      properties:
                        document:
                          type: string
                          description: Content of the retrieved chunk from the knowledge base
                        metadata:
                          type: object
                          properties:
                            file_name:
                              type: string
                              description: Name of the file
                            page_number:
                              type:
                              - number
                              - 'null'
                              description: Page number of the chunk
                            file_type:
                              type: string
                              description: Type of the file
                            rerank_score:
                              type: number
                              description: Rerank scores are normalized to be in the range [0, 1]. Scores close to 1 indicate a high relevance to the query, and scores closer to 0 indicate low relevance. It is not accurate to assume a score of 0.9 means the document is 2x more relevant than a document with a score of 0.45
                            search_score:
                              type: number
                              description: Search scores are normalized to be in the range [0, 1]. Search score is calculated based on `[Cosine Similarity](https://en.wikipedia.org/wiki/Cosine_similarity)` algorithm. Scores close to 1 indicate the document is closer to the query, and scores closer to 0 indicate the document is farther from the query.
                          required:
                          - file_name
                          - page_number
                          - file_type
                          - search_score
                          description: Metadata of the retrieved chunk from the knowledge base
                      required:
                      - document
                      - metadata
                    description: List of documents retrieved from the knowledge base. This property is only available when the `include_retrievals` flag is set to `true` in the invoke settings. When stream is set to true, the `retrievals` property will be returned in the last streamed chunk where the property `is_final` is set to `true`.
                  provider_response:
                    description: Response returned by the model provider. This functionality is only supported when streaming is not used. If streaming is used, the `provider_response` property will be set to `null`.
                  usage:
                    type:
                    - object
                    - 'null'
                    properties:
                      total_tokens:
                        type: number
                      prompt_tokens:
                        type: number
                      completion_tokens:
                        type: number
                      prompt_tokens_details:
                        type: object
                        properties:
                          cached_tokens:
                            type:
                            - number
                            - 'null'
                      completion_tokens_details:
                        type:
                        - object
                        - 'null'
                        properties:
                          reasoning_tokens:
                            type:
                            - number
                            - 'null'
                    description: Usage metrics for the response
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: number
                        message:
                          oneOf:
                          - type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - tool_calls
                              role:
                                type: string
                                enum:
                                - system
                                - developer
                                - assistant
                                - user
                                - exception
                                - tool
                                - prompt
                                - correction
                                - expected_output
                                description: The role of the prompt message
                              content:
                                type:
                                - string
                                - 'null'
                              tool_calls:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                    index:
                                      type: number
                                    type:
                                      type: string
                                      enum:
                                      - function
                                    function:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                        arguments:
                                          type: string
                                          description: JSON string arguments for the functions
                                      required:
                                      - name
                                      - arguments
                                  required:
                                  - type
                                  - function
                              reasoning:
                                type: string
                                description: Internal thought process of the model
                              reasoning_signature:
                                type: string
                                description: The signature holds a cryptographic token which verifies that the thinking block was generated by the model, and is verified when thinking is part of a multiturn conversation. This value should not be modified and should always be sent to the API when the reasoning is redacted. Currently only supported by `Anthropic`.
                              redacted_reasoning:
                                type: string
                                description: Occasionally the model's internal reasoning will be flagged by the safety systems of the provider. When this occurs, the provider will encrypt the reasoning. These redacted reasoning is decrypted when passed back to the API, allowing the model to continue its response without losing context.
                            required:
                            - type
                            - role
                            - tool_calls
                          - type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - content
                              role:
                                type: string
                                enum:
                                - system
                                - developer
                                - assistant
                                - user
                                - exception
                                - tool
                                - prompt
                                - correction
                                - expected_output
                                description: The role of the prompt message
                              content:
                                type:
                                - string
                                - 'null'
                              reasoning:
                                type: string
                                description: Internal thought process of the model
                              reasoning_signature:
                                type: string
                                description: The signature holds a cryptographic token which verifies that the thinking block was generated by the model, and is verified when thinking is part of a multiturn conversation. This value should not be modified and should always be sent to the API when the reasoning is redacted. Currently only supported by `Anthropic`.
                              redacted_reasoning:
                                type: string
                                description: Occasionally the model's internal reasoning will be flagged by the safety systems of the provider. When this occurs, the provider will encrypt the reasoning. These redacted reasoning is decrypted when passed back to the API, allowing the model to continue its response without losing context.
                            required:
                            - type
                            - role
                            - content
                          - type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - image
                              role:
                                type: string
                                enum:
                                - system
                                - developer
                                - assistant
                                - user
                                - exception
                                - tool
                                - prompt
                                - correction
                                - expected_output
                                description: The role of the prompt message
                              url:
                                type: string
                            required:
                            - type
                            - role
                            - url
                        finish_reason:
                          type:
                          - string
                          - 'null'
                      required:
                      - index
                      - message
                    description: A list of choices generated by the model
                required:
                - id
                - created
                - object
                - model
                - provider
                - is_final
                - telemetry
                - choices
        '204':
          description: No content - successful operation
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/deployments:
    get:
      tags:
      - Deployments
      x-speakeasy-group: deployments
      x-speakeasy-name-override: list
      x-cli-group: deployments
      x-cli-name: list
      operationId: Deployments
      description: Returns a list of your deployments. The deployments are returned sorted by creation date, with the most recent deployments appearing first.
      summary: List all deployments
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: A limit on the number of objects to be returned. Limit can range between 1 and 50, and the default is 10
        required: false
        description: A limit on the number of objects to be returned. Limit can range between 1 and 50, and the default is 10
        name: limit
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        required: false
        description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        name: starting_after
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        required: false
        description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        name: ending_before
        in: query
      responses:
        '200':
          description: List all deployments
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier for the object.
                        created:
                          type: string
                          description: Date in ISO 8601 format at which the object was created.
                        updated:
                          type: string
                          description: Date in ISO 8601 format at which the object was last updated.
                        key:
                          type: string
                          description: The deployment unique key
                        description:
                          type: string
                          description: An arbitrary string attached to the object. Often useful for displaying to users.
                        prompt_config:
                          type: object
                          properties:
                            tools:
                              type: array
                              items:
                                allOf:
                                - type: object
                                  properties:
                                    display_name:
                                      type: string
                                    type:
                                      type: string
                                      enum:
                                      - function
                                      description: The type of the tool. Currently, only `function` is supported.
                                    function:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                          description: The name of the function to be called. Must be a-z, A-Z, 0-9, or contain underscores and dashes, with a maximum length of 64.
                                        description:
                                          type: string
                                          description: A description of what the function does, used by the model to choose when and how to call the function.
                                        strict:
                                          type: boolean
                                        parameters:
                                          type: object
                                          properties:
                                            type:
                                              type: string
                                              enum:
                                              - object
                                            properties:
                                              type: object
                                              additionalProperties: {}
                                            required:
                                              type: array
                                              items:
                                                type: string
                                            additionalProperties:
                                              type: boolean
                                              enum:
                                              - false
                                          required:
                                          - type
                                          - properties
                                          description: "The parameters the functions accepts, described as a JSON Schema object. \n\n Omitting `parameters` defines a function with an empty parameter list."
                                      required:
                                      - name
                                      - parameters
                                  required:
                                  - type
                                  - function
                                - type: object
                                  properties:
                                    id:
                                      type: number
                            model:
                              type: string
                            model_type:
                              type: string
                              enum:
                              - chat
                              - completion
                              - embedding
                              - image
                              - tts
                              - stt
                              - rerank
                              - ocr
                              - moderation
                              - vision
                              description: The modality of the model
                            model_parameters:
                              type: object
                              properties:
                                temperature:
                                  type: number
                                  description: Only supported on `chat` and `completion` models.
                                maxTokens:
                                  type: number
                                  description: Only supported on `chat` and `completion` models.
                                topK:
                                  type: number
                                  description: Only supported on `chat` and `completion` models.
                                topP:
                                  type: number
                                  description: Only supported on `chat` and `completion` models.
                                frequencyPenalty:
                                  type: number
                                  description: Only supported on `chat` and `completion` models.
                                presencePenalty:
                                  type: number
                                  description: Only supported on `chat` and `completion` models.
                                numImages:
                                  type: number
                                  description: Only supported on `image` models.
                                seed:
                                  type: number
                                  description: Best effort deterministic seed for the model. Currently only OpenAI models support these
                                format:
                                  type: string
                                  enum:
                                  - url
                                  - b64_json
                                  - text
                                  - json_object
                                  description: Only supported on `image` models.
                                dimensions:
                                  type: string
                                  description: Only supported on `image` models.
                                quality:
                                  type: string
                                  description: Only supported on `image` models.
                                style:
                                  type: string
                                  description: Only supported on `image` models.
                                responseFormat:
                                  anyOf:
                                  - type: object
                                    properties:
                                      type:
                                        type: string
                                        enum:
                                        - json_schema
                                      display_name:
                                        type: string
                                      json_schema:
                                        type: object
                                        properties:
                                          name:
                                            type: string
                                          description:
                                            type:
                                            - string
                                            - 'null'
                                          strict:
                                            type: boolean
                                          schema:
                                            type: object
                                            additionalProperties: {}
                                        required:
                                        - name
                                        - schema
                                    required:
                                    - type
                                    - json_schema
                                  - type: object
                                    properties:
                                      type:
                                        type: string
                                        enum:
                                        - json_object
                                    required:
                                    - type
                                  - type: object
                                    properties:
                                      type:
                                        type: string
                                        enum:
                                        - text
                                    required:
                                    - type
                                  - type: string
                                    enum:
                                    - mp3
                                    - opus
                                    - aac
                                    - flac
                                    - wav
                                    - pcm
                                  - type: string
                                    enum:
                                    - url
                                    - base64_json
                                  - type: string
                                    enum:
                                    - json
                                    - text
                                    - srt
                                    - verbose_json
                                    - vtt
                                  - type: 'null'
                                  description: "An object specifying the format that the model must output. \n\n Setting to `{ \"type\": \"json_schema\", \"json_schema\": {...} }` enables Structured Outputs which ensures the model will match your supplied JSON schema \n\n Setting to `{ \"type\": \"json_object\" }` enables JSON mode, which ensures the message the model generates is valid JSON.\n\nImportant: when using JSON mode, you must also instruct the model to produce JSON yourself via a system or user message. Without this, the model may generate an unending stream of whitespace until the generation reaches the token limit, resulting in a long-running and seemingly \"stuck\" request. Also note that the message content may be partially cut off if finish_reason=\"length\", which indicates the generation exceeded max_tokens or the conversation exceeded the max context length."
                                cacheControl:
                                  type:
                                  - object
                                  - 'null'
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - ephemeral
                                      description: Create a cache control breakpoint. Accepts only the value "ephemeral".
                                    ttl:
                                      type: string
                                      enum:
                                      - 5m
                                      - 1h
                                      default: 5m
                                      description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                                        - `5m`: 5 minutes

                                        - `1h`: 1 hour


                                        Defaults to `5m`. Only supported by `Anthropic` Claude models.'
                                  required:
                                  - type
                                  description: Provider-level prompt caching configuration applied to the request. Creates a cache control breakpoint covering the request content. Only supported by `Anthropic` Claude models.
                                photoRealVersion:
                                  type: string
                                  enum:
                                  - v1
                                  - v2
                                  description: The version of photoReal to use. Must be v1 or v2. Only available for `leonardoai` provider
                                encoding_format:
                                  type: string
                                  enum:
                                  - float
                                  - base64
                                  description: The format to return the embeddings
                                reasoningEffort:
                                  type: string
                                  enum:
                                  - none
                                  - disable
                                  - minimal
                                  - low
                                  - medium
                                  - high
                                  - xhigh
                                  - max
                                  description: Constrains effort on reasoning for reasoning models. Reducing reasoning effort can result in faster responses and fewer tokens used on reasoning in a response.
                                budgetTokens:
                                  type: number
                                  description: 'Gives the model enhanced reasoning capabilities for complex tasks. A value of 0 disables thinking. The minimum budget tokens for thinking are 1024. The Budget Tokens should never exceed the Max Tokens parameter. Only supported by `Anthropic` '
                                verbosity:
                                  type: string
                                  enum:
                                  - low
                                  - medium
                                  - high
                                  description: Controls the verbosity of the model output.
                                thinkingLevel:
                                  type: string
                                  enum:
                                  - minimal
                                  - low
                                  - medium
                                  - high
                                  description: The level of thinking to use for the model. Only supported by `Google AI`
                              description: 'Model Parameters: Not all parameters apply to every model'
                            provider:
                              type: string
                              enum:
                              - openai
                              - groq
                              - cohere
                              - azure
                              - aws
                              - google
                              - google-ai
                              - huggingface
                              - togetherai
                              - perplexity
                              - anthropic
                              - leonardoai
                              - fal
                              - nvidia
                              - jina
                              - elevenlabs
                              - litellm
                              - cerebras
                              - openailike
                              - bytedance
                              - mistral
                              - deepseek
                              - moonshotai
                              - zai
                              - minimax
                              - xai
                              - alibaba
                              - tensorix
                              - scaleway
                              - hcompany
                              - inceptron
                              - wafer
                              - poolside
                              - tencent
                              - nebius
                              - fireworks
                              - baseten
                              - reson8
                              - meta
                              - greenpt
                              - slack
                              - orq
                            messages:
                              type: array
                              items:
                                type: object
                                properties:
                                  role:
                                    type: string
                                    enum:
                                    - system
                                    - developer
                                    - assistant
                                    - user
                                    - exception
                                    - tool
                                    - prompt
                                    - correction
                                    - expected_output
                                    description: The role of the prompt message
                                  content:
                                    anyOf:
                                    - type: string
                                    - type: array
                                      items:
                                        oneOf:
                                        - type: object
                                          properties:
                                            type:
                                              type: string
                                              enum:
                                              - text
                                            text:
                                              type: string
                                          required:
                                          - type
                                          - text
                                          description: Text content part of a prompt message
                                        - type: object
                                          properties:
                                            type:
                                              type: string
                                              enum:
                                              - image_url
                                            image_url:
                                              type: object
                                              properties:
                                                id:
                                                  type: string
                                                  format: ulid
                                                  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                                                  readOnly: true
                                                  description: The orq.ai id of the image
                                                url:
                                                  type: string
                                                  description: Either a URL of the image or the base64 encoded data URI.
                                                  examples:
                                                  - https://picsum.photos/id/1/200/300
                                                  - data:image/jpeg;base64,
                                                detail:
                                                  type: string
                                                  description: Specifies the detail level of the image. Currently only supported with OpenAI models
                                              required:
                                              - url
                                          required:
                                          - type
                                          - image_url
                                          description: The image part of the prompt message. Only supported with vision models.
                                        - type: object
                                          properties:
                                            type:
                                              type: string
                                              enum:
                                              - file
                                              description: The type of the content part. Always `file`.
                                            file:
                                              type: object
                                              properties:
                                                file_data:
                                                  type: string
                                                  description: 'The file data as a data URI string in the format `data:<mime-type>;base64,<base64-encoded-data>`. Example: `data:image/png;base64,iVBORw0KGgoAAAANS...`'
                                                uri:
                                                  type: string
                                                  description: URL to the file. Only supported by Anthropic Claude models for PDF files.
                                                mimeType:
                                                  type: string
                                                  description: MIME type of the file (e.g., application/pdf, image/png)
                                                filename:
                                                  type: string
                                                  description: The name of the file, used when passing the file to the model as a string.
                                          required:
                                          - type
                                          - file
                                    - type: 'null'
                                    description: The contents of the user message. Either the text content of the message or an array of content parts with a defined type, each can be of type `text` or `image_url` when passing in images. You can pass multiple images by adding multiple `image_url` content parts. Can be null for tool messages in certain scenarios.
                                  tool_calls:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: string
                                        index:
                                          type: number
                                        type:
                                          type: string
                                          enum:
                                          - function
                                        function:
                                          type: object
                                          properties:
                                            name:
                                              type: string
                                            arguments:
                                              type: string
                                              description: JSON string arguments for the functions
                                          required:
                                          - name
                                          - arguments
                                      required:
                                      - type
                                      - function
                                  tool_call_id:
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - role
                                - content
                          required:
                          - tools
                          - model
                          - model_type
                          - model_parameters
                          - provider
                          - messages
                        version:
                          type: string
                          description: THe version of the deployment
                      required:
                      - id
                      - created
                      - updated
                      - key
                      - description
                      - prompt_config
                      - version
                  has_more:
                    type: boolean
                required:
                - object
                - data
                - has_more
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HonoApiError'
  /v2/deployments/get_config:
    post:
      tags:
      - Deployments
