      operationId: ListDeploymentVersions
      summary: List deployment versions
      description: List saved versions across deployment variants, including drafts, newest first. Resolve the deployment by key or ID. Optionally filter by variant_id. Use the version _id with starting_after or ending_before to paginate.
      parameters:
      - schema:
          type: string
          minLength: 1
          description: Deployment key or ID.
        required: true
        description: Deployment key or ID.
        name: keyOrID
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: A limit on the number of objects to be returned. Limit can range between 1 and 50, and the default is 10
        required: false
        description: A limit on the number of objects to be returned. Limit can range between 1 and 50, and the default is 10
        name: limit
        in: query
      - schema:
          type: string
          format: ulid
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          readOnly: false
          description: Version _id after which to fetch the next page.
        required: false
        description: Version _id after which to fetch the next page.
        name: starting_after
