openapi: 3.2.0
info:
  title: orq.ai Models API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- description: List models available through the AI Router.
  name: Models
paths:
  /v2/models:
    get:
      description: Lists all available models for the workspace, including system and custom models with their enabled status.
      operationId: ModelList
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelDocument'
                type:
                - array
                - 'null'
          description: Models retrieved successfully
        '401':
          description: Unauthorized
      summary: List models
      tags:
      - Models
      x-cli-group: models
      x-cli-list-fields:
      - refId
      - model_type
      - metadata.context_window
      - metadata.max_output_tokens
      - metadata.million_tokens_input_cost
      - metadata.million_tokens_output_cost
      - has_functions
      x-cli-name: list
      x-code-samples:
      - label: Node.js
        lang: typescript
        source: const models = await orq.models.list();
      x-speakeasy-group: models
      x-speakeasy-ignore: true
      x-speakeasy-name-override: list
    post:
      description: Creates a new custom model for the workspace. Provider credentials in the configuration are encrypted using the workspace encryption key before being persisted.
      operationId: ModelCreate
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                configuration:
                  additionalProperties: {}
                  type: object
                display_name:
                  maxLength: 128
                  type: string
                has_functions:
                  type: boolean
                id:
                  type: string
                input_cost:
                  format: double
                  type: number
                metadata:
                  $ref: '#/components/schemas/ModelMetadata'
                model_developer:
                  type: string
                model_family:
                  type: string
                model_id:
                  maxLength: 256
                  type: string
                model_type:
                  type: string
                output_cost:
                  format: double
                  type: number
                parameters:
                  items:
                    $ref: '#/components/schemas/CreateModelParameter'
                  type:
                  - array
                  - 'null'
                provider:
                  type: string
              required:
              - id
              - display_name
              - model_id
              - model_developer
              - model_family
              - model_type
              - provider
              - has_functions
              - input_cost
              - output_cost
              - metadata
              - parameters
              - configuration
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  configuration:
                    $ref: '#/components/schemas/ModelConfigurationResponse'
                  created:
                    type: string
                  description:
                    type:
                    - string
                    - 'null'
                  display_name:
                    type: string
                  docs_url:
                    type:
                    - string
                    - 'null'
                  enabled:
                    type: boolean
                  enabled_for_endpoints:
                    type: boolean
                  enabled_for_playground:
                    type: boolean
                  has_cpu_pricing:
                    type: boolean
                  has_functions:
                    type: boolean
                  id:
                    type: string
                  input_cost:
                    format: double
                    type:
                    - number
                    - 'null'
                  input_currency:
                    type: string
                  is_active:
                    type: boolean
                  legacy_uuid:
                    deprecated: true
                    type: string
                  metadata:
                    $ref: '#/components/schemas/ModelMetadata'
                  model_developer:
                    type: string
                  model_family:
                    type: string
                  model_id:
                    type: string
                  model_type:
                    type: string
                  output_cost:
                    format: double
                    type:
                    - number
                    - 'null'
                  output_currency:
                    type: string
                  owner:
                    type: string
                  parameters:
                    items:
                      $ref: '#/components/schemas/ModelParameterDocument'
                    type:
                    - array
                    - 'null'
                  pricing_url:
                    type:
                    - string
                    - 'null'
                  provider:
                    type: string
                  refId:
                    type: string
                  sharing:
                    $ref: '#/components/schemas/ModelSharingConfig'
                  updated:
                    type: string
                required:
                - id
                - created
                - updated
                - display_name
                - model_id
                - is_active
                - provider
                - owner
                - input_cost
                - input_currency
                - output_cost
                - output_currency
                - description
                - pricing_url
                - docs_url
                - model_type
                - has_functions
                - has_cpu_pricing
                - enabled_for_playground
                - enabled_for_endpoints
                - configuration
                - metadata
                - parameters
                - enabled
                - refId
                type: object
          description: Model created successfully
        '400':
          description: Invalid model configuration
        '401':
          description: Unauthorized
        '404':
          description: Workspace not found
      summary: Create custom model
      tags:
      - Models
      x-cli-group: models
      x-cli-name: create
      x-code-samples:
      - label: Node.js
        lang: typescript
        source: "await orq.models.create({\n  id: \"...\",\n  displayName: \"My custom model\",\n  modelId: \"my-model\",\n  provider: \"openai\",\n  modelType: \"chat\",\n  modelDeveloper: \"openai\",\n  modelFamily: \"gpt\",\n  inputCost: 0,\n  outputCost: 0,\n  hasFunctions: false,\n  metadata: { isPrivate: true, region: \"us\" },\n  parameters: [],\n  configuration: { provider: \"openai\", api_key: \"sk-...\" },\n});"
      x-speakeasy-group: models
      x-speakeasy-name-override: create
  /v2/models/aws-bedrock:
    post:
      description: Registers an AWS Bedrock inference profile as a custom model for the workspace. Credentials are resolved at request time via either the integration reference or the IAM role attached to the deployment — nothing is stored with the model.
      operationId: ModelCreateAwsBedrock
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                assume_role_arn:
                  type: string
                assume_role_external_id:
                  type: string
                auth_mode:
                  type: string
                autorouter_id:
                  type: string
                autorouter_version:
                  type: string
                cache_read_cost:
                  format: double
                  type: number
                cache_write_cost:
                  format: double
                  type: number
                description:
                  type: string
                display_name:
                  maxLength: 128
                  type: string
                has_reasoning:
                  type: boolean
                input_cost:
                  format: double
                  type: number
                integration_id:
                  type: string
                max_tokens:
                  format: int64
                  type: integer
                model_developer:
                  type: string
                model_family:
                  type: string
                model_id:
                  type: string
                model_type:
                  type: string
                output_cost:
                  format: double
                  type: number
                region:
                  type: string
                supports_adaptive_reasoning:
                  type: boolean
                supports_extended_thinking:
                  type: boolean
                supports_json_mode:
                  type: boolean
                supports_json_schema:
                  type: boolean
                supports_strict_tool:
                  type: boolean
                supports_tool_calling:
                  type: boolean
                supports_vision:
                  type: boolean
                temperature:
                  format: double
                  type: number
              required:
              - display_name
              - model_id
              - region
              - model_developer
              - auth_mode
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  configuration:
                    $ref: '#/components/schemas/ModelConfigurationResponse'
                  created:
                    type: string
                  description:
                    type:
                    - string
                    - 'null'
                  display_name:
                    type: string
                  docs_url:
                    type:
                    - string
                    - 'null'
                  enabled:
                    type: boolean
                  enabled_for_endpoints:
                    type: boolean
                  enabled_for_playground:
                    type: boolean
                  has_cpu_pricing:
                    type: boolean
                  has_functions:
                    type: boolean
                  id:
                    type: string
                  input_cost:
                    format: double
                    type:
                    - number
                    - 'null'
                  input_currency:
                    type: string
                  is_active:
                    type: boolean
                  legacy_uuid:
                    deprecated: true
                    type: string
                  metadata:
                    $ref: '#/components/schemas/ModelMetadata'
                  model_developer:
                    type: string
                  model_family:
                    type: string
                  model_id:
                    type: string
                  model_type:
                    type: string
                  output_cost:
                    format: double
                    type:
                    - number
                    - 'null'
                  output_currency:
                    type: string
                  owner:
                    type: string
                  parameters:
                    items:
                      $ref: '#/components/schemas/ModelParameterDocument'
                    type:
                    - array
                    - 'null'
                  pricing_url:
                    type:
                    - string
                    - 'null'
                  provider:
                    type: string
                  refId:
                    type: string
                  sharing:
                    $ref: '#/components/schemas/ModelSharingConfig'
                  updated:
                    type: string
                required:
                - id
                - created
                - updated
                - display_name
                - model_id
                - is_active
                - provider
                - owner
                - input_cost
                - input_currency
                - output_cost
                - output_currency
                - description
                - pricing_url
                - docs_url
                - model_type
                - has_functions
                - has_cpu_pricing
                - enabled_for_playground
                - enabled_for_endpoints
                - configuration
                - metadata
                - parameters
                - enabled
                - refId
                type: object
          description: AWS Bedrock model created successfully
        '400':
          description: Invalid model configuration
        '401':
          description: Unauthorized
        '404':
          description: Workspace not found
      summary: Create AWS Bedrock custom model
      tags:
      - Models
      x-cli-group: models
      x-cli-name: createAwsBedrock
      x-code-samples:
      - label: Node.js
        lang: typescript
        source: "await orq.models.createAwsBedrock({\n  displayName: \"My Bedrock Model\",\n  modelId: \"arn:aws:bedrock:us-east-1:123456789012:inference-profile/anthropic.claude-3-sonnet-20240229-v1:0\",\n  region: \"us-east-1\",\n  modelDeveloper: \"anthropic\",\n  authMode: \"integration\",\n  integrationId: \"int_...\",\n});"
      x-speakeasy-group: models
      x-speakeasy-name-override: createAwsBedrock
  /v2/models/aws-bedrock/validate:
    post:
      description: Performs a live Bedrock Converse probe to verify the inference profile ARN and credentials, then best-effort enriches the response from known system models.
      operationId: ModelValidateAwsBedrock
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                assume_role_arn:
                  type: string
                assume_role_external_id:
                  type: string
                auth_mode:
                  type: string
                inference_profile_arn:
                  type: string
                integration_id:
                  type: string
                model_type:
                  type: string
                region:
                  type: string
              required:
              - inference_profile_arn
              - region
              - auth_mode
              type: object
        required: true
      responses:
        '200':
          description: Validation result
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '404':
          description: Integration not found
      summary: Validate AWS Bedrock inference profile
      tags:
      - Models
      x-cli-group: models
      x-cli-name: validateAwsBedrock
      x-code-samples:
      - label: Node.js
        lang: typescript
        source: "await orq.models.validateAwsBedrock({\n  inferenceProfileArn: \"arn:aws:bedrock:us-east-1:123456789012:inference-profile/anthropic.claude-3-sonnet-20240229-v1:0\",\n  region: \"us-east-1\",\n});"
      x-speakeasy-group: models
      x-speakeasy-name-override: validateAwsBedrock
  /v2/models/aws-bedrock/{id}:
    patch:
      description: Updates an AWS Bedrock custom model. ARN changes are format-validated (live AWS validation lives in the dedicated validate endpoint). Fields you send are merged into the stored configuration and metadata. Parameters are replaced only when the request produces a non-empty list.
      operationId: ModelUpdateAwsBedrock
      parameters:
      - description: The ID of the model
        in: path
        name: id
        required: true
        schema:
          description: The ID of the model
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                assume_role_arn:
                  type: string
                assume_role_external_id:
                  type: string
                autorouter_id:
                  type: string
                autorouter_version:
                  type: string
                cache_read_cost:
                  format: double
                  type: number
                cache_write_cost:
                  format: double
                  type: number
                description:
                  type: string
                display_name:
                  maxLength: 128
                  type: string
                has_reasoning:
                  type: boolean
                input_cost:
                  format: double
                  type: number
                max_tokens:
                  format: int64
                  type: integer
                model_developer:
                  type: string
                model_family:
                  type: string
                model_id:
                  type: string
                output_cost:
                  format: double
                  type: number
                region:
                  type: string
                supports_adaptive_reasoning:
                  type: boolean
                supports_extended_thinking:
                  type: boolean
                supports_json_mode:
                  type: boolean
                supports_json_schema:
                  type: boolean
                supports_strict_tool:
                  type: boolean
                supports_tool_calling:
                  type: boolean
                supports_vision:
                  type: boolean
                temperature:
                  format: double
                  type: number
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  configuration:
                    $ref: '#/components/schemas/ModelConfigurationResponse'
                  created:
                    type: string
                  description:
                    type:
                    - string
                    - 'null'
                  display_name:
                    type: string
                  docs_url:
                    type:
                    - string
                    - 'null'
                  enabled:
                    type: boolean
                  enabled_for_endpoints:
                    type: boolean
                  enabled_for_playground:
                    type: boolean
                  has_cpu_pricing:
                    type: boolean
                  has_functions:
                    type: boolean
                  id:
                    type: string
                  input_cost:
                    format: double
                    type:
                    - number
                    - 'null'
                  input_currency:
                    type: string
                  is_active:
                    type: boolean
                  legacy_uuid:
                    deprecated: true
                    type: string
                  metadata:
                    $ref: '#/components/schemas/ModelMetadata'
                  model_developer:
                    type: string
                  model_family:
                    type: string
                  model_id:
                    type: string
                  model_type:
                    type: string
                  output_cost:
                    format: double
                    type:
                    - number
                    - 'null'
                  output_currency:
                    type: string
                  owner:
                    type: string
                  parameters:
                    items:
                      $ref: '#/components/schemas/ModelParameterDocument'
                    type:
                    - array
                    - 'null'
                  pricing_url:
                    type:
                    - string
                    - 'null'
                  provider:
                    type: string
                  refId:
                    type: string
                  sharing:
                    $ref: '#/components/schemas/ModelSharingConfig'
                  updated:
                    type: string
                required:
                - id
                - created
                - updated
                - display_name
                - model_id
                - is_active
                - provider
                - owner
                - input_cost
                - input_currency
                - output_cost
                - output_currency
                - description
                - pricing_url
                - docs_url
                - model_type
                - has_functions
                - has_cpu_pricing
                - enabled_for_playground
                - enabled_for_endpoints
                - configuration
                - metadata
                - parameters
                - enabled
                - refId
                type: object
          description: AWS Bedrock model updated successfully
        '400':
          description: Invalid ARN format or request
        '401':
          description: Unauthorized
        '404':
          description: Model not found or not accessible in this workspace
      summary: Update AWS Bedrock custom model
      tags:
      - Models
      x-cli-group: models
      x-cli-name: updateAwsBedrock
      x-code-samples:
      - label: Node.js
        lang: typescript
        source: "await orq.models.updateAwsBedrock({\n  id: \"019d...\",\n  displayName: \"Updated name\",\n  region: \"us-east-1\",\n});"
      x-speakeasy-group: models
      x-speakeasy-name-override: updateAwsBedrock
  /v2/models/azure-foundry/deployments:
    post:
      description: Lists Azure Foundry deployments under the given base_url and merges each entry with the matching Orq model catalog entry. Only OpenAI-developed deployments in succeeded state with chat/completion/embedding/vision model types are returned.
      operationId: ModelAzureFoundryDeployments
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                api_key:
                  type: string
                api_version:
                  type: string
                base_url:
                  type: string
                provider:
                  type: string
              required:
              - provider
              - base_url
              - api_key
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  deployments:
                    items:
                      $ref: '#/components/schemas/AzureFoundryDeployment'
                    type:
                    - array
                    - 'null'
                  region:
                    type: string
                required:
                - region
                - deployments
                type: object
          description: Azure Foundry deployments listed
        '400':
          description: Invalid request or base_url
        '401':
          description: Unauthorized
      summary: List Azure Foundry deployments under a resource
      tags:
      - Models
      x-cli-group: models
      x-cli-name: azureFoundryDeployments
      x-code-samples:
      - label: Node.js
        lang: typescript
        source: "await orq.models.azureFoundryDeployments({\n  provider: \"azure\",\n  baseUrl: \"https://my-resource.openai.azure.com/openai/v1\",\n  apiKey: \"...\",\n});"
      x-speakeasy-group: models
      x-speakeasy-name-override: azureFoundryDeployments
  /v2/models/litellm/import:
    post:
      description: Bulk-imports a list of LiteLLM model definitions into the workspace model garden.
      operationId: ModelLiteLLMImport
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/LiteLLMModel'
              type:
              - array
              - 'null'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelDocument'
                type:
                - array
                - 'null'
          description: LiteLLM models imported successfully
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Workspace not found
      summary: Import models from LiteLLM
      tags:
      - Models
      x-cli-group: models
      x-cli-name: importLitellm
      x-code-samples:
      - label: Node.js
        lang: typescript
        source: "await orq.models.importLitellm([\n  {\n    modelName: \"gpt-4o-proxy\",\n    litellmParams: {\n      useInPassThrough: false,\n      useLitellmProxy: true,\n      mergeReasoningContentInChoices: false,\n      model: \"openai/gpt-4o\",\n    },\n    modelInfo: {\n      id: null, dbModel: null, key: null, litellmProvider: \"openai\", mode: \"chat\",\n      inputCostPerToken: 0.0000025, outputCostPerToken: 0.00001,\n      supportsFunctionCalling: true,\n      supportedOpenaiParams: [\"temperature\", \"max_tokens\", \"top_p\"],\n    },\n  },\n]);"
      x-speakeasy-group: models
      x-speakeasy-name-override: importLitellm
  /v2/models/litellm/models:
    get:
      description: Fetches the list of models from the LiteLLM instance configured for the workspace. Requires a stored LiteLLM integration.
      operationId: ModelListLitellm
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: {}
                  type: object
                type:
                - array
                - 'null'
          description: LiteLLM models retrieved
        '401':
          description: Unauthorized
        '404':
          description: LiteLLM integration not found
        '500':
          description: Error fetching models from LiteLLM
      summary: List models from configured LiteLLM instance
      tags:
      - Models
      x-cli-group: models
      x-cli-name: listLitellm
      x-code-samples:
      - label: Node.js
        lang: typescript
        source: await orq.models.listLitellm();
      x-speakeasy-group: models
      x-speakeasy-name-override: listLitellm
  /v2/models/openai-like:
