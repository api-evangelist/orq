                api_key:
                  type: string
                base_url:
                  type: string
                cache_read_cost:
                  format: double
                  type: number
                cache_write_cost:
                  format: double
                  type: number
                cost_per_image:
                  format: double
                  type: number
                description:
                  type: string
                display_name:
                  maxLength: 128
                  type: string
                has_reasoning:
                  type: boolean
                input_cost:
                  format: double
                  type: number
                max_tokens:
                  format: int64
                  type: integer
                model_id:
                  type: string
                model_type:
                  type: string
                output_cost:
                  format: double
                  type: number
                region:
                  type: string
                supports_image_edit:
                  type: boolean
                supports_strict_tool:
                  type: boolean
                supports_tool_calling:
                  type: boolean
                supports_vision:
                  type: boolean
                temperature:
                  format: double
                  type: number
              required:
              - display_name
              - region
              - base_url
              - model_id
              - api_key
              - model_type
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  configuration:
                    $ref: '#/components/schemas/ModelConfigurationResponse'
                  created:
                    type: string
                  description:
                    type:
                    - string
                    - 'null'
                  display_name:
                    type: string
                  docs_url:
                    type:
                    - string
                    - 'null'
                  enabled:
                    type: boolean
                  enabled_for_endpoints:
                    type: boolean
                  enabled_for_playground:
                    type: boolean
                  has_cpu_pricing:
                    type: boolean
                  has_functions:
                    type: boolean
                  id:
                    type: string
                  input_cost:
                    format: double
                    type:
                    - number
                    - 'null'
                  input_currency:
                    type: string
                  is_active:
                    type: boolean
                  legacy_uuid:
                    deprecated: true
                    type: string
                  metadata:
                    $ref: '#/components/schemas/ModelMetadata'
                  model_developer:
                    type: string
                  model_family:
                    type: string
                  model_id:
                    type: string
                  model_type:
                    type: string
                  output_cost:
                    format: double
                    type:
                    - number
                    - 'null'
                  output_currency:
                    type: string
                  owner:
                    type: string
                  parameters:
                    items:
                      $ref: '#/components/schemas/ModelParameterDocument'
                    type:
                    - array
                    - 'null'
                  pricing_url:
                    type:
                    - string
                    - 'null'
                  provider:
                    type: string
                  refId:
                    type: string
                  sharing:
                    $ref: '#/components/schemas/ModelSharingConfig'
                  updated:
                    type: string
                required:
                - id
                - created
                - updated
                - display_name
                - model_id
                - is_active
                - provider
                - owner
                - input_cost
                - input_currency
                - output_cost
                - output_currency
                - description
                - pricing_url
                - docs_url
                - model_type
                - has_functions
                - has_cpu_pricing
                - enabled_for_playground
                - enabled_for_endpoints
                - configuration
                - metadata
                - parameters
                - enabled
                - refId
                type: object
          description: OpenAI-like model created successfully
        '400':
          description: Invalid model configuration or validation failed
        '401':
          description: Unauthorized
        '404':
          description: Workspace not found
      summary: Create OpenAI-compatible custom model
      tags:
      - Models
      x-cli-group: models
      x-cli-name: createOpenaiLike
      x-code-samples:
