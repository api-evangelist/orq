      description: Represents a dynamically typed value which can be either null, a number, a string, a boolean, a recursive struct value, or a list of values.
    ChunkingConfiguration:
      description: The chunking configuration settings for the datasource. Defaults to the system's standard chunking configuration if not specified.
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - default
        required:
        - type
        description: 'Optimized chunking strategy focusing on speed and avoiding duplication of content chunks. Deprecated: use one of the named chunking strategies instead.'
        deprecated: true
      - type: object
        properties:
          type:
            type: string
            enum:
            - advanced
          chunk_max_characters:
            type: number
            default: 500
            description: Defines the absolute maximum character length per chunk. Text elements exceeding this size will be automatically split into multiple chunks.
          chunk_overlap:
            type: number
            default: 0
            description: Specifies the number of characters to overlap between consecutive chunks. This overlap helps maintain semantic continuity when splitting large text elements.
        required:
        - type
        description: 'Provides advanced settings for customizing chunking behavior, enabling fine-grained control to better meet specific data processing needs. Deprecated: use one of the named chunking strategies instead.'
        deprecated: true
      - type: object
        properties:
          type:
            type: string
            enum:
            - token
          chunk_size:
            type: integer
            default: 512
            description: Maximum number of tokens per chunk.
          chunk_overlap:
            type: integer
            default: 0
            description: Number of tokens to overlap between consecutive chunks. Helps preserve continuity across chunk boundaries.
        required:
        - type
        description: Splits text into fixed-size token windows with optional overlap. Predictable chunk sizes, no regard for sentence or paragraph boundaries.
      - type: object
        properties:
          type:
            type: string
            enum:
            - sentence
          chunk_size:
            type: integer
            default: 512
            description: Maximum number of tokens per chunk.
          chunk_overlap:
            type: integer
            default: 0
            description: Number of tokens to overlap between consecutive chunks. Helps preserve continuity across chunk boundaries.
          min_sentences_per_chunk:
            type: integer
            default: 1
            description: Minimum number of sentences each chunk must contain.
        required:
        - type
        description: Groups whole sentences up to the chunk size, so chunks never cut a sentence in half.
      - type: object
        properties:
          type:
            type: string
            enum:
            - recursive
          chunk_size:
            type: integer
            default: 512
            description: Maximum number of tokens per chunk.
          separators:
            type: array
            items:
              type: string
            description: Separator hierarchy to split on, tried in order. Defaults to paragraph, line, space, then character.
          min_characters_per_chunk:
            type: integer
            default: 24
            description: Minimum number of characters each chunk must contain.
        required:
        - type
        description: Splits on a separator hierarchy, falling back through paragraph, line, sentence, and word boundaries until chunks fit. Respects document structure.
      - type: object
        properties:
          type:
            type: string
            enum:
            - fast
          target_size:
            type: integer
            default: 4096
            description: Target chunk size in bytes.
          delimiters:
            type: string
            default: '

              .?'
            description: Single-byte characters to split on.
          pattern:
            type: string
            description: Multi-byte split pattern. Takes precedence over delimiters when set.
          prefix:
            type: boolean
            default: false
            description: Attach the delimiter to the start of the next chunk instead of the end of the previous one.
          consecutive:
            type: boolean
            default: false
            description: Split at the start of a run of consecutive delimiters rather than at each one.
          forward_fallback:
            type: boolean
            default: false
            description: Search forward for a delimiter when searching backward finds none.
        required:
        - type
        description: Splits on delimiters or a regular expression without tokenizing. Fastest option; chunk sizes vary with where delimiters fall.
      - type: object
        properties:
          type:
            type: string
            enum:
            - semantic
          chunk_size:
            type: integer
            default: 512
            description: Maximum number of tokens per chunk.
          embedding_model:
            type: string
            description: Embedding model used to detect semantic boundaries.
          dimensions:
            type: integer
            description: Number of dimensions for the embedding output, when the model supports it.
          threshold:
            type: string
            default: auto
            description: Similarity threshold from 0 through 1, or "auto".
          mode:
            type: string
            default: window
            enum:
            - window
            - sentence
            description: Comparison mode.
          similarity_window:
            type: integer
            default: 1
            description: Window size for similarity comparison.
        required:
        - type
        description: Embeds the text and breaks where meaning shifts, so related passages stay together. Makes paid embedding calls.
      - type: object
        properties:
          type:
            type: string
            enum:
            - late
          chunk_size:
            type: integer
            default: 512
            description: Maximum number of tokens per chunk.
          separators:
            type: array
            items:
              type: string
            description: Separator hierarchy to split on, tried in order. Defaults to paragraph, line, space, then character.
          min_characters_per_chunk:
            type: integer
            default: 24
            description: Minimum number of characters each chunk must contain.
          embedding_model:
            type: string
            description: Embedding model used to embed the document before it is split.
          dimensions:
            type: integer
            description: Number of dimensions for the embedding output, when the model supports it.
        required:
        - type
        description: Embeds the document before splitting it recursively, so each chunk is embedded with the surrounding document in context. Makes paid embedding calls.
      - type: object
        properties:
          type:
            type: string
            enum:
            - agentic
          chunk_size:
            type: integer
            default: 1024
            description: Maximum number of tokens per chunk.
          model:
            type: string
            default: openai/gpt-4o
            description: Model that chooses the chunk boundaries.
          candidate_size:
            type: integer
            default: 128
            description: Size of candidate splits offered to the model.
          min_characters_per_chunk:
            type: integer
            default: 24
            description: Minimum number of characters each chunk must contain.
          system_prompt:
            type: string
            description: Custom system prompt for the boundary model.
        required:
        - type
        description: Asks a model to choose the boundaries. Slowest and most expensive, best on documents with irregular structure. Makes paid model calls.
