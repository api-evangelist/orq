components:
  schemas:
    ChunkingCleanupOptions:
      type: object
      properties:
        delete_emails:
          type: boolean
        delete_credit_cards:
          type: boolean
        delete_phone_numbers:
          type: boolean
        clean_bullet_points:
          type: boolean
        clean_numbered_list:
          type: boolean
        clean_unicode:
          type: boolean
        clean_dashes:
          type: boolean
        clean_whitespaces:
          type: boolean
    ChunksServiceUpdateRequest:
      required: []
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: The text content of the chunk
        embedding:
          type: array
          items:
            type: number
            format: double
        metadata:
          type: object
          additionalProperties:
            anyOf:
            - type: string
            - type: number
            - type: boolean
          description: Metadata of the chunk
    ChunkProcessingAttempts:
      type: object
      properties:
        id:
          type: string
        processing_attempts:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingAttempt'
    DatasourcesServicePreviewChunksRequest:
      required:
      - file_id
      type: object
      properties:
        file_id:
          type: string
        chunking_options:
          $ref: '#/components/schemas/DatasourceChunkingOptions'
    SearchRerankConfig:
      required:
      - model
      type: object
      properties:
        model:
          example: cohere/rerank-v4.0-pro
          type: string
          description: The name of the rerank model to use. Refer to the [model list](https://docs.orq.ai/ai-gateway/supported-models#rerank-models).
        threshold:
          maximum: 1
          type: number
          default: 0
          description: The threshold value used to filter the rerank results, only documents with a relevance score greater than the threshold will be returned
          format: double
          minimum: 0
        top_k:
          maximum: 100
          minimum: 1
          type: integer
          default: 10
          description: The number of top results to return after reranking. If not provided, will default to the knowledge base configured `top_k`.
          format: int32
    SearchKnowledgeMatch:
      required:
      - id
      - text
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        vector:
          type: array
          items:
            type: number
            format: double
          description: Embedding vector of the chunk, returned only when requested.
        metadata:
          type: object
          description: Arbitrary chunk metadata, omitted unless requested.
        scores:
          allOf:
          - $ref: '#/components/schemas/SearchKnowledgeScores'
          description: Search and rerank scores, omitted unless requested.
    KnowledgeBasesServiceUpdateRequest:
      oneOf:
      - type: object
        properties:
          description:
            type:
            - string
            - 'null'
            description: The description of the knowledge base.
          path:
            type: string
            description: 'Entity storage path.


              With workspace-level API keys, use the format `project/folder/subfolder/...`. The first element identifies the project, followed by nested folders (auto-created as needed). Example: `Default/agents`.


              With project-level API keys, the project is predetermined by the API key, so the path is relative to that project. Example: `agents`. For backward compatibility, a leading project name is ignored when it matches the scoped project.'
            example: Default
          retrieval_settings:
            type: object
            properties:
              top_k:
                type: integer
                exclusiveMinimum: 0
                default: 5
                description: The number of results to return from the search.
              threshold:
                type: number
                minimum: 0
                maximum: 1
                default: 0
                description: The threshold value used to filter the search results, only documents with a relevance score greater than the threshold will be returned
              rerank_config:
                type:
                - object
                - 'null'
                properties:
                  top_k:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 5
                    description: The number of results to return by the reranking model
                  rerank_threshold:
                    type: number
                    minimum: 0
                    maximum: 1
                    default: 0.5
                    description: The threshold value used to filter the rerank results, only documents with a relevance score greater than the threshold will be returned
                  rerank_model:
                    type: string
                    description: The rerank model to use for the knowledge base.
                required:
                - rerank_model
                description: The rerank configuration for the knowledge base. In case the model is provided it will be used to enhance the search precision.
              agentic_rag_config:
                type:
                - object
                - 'null'
                properties:
                  model:
                    type: string
                    description: The model to use for the Agentic RAG
                required:
                - model
                description: The Agentic RAG configuration for the knowledge base. If `null` is provided, Agentic RAG will be disabled.
            description: The retrieval settings for the knowledge base.
          external_config:
            type: object
            properties:
              name:
                type: string
                description: The name of the external knowledge base.
              api_url:
                type: string
                format: uri
                description: The API URL for the external knowledge base.
              api_key:
                type: string
                description: The API key for the external knowledge base.
            description: Configuration for the external knowledge base.
          type:
            type: string
            enum:
            - external
            default: external
          settings:
            $ref: '#/components/schemas/KnowledgeUpdateSettings'
          domain_id:
            type: string
      - type: object
        properties:
          description:
            type:
            - string
            - 'null'
            description: The description of the knowledge base.
          embedding_model:
            type: string
            description: The embeddings model used for the knowledge base. If the models is provided and is different than the previous set model, all the datasources in the knowledge base will be re-embedded.
          path:
            type: string
            description: 'Entity storage path.


              With workspace-level API keys, use the format `project/folder/subfolder/...`. The first element identifies the project, followed by nested folders (auto-created as needed). Example: `Default/agents`.


              With project-level API keys, the project is predetermined by the API key, so the path is relative to that project. Example: `agents`. For backward compatibility, a leading project name is ignored when it matches the scoped project.'
            example: Default
          retrieval_settings:
            type: object
            properties:
              retrieval_type:
                type: string
                enum:
                - vector_search
                - keyword_search
                - hybrid_search
                default: hybrid_search
                description: The retrieval type to use for the knowledge base. If not provided, Hybrid Search will be used as a default query strategy.
              top_k:
                type: integer
                exclusiveMinimum: 0
                default: 5
                description: The number of results to return from the search.
              threshold:
                type: number
                minimum: 0
                maximum: 1
                default: 0
                description: The threshold value used to filter the search results, only documents with a relevance score greater than the threshold will be returned
              rerank_config:
                type:
                - object
                - 'null'
                properties:
                  top_k:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 5
                    description: The number of results to return by the reranking model
                  rerank_threshold:
                    type: number
                    minimum: 0
                    maximum: 1
                    default: 0.5
                    description: The threshold value used to filter the rerank results, only documents with a relevance score greater than the threshold will be returned
                  rerank_model:
                    type: string
                    description: The rerank model to use for the knowledge base.
                required:
                - rerank_model
                description: The rerank configuration for the knowledge base. In case the model is provided it will be used to enhance the search precision.
              agentic_rag_config:
                type:
                - object
