openapi: 3.2.0
info:
  title: orq.ai Knowledge Bases API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- name: Knowledge Bases
  description: Create and manage knowledge bases used by agents and retrieval workflows.
paths:
  /v2/knowledge:
    get:
      tags:
      - Knowledge Bases
      summary: List all knowledge bases
      description: Returns a list of your knowledge bases. The knowledge bases are returned sorted by creation date, with the most recent knowledge bases appearing first
      operationId: ListKnowledgeBases
      parameters:
      - schema:
          type: string
          description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        required: false
        description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        name: starting_after
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        required: false
        description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        name: ending_before
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 300
          default: 25
          description: A limit on the number of objects to be returned. Limit can range between 1 and 300, and the default is 25
        required: false
        description: A limit on the number of objects to be returned. Limit can range between 1 and 300, and the default is 25
        name: limit
        in: query
      - schema:
          type: string
          description: Filter knowledge bases by key (case-insensitive match)
        required: false
        description: Filter knowledge bases by key (case-insensitive match)
        name: search
        in: query
      - schema:
          type: string
          description: Filter by the users who last updated the knowledge base. Accepts a comma-separated list of user IDs
        required: false
        description: Filter by the users who last updated the knowledge base. Accepts a comma-separated list of user IDs
        name: updated_by
        in: query
      - schema:
          type: string
          enum:
          - internal
          - external
          description: Filter knowledge bases by type
        required: false
        description: Filter knowledge bases by type
        name: type
        in: query
      - schema:
          type: string
          description: Filter knowledge bases by project ID
        required: false
        description: Filter knowledge bases by project ID
        name: project_id
        in: query
      responses:
        '200':
          description: Knowledge bases retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBasesServiceListResponse'
        '401':
          description: Unauthorized - Bearer token is missing or invalid.
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: list
      x-cli-group: knowledge-bases
      x-cli-name: list
      x-code-samples:
      - lang: curl
        label: Core - List knowledge bases
        source: "curl --request GET \\\n  --url 'https://my.orq.ai/v2/knowledge?limit=25' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\"\n"
    post:
      tags:
      - Knowledge Bases
      summary: Create a knowledge base
      description: Creates an internal or external knowledge base. Internal knowledge bases embed and index uploaded content; external knowledge bases query the configured external retrieval API.
      operationId: CreateKnowledge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBasesServiceCreateRequest'
        required: true
      responses:
        '200':
          description: Knowledge successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge'
        '401':
          description: Unauthorized - Bearer token is missing or invalid.
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: create
      x-cli-group: knowledge-bases
      x-cli-name: create
      x-code-samples:
      - lang: curl
        label: Core - Create knowledge base
        source: "curl --request POST \\\n  --url 'https://my.orq.ai/v2/knowledge' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"type\": \"internal\",\n    \"key\": \"product-docs\",\n    \"description\": \"Product documentation\",\n    \"embedding_model\": \"openai/text-embedding-3-small\",\n    \"path\": \"Default/knowledge\"\n  }'\n"
  /v2/knowledge/{knowledge_id}:
    get:
      tags:
      - Knowledge Bases
      summary: Retrieve a knowledge base
      description: Retrieve a knowledge base with the settings.
      operationId: GetOneKnowledge
      parameters:
      - name: knowledge_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Knowledge base retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge'
        '401':
          description: Unauthorized - Bearer token is missing or invalid.
        '404':
          description: Knowledge not found
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: retrieve
      x-cli-group: knowledge-bases
      x-cli-name: retrieve
      x-code-samples:
      - lang: curl
        label: Core - Retrieve knowledge base
        source: "curl --request GET \\\n  --url 'https://my.orq.ai/v2/knowledge/01JEXAMPLEKNOWLEDGEBASE01' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\"\n"
    delete:
      tags:
      - Knowledge Bases
      summary: Delete a knowledge base
      description: Deletes a knowledge base. Deleting a knowledge base will delete all the datasources and chunks associated with it.
      operationId: DeleteKnowledge
      parameters:
      - name: knowledge_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Knowledge successfully deleted
        '401':
          description: Unauthorized - Bearer token is missing or invalid.
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: delete
      x-cli-group: knowledge-bases
      x-cli-name: delete
      x-code-samples:
      - lang: curl
        label: Core - Delete knowledge base
        source: "curl --request DELETE \\\n  --url 'https://my.orq.ai/v2/knowledge/01JEXAMPLEKNOWLEDGEBASE01' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\"\n"
    patch:
      tags:
      - Knowledge Bases
      summary: Update a knowledge base
      description: Updates a knowledge base. Omitted optional fields retain their current values.
      operationId: UpdateKnowledge
      parameters:
      - name: knowledge_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBasesServiceUpdateRequest'
        required: true
      responses:
        '200':
          description: Knowledge successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge'
        '401':
          description: Unauthorized - Bearer token is missing or invalid.
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: update
      x-cli-group: knowledge-bases
      x-cli-name: update
      x-code-samples:
      - lang: curl
        label: Core - Update knowledge base
        source: "curl --request PATCH \\\n  --url 'https://my.orq.ai/v2/knowledge/01JEXAMPLEKNOWLEDGEBASE01' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"type\": \"internal\",\n    \"description\": \"Current product documentation\",\n    \"retrieval_settings\": {\n      \"retrieval_type\": \"hybrid_search\",\n      \"top_k\": 8,\n      \"threshold\": 0.2\n    }\n  }'\n"
  /v2/knowledge/{knowledge_id}/datasources:
    get:
      tags:
      - Knowledge Bases
      summary: List all datasources
      description: Returns the datasources in a knowledge base. Use cursors to page through results and optional query or status filters to narrow the list.
      operationId: ListDatasources
      parameters:
      - schema:
          type: string
          description: Unique identifier of the knowledge base
        required: true
        description: Unique identifier of the knowledge base
        name: knowledge_id
        in: path
      - schema:
          type: string
          description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        required: false
        description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        name: starting_after
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        required: false
        description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        name: ending_before
        in: query
      - schema:
          type: string
          description: Search query to find datasources by name.
        required: false
        description: Search query to find datasources by name.
        name: q
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
          description: A limit on the number of objects to be returned. Limit can range between 1 and 50, and the default is 50
        required: false
        description: A limit on the number of objects to be returned. Limit can range between 1 and 50, and the default is 50
        name: limit
        in: query
      - schema:
          anyOf:
          - type: array
            items:
              type: string
            example:
            - completed
            - failed
          - type: string
            example: completed
          description: Filter datasources by status.
        required: false
        description: Filter datasources by status.
        name: status
        in: query
      responses:
        '200':
          description: Datasources successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourcesServiceListResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The resource does not exist. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: listDatasources
      x-cli-group: knowledge-bases
      x-cli-name: listDatasources
      x-code-samples:
      - lang: curl
        label: Core - List datasources
        source: "curl --request GET \\\n  --url 'https://my.orq.ai/v2/knowledge/01JEXAMPLEKNOWLEDGEBASE01/datasources?limit=50' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\"\n"
    post:
      tags:
      - Knowledge Bases
      summary: Create a new datasource
      description: Creates a datasource shell when only a display name is provided. When file_id is provided, the uploaded file is queued for chunking and ingestion.
      operationId: CreateDatasource
      parameters:
      - name: knowledge_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourcesServiceCreateRequest'
        required: true
      responses:
        '200':
          description: Datasource successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datasource'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create datasource
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: createDatasource
      x-cli-group: knowledge-bases
      x-cli-name: createDatasource
      x-code-samples:
      - lang: curl
        label: Core - Create datasource
        source: "curl --request POST \\\n  --url 'https://my.orq.ai/v2/knowledge/01JEXAMPLEKNOWLEDGEBASE01/datasources' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"display_name\": \"Product guide\",\n    \"file_id\": \"file_01JEXAMPLE00000000000001\",\n    \"chunking_options\": {\n      \"chunking_configuration\": {\n        \"type\": \"advanced\",\n        \"chunk_max_characters\": 800,\n        \"chunk_overlap\": 100\n      }\n    }\n  }'\n"
  /v2/knowledge/{knowledge_id}/datasources/preview-chunks:
    post:
      tags:
      - Knowledge Bases
      summary: Preview datasource chunks
      description: Parses an uploaded file and returns the chunks it would produce for the given chunking options without creating a datasource.
      operationId: PreviewDatasourceChunks
      parameters:
      - name: knowledge_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourcesServicePreviewChunksRequest'
        required: true
      responses:
        '200':
          description: Datasource chunk preview successfully generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourcesServicePreviewChunksResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: previewChunks
      x-cli-group: knowledge-bases
      x-cli-name: previewChunks
  /v2/knowledge/{knowledge_id}/datasources/{datasource_id}:
    get:
      tags:
      - Knowledge Bases
      summary: Retrieve a datasource
      description: Retrieves a datasource and its current processing status and chunk count.
      operationId: RetrieveDatasource
      parameters:
      - name: knowledge_id
        in: path
        required: true
        schema:
          type: string
      - name: datasource_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Datasource successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datasource'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The resource does not exist. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: retrieveDatasource
      x-cli-group: knowledge-bases
      x-cli-name: retrieveDatasource
      x-code-samples:
      - lang: curl
        label: Core - Retrieve datasource
        source: "curl --request GET \\\n  --url 'https://my.orq.ai/v2/knowledge/01JEXAMPLEKNOWLEDGEBASE01/datasources/01JEXAMPLEDATASOURCE0001' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\"\n"
    delete:
      tags:
      - Knowledge Bases
      summary: Delete a datasource
      description: Deletes a datasource from a knowledge base. Deleting a datasource will remove it from the knowledge base and all associated chunks. This action is irreversible and cannot be undone.
      operationId: DeleteDatasource
      parameters:
      - name: knowledge_id
        in: path
        required: true
        schema:
          type: string
      - name: datasource_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Datasource successfully deleted
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: deleteDatasource
      x-cli-group: knowledge-bases
      x-cli-name: deleteDatasource
      x-code-samples:
      - lang: curl
        label: Core - Delete datasource
        source: "curl --request DELETE \\\n  --url 'https://my.orq.ai/v2/knowledge/01JEXAMPLEKNOWLEDGEBASE01/datasources/01JEXAMPLEDATASOURCE0001' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\"\n"
    patch:
      tags:
      - Knowledge Bases
      summary: Update a datasource
      description: Updates the display name of a datasource.
      operationId: UpdateDatasource
      parameters:
      - name: knowledge_id
        in: path
        required: true
        schema:
          type: string
      - name: datasource_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourcesServiceUpdateRequest'
        required: true
      responses:
        '200':
          description: Datasource successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datasource'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: updateDatasource
      x-cli-group: knowledge-bases
      x-cli-name: updateDatasource
      x-code-samples:
      - lang: curl
        label: Core - Update datasource
        source: "curl --request PATCH \\\n  --url 'https://my.orq.ai/v2/knowledge/01JEXAMPLEKNOWLEDGEBASE01/datasources/01JEXAMPLEDATASOURCE0001' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\"display_name\":\"Product guide 2026\"}'\n"
  /v2/knowledge/{knowledge_id}/datasources/{datasource_id}/chunks:
    get:
      tags:
      - Knowledge Bases
      summary: List all chunks for a datasource
      description: Returns chunks using cursor pagination, with optional text and processing-status filters.
      operationId: ListChunks
      parameters:
      - schema:
          type: string
          description: The unique identifier of the knowledge base
        required: true
        description: The unique identifier of the knowledge base
        name: knowledge_id
        in: path
      - schema:
          type: string
          description: The unique identifier of the datasource.
        required: true
        description: The unique identifier of the datasource.
        name: datasource_id
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
          description: A limit on the number of objects to be returned. Limit can range between 1 and 200, and the default is 10
        required: false
        description: A limit on the number of objects to be returned. Limit can range between 1 and 200, and the default is 10
        name: limit
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        required: false
        description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        name: starting_after
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        required: false
        description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        name: ending_before
        in: query
      - schema:
          type: string
          description: Search query to find datasources by name.
        required: false
        description: Search query to find datasources by name.
        name: q
        in: query
      - schema:
          anyOf:
          - type: array
            items:
              type: string
              enum:
              - pending
              - processing
              - completed
              - failed
              - queued
            example:
            - completed
            - failed
          - type: string
            enum:
            - pending
            - processing
            - completed
            - failed
            - queued
            example: completed
          description: Filter chunks by status.
        required: false
        description: Filter chunks by status.
        name: status
        in: query
      responses:
        '200':
          description: Chunks successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunksServiceListResponse'
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The resource does not exist. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: listChunks
      x-cli-group: knowledge-bases
      x-cli-name: listChunks
      x-code-samples:
      - lang: curl
        label: Core - List chunks
        source: "curl --request GET \\\n  --url 'https://my.orq.ai/v2/knowledge/01JEXAMPLEKNOWLEDGEBASE01/datasources/01JEXAMPLEDATASOURCE0001/chunks?limit=100' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\"\n"
    post:
      tags:
      - Knowledge Bases
      summary: Create chunks for a datasource
      description: Creates between 1 and 100 chunks. Chunks with supplied embeddings are indexed immediately; chunks without embeddings are queued for embedding.
      operationId: CreateChunk
      parameters:
      - name: knowledge_id
        in: path
        required: true
        schema:
          type: string
      - name: datasource_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UpsertChunk'
              minItems: 1
              maxItems: 100
              description: Array of chunks to create. Maximum of 100 chunks per request.
        required: true
      responses:
        '200':
          description: Chunk successfully created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeChunk'
                description: Array of created chunks
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create chunk
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: createChunks
      x-cli-group: knowledge-bases
      x-cli-name: createChunks
      x-code-samples:
      - lang: curl
        label: Core - Create chunks
        source: "curl --request POST \\\n  --url 'https://my.orq.ai/v2/knowledge/01JEXAMPLEKNOWLEDGEBASE01/datasources/01JEXAMPLEDATASOURCE0001/chunks' \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --header 'Content-Type: application/json' \\\n  --data '[\n    {\n      \"text\": \"ORQ routes each request to the configured model.\",\n      \"metadata\": {\"section\":\"routing\"}\n    }\n  ]'\n"
    delete:
