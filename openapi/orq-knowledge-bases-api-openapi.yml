  /v2/knowledge/{knowledge_id}/search:
    post:
      tags:
      - Knowledge Bases
      summary: Search knowledge base
      description: Search a Knowledge Base and return the most similar chunks, along with their search and rerank scores. Note that all configuration changes made in the API will override the settings in the UI.
      operationId: SearchKnowledge
      parameters:
      - name: knowledge_id
        in: path
        description: The unique identifier or key of the knowledge base.
        required: true
        schema:
          type: string
      requestBody:
        description: A search request for chunks in a knowledge base
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchKnowledgeRequest'
        required: true
      responses:
        '200':
          description: Search knowledge base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchKnowledgeResponse'
        '401':
          description: Unauthorized - Bearer token is missing or invalid.
      x-speakeasy-group: knowledge
      x-speakeasy-name-override: search
      x-cli-group: knowledge-bases
      x-cli-name: search
      x-code-samples:
      - lang: curl
        label: Core
        source: "curl --request POST \\\n  --url \"https://my.orq.ai/v2/knowledge/$KNOWLEDGE_ID/search\" \\\n  --header \"Authorization: Bearer $ORQ_API_KEY\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"query\": \"What is our refund policy?\",\n    \"top_k\": 10,\n    \"search_type\": \"hybrid_search\",\n    \"search_options\": {\n      \"include_vectors\": false,\n      \"include_metadata\": true,\n      \"include_scores\": true\n    }\n  }'"
      - lang: typescript
        label: Node.js
        source: "import { Orq } from \"@orq-ai/node\";\n\nconst orq = new Orq({\n  apiKey: process.env[\"ORQ_API_KEY\"]\n});\n\nconst result = await orq.knowledge.search({\n  knowledgeId: process.env[\"KNOWLEDGE_ID\"],\n  requestBody: {\n    query: \"What is our refund policy?\",\n    topK: 10,\n    searchType: \"hybrid_search\",\n    searchOptions: {\n      includeVectors: false,\n      includeMetadata: true,\n      includeScores: true\n    }\n  }\n});\n\nconsole.log(result.matches);"
      - lang: python
        label: Python
        source: "import os\nfrom orq_ai_sdk import Orq\n\norq = Orq(api_key=os.getenv(\"ORQ_API_KEY\"))\n\nresult = orq.knowledge.search(\n    knowledge_id=os.getenv(\"KNOWLEDGE_ID\"),\n    query=\"What is our refund policy?\",\n    top_k=10,\n    search_type=\"hybrid_search\",\n    search_options={\n        \"include_vectors\": False,\n        \"include_metadata\": True,\n        \"include_scores\": True,\n    },\n)\n\nprint(result.matches)"
