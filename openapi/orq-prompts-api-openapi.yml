  /v2/prompts/{prompt_id}/versions/{version_id}:
    get:
      tags:
      - Prompts
      x-speakeasy-group: prompts
      x-speakeasy-name-override: getVersion
      x-cli-group: prompts
      x-cli-name: getVersion
      operationId: GetPromptVersion
      summary: Retrieve a prompt version
      description: Retrieves a specific version of a prompt by its ID and version ID.
      parameters:
      - schema:
          type: string
          description: The unique identifier of the prompt
        required: true
        description: The unique identifier of the prompt
        name: prompt_id
        in: path
      - schema:
          type: string
          description: The unique identifier of the prompt version
        required: true
        description: The unique identifier of the prompt version
        name: version_id
        in: path
      responses:
        '200':
          description: Prompt version retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    _id:
                      type: string
                    created_by_id:
                      type:
                      - string
                      - 'null'
                      format: uuid
                    updated_by_id:
                      type:
                      - string
                      - 'null'
                      format: uuid
                    description:
                      type:
                      - string
                      - 'null'
                      description: The prompt’s description, meant to be displayable in the UI. Use this field to optionally store a long form explanation of the prompt for your own purpose
                    prompt_config:
                      type: object
                      properties:
                        stream:
                          type: boolean
                        model:
                          type:
                          - string
                          - 'null'
                        model_db_id:
                          type:
                          - string
                          - 'null'
                        model_type:
                          type:
                          - string
                          - 'null'
                          enum:
                          - chat
                          - completion
                          - embedding
                          - image
                          - tts
                          - stt
                          - rerank
                          - ocr
                          - moderation
                          - vision
                          - null
                          description: The modality of the model
                        model_parameters:
                          type: object
                          properties:
                            temperature:
                              type: number
                              description: Only supported on `chat` and `completion` models.
                            maxTokens:
                              type: number
                              description: Only supported on `chat` and `completion` models.
                            topK:
                              type: number
                              description: Only supported on `chat` and `completion` models.
                            topP:
                              type: number
                              description: Only supported on `chat` and `completion` models.
                            frequencyPenalty:
                              type: number
                              description: Only supported on `chat` and `completion` models.
                            presencePenalty:
                              type: number
                              description: Only supported on `chat` and `completion` models.
                            numImages:
                              type: number
                              description: Only supported on `image` models.
                            seed:
                              type: number
                              description: Best effort deterministic seed for the model. Currently only OpenAI models support these
                            format:
                              type: string
                              enum:
                              - url
                              - b64_json
                              - text
                              - json_object
                              description: Only supported on `image` models.
                            dimensions:
                              type: string
                              description: Only supported on `image` models.
                            quality:
                              type: string
                              description: Only supported on `image` models.
                            style:
                              type: string
                              description: Only supported on `image` models.
                            responseFormat:
