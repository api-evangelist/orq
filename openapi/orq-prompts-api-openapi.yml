                                  anyOf:
                                  - type: string
                                    description: The contents of the assistant message.
                                  - type: array
                                    items:
                                      oneOf:
                                      - $ref: '#/components/schemas/TextContentPartSchema'
                                      - $ref: '#/components/schemas/RefusalPartSchema'
                                      - $ref: '#/components/schemas/ReasoningPartSchema'
                                      - $ref: '#/components/schemas/RedactedReasoningPartSchema'
                                      discriminator:
                                        propertyName: type
                                        mapping:
                                          text: '#/components/schemas/TextContentPartSchema'
                                          refusal: '#/components/schemas/RefusalPartSchema'
                                          reasoning: '#/components/schemas/ReasoningPartSchema'
                                          redacted_reasoning: '#/components/schemas/RedactedReasoningPartSchema'
                                    description: An array of content parts with a defined type. Can be one or more of type `text`, or exactly one of type `refusal`.
                                  - type: 'null'
                                  description: The contents of the assistant message. Required unless `tool_calls` or `function_call` is specified.
                                refusal:
                                  type:
                                  - string
                                  - 'null'
                                  description: The refusal message by the assistant.
                                role:
                                  type: string
                                  enum:
                                  - assistant
                                  description: The role of the messages author, in this case `assistant`.
                                name:
                                  type: string
                                  description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
                                audio:
                                  type:
                                  - object
                                  - 'null'
                                  properties:
                                    id:
                                      type: string
                                      description: Unique identifier for a previous audio response from the model.
                                  required:
                                  - id
                                  description: 'Data about a previous audio response from the model. '
                                tool_calls:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      id:
                                        type: string
                                        description: The ID of the tool call.
                                      type:
                                        type: string
                                        enum:
                                        - function
                                        description: The type of the tool. Currently, only `function` is supported.
                                      function:
                                        type: object
                                        properties:
                                          name:
                                            type: string
                                            description: The name of the function to call.
                                          arguments:
                                            type: string
                                            description: The arguments to call the function with, as generated by the model in JSON format. Note that the model does not always generate valid JSON, and may hallucinate parameters not defined by your function schema. Validate the arguments in your code before calling your function.
                                      thought_signature:
                                        type: string
                                        description: Encrypted representation of the model internal reasoning state during function calling. Required by Gemini 3 models when continuing a conversation after a tool call.
                                    required:
                                    - id
                                    - type
                                    - function
                                  description: The tool calls generated by the model, such as function calls.
                              required:
                              - role
                              title: Assistant message
                            - type: object
                              properties:
                                role:
                                  type: string
                                  enum:
                                  - tool
                                  description: The role of the messages author, in this case tool.
                                content:
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      oneOf:
                                      - $ref: '#/components/schemas/TextContentPartSchema'
                                      discriminator:
                                        propertyName: type
                                        mapping:
                                          text: '#/components/schemas/TextContentPartSchema'
                                  description: The contents of the tool message.
                                tool_call_id:
                                  type:
                                  - string
                                  - 'null'
                                  description: Tool call that this message is responding to.
                                cache_control:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - ephemeral
                                      description: Create a cache control breakpoint at this content block. Accepts only the value "ephemeral".
                                    ttl:
                                      type: string
                                      enum:
                                      - 5m
                                      - 1h
                                      default: 5m
                                      description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                                        - `5m`: 5 minutes

                                        - `1h`: 1 hour


                                        Defaults to `5m`. Only supported by `Anthropic` Claude models.'
                                  required:
                                  - type
                              required:
                              - role
                              - content
                              - tool_call_id
                              title: Tool message
                          description: Array of messages that make up the conversation. Each message has a role (system, user, assistant, or tool) and content.
                        model:
                          type:
                          - string
                          - 'null'
                          description: 'Model ID used to generate the response, like `openai/gpt-5.6-sol` or `anthropic/claude-sonnet-5`. For private models, use format: `{workspaceKey}@{provider}/{model}`.'
                          example: openai/gpt-5.6-sol
                        version:
                          type: string
                        fallback_on_codes:
                          type: array
                          items:
                            type: integer
                            minimum: 400
                            maximum: 599
                          maxItems: 20
                          description: HTTP status codes that trigger fallback. Enter up to 20 unique integers from 400 to 599. When omitted or empty, defaults to [408, 429, 500, 502, 503, 504, 529].
                      title: PromptField
                      description: Prompt configuration with model and messages. Use this instead of prompt_config.
                    metadata:
                      type: object
                      properties:
                        use_cases:
                          type: array
                          items:
                            type: string
                            enum:
                            - Agents simulations
                            - Agents
                            - API interaction
                            - Autonomous Agents
                            - Chatbots
                            - Classification
                            - Code understanding
                            - Code writing
                            - Conversation
                            - Documents QA
                            - Evaluation
                            - Extraction
                            - Multi-modal
                            - Self-checking
                            - Sentiment analysis
                            - SQL
                            - Summarization
                            - Tagging
                            - Translation (document)
                            - Translation (sentences)
                          description: A list of use cases that the prompt is meant to be used for. Use this field to categorize the prompt for your own purpose
                        language:
                          type:
                          - string
                          - 'null'
                          enum:
                          - Chinese
                          - Dutch
                          - English
                          - French
                          - German
                          - Russian
                          - Spanish
                          - null
                          description: The language that the prompt is written in. Use this field to categorize the prompt for your own purpose
                      default:
                        language: English
                  required:
                  - _id
                  - prompt
                - type: object
                  properties:
                    timestamp:
                      type: string
                  required:
                  - timestamp
        '404':
          description: Not Found - The prompt or prompt version does not exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
components:
  schemas:
    ImageContentPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - image_url
        image_url:
          type: object
          properties:
            url:
              type: string
              description: Either a URL of the image or the base64 encoded image data.
            detail:
              type: string
              enum:
              - low
              - high
              - auto
              description: Specifies the detail level of the image.
          required:
          - url
        cache_control:
          type: object
          properties:
            type:
              type: string
              enum:
              - ephemeral
              description: Create a cache control breakpoint at this content block. Accepts only the value "ephemeral".
            ttl:
              type: string
              enum:
              - 5m
              - 1h
              default: 5m
              description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                - `5m`: 5 minutes

                - `1h`: 1 hour


                Defaults to `5m`. Only supported by `Anthropic` Claude models.'
          required:
          - type
      required:
      - type
      - image_url
      title: Image content part
      description: An image content part
    RedactedReasoningPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - redacted_reasoning
          description: The type of the content part. Always `reasoning`.
        data:
          type: string
          description: The encrypted reasoning or thought process behind the response. Used for chain-of-thought or extended thinking.
      required:
      - type
      - data
      title: Reasoning Part
      description: A message part containing reasoning or chain-of-thought content
    AudioContentPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - input_audio
        input_audio:
          type: object
          properties:
            data:
              type: string
              description: Base64 encoded audio data.
            format:
              type: string
              enum:
              - mp3
              - wav
              description: The format of the encoded audio data. Currently supports `wav` and `mp3`.
          required:
          - data
          - format
      required:
      - type
      - input_audio
      title: Audio content part
      description: An audio content part
    ThinkingConfigAdaptiveSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - adaptive
          description: Lets the model dynamically determine when and how much to use extended thinking based on the complexity of each request. Supported on Claude Opus 4.6 and Sonnet 4.6.
      required:
      - type
      title: Thinking config adaptive
      description: Enables adaptive thinking mode where the model dynamically determines thinking depth
    ReasoningPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - reasoning
          description: The type of the content part. Always `reasoning`.
        reasoning:
          type: string
          description: The reasoning or thought process behind the response. Used for chain-of-thought or extended thinking.
        signature:
          type: string
          description: Optional cryptographic signature to verify the authenticity and integrity of the reasoning content
      required:
      - type
      - reasoning
      - signature
      title: Reasoning Part
      description: A message part containing reasoning or chain-of-thought content
    TextContentPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - text
          description: The type of the content part.
        text:
          type: string
          description: The text content.
        cache_control:
          type: object
          properties:
            type:
              type: string
              enum:
              - ephemeral
              description: Create a cache control breakpoint at this content block. Accepts only the value "ephemeral".
            ttl:
              type: string
              enum:
              - 5m
              - 1h
              default: 5m
              description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                - `5m`: 5 minutes

                - `1h`: 1 hour


                Defaults to `5m`. Only supported by `Anthropic` Claude models.'
          required:
          - type
      required:
      - type
      - text
      title: Text content part
      description: The type of the content part.
    ResponseHealingPlugin:
      type: object
      properties:
        id:
          type: string
          enum:
          - response_healing
          description: Plugin discriminator. Must be `response_healing`.
      required:
      - id
      additionalProperties: false
      title: Response healing plugin
    FileContentPartSchema:
      type: object
      properties:
        file_data:
          type: string
          description: 'The file data as a data URI string in the format `data:<mime-type>;base64,<base64-encoded-data>`. Example: `data:image/png;base64,iVBORw0KGgoAAAANS...`'
        uri:
          type: string
          description: URL of the file. Supported for PDFs on Anthropic Claude models and for `https://` and Google Cloud Storage `gs://` URIs on Vertex AI Gemini models.
        mimeType:
          type: string
          description: MIME type of the file (e.g., application/pdf, image/png). Inferred from `filename` or the URI extension when omitted.
        file_id:
          type: string
          description: 'A provider file reference: a Google Cloud Storage `gs://` URI for Vertex AI Gemini models, or an OpenAI file ID (`file-...`) for OpenAI models.'
        filename:
          type: string
          description: The name of the file, used when passing the file to the model as a string.
      description: File data for the content part. Must contain exactly one of file_data, file_id or uri.
    RefusalPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - refusal
          description: The type of the content part. Always `refusal`.
        refusal:
          type: string
          description: The refusal message generated by the model.
      required:
      - type
      title: Refusal part
      description: A message part containing a refusal message.
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message.
        code:
          type: integer
          description: gRPC status code, when the service reports one.
        details:
          type: array
          items: {}
          description: Additional error details, when the service reports any.
      required:
      - message
    ThinkingConfigDisabledSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - disabled
          description: Disables the thinking mode capability
      required:
      - type
      title: Thinking config disabled
      description: Disables the thinking mode capability
    ThinkingConfigEnabledSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - enabled
          description: Enables or disables the thinking mode capability
        budget_tokens:
          type: number
          description: Determines how many tokens the model can use for its internal reasoning process. Larger budgets can enable more thorough analysis for complex problems, improving response quality. Must be ≥1024 and less than `max_tokens`.
        thinking_level:
          type: string
          enum:
          - minimal
          - low
          - medium
          - high
          description: The level of reasoning the model should use. This setting is supported only by `gemini-3` models. If budget_tokens is specified and `thinking_level` is available, `budget_tokens` will be ignored.
      required:
      - type
      - budget_tokens
      title: Thinking config enabled
      description: Enables the thinking mode capability
    TraceScrubbingPlugin:
      type: object
      properties:
        id:
          type: string
          enum:
          - trace_scrubbing
          description: Plugin discriminator. Must be `trace_scrubbing`.
        mask:
          type: array
          items:
            type: string
            enum:
            - all
            - system
            - input
            - output
            - metadata
            - variables
          minItems: 1
          description: Trace surfaces to scrub. `all` includes system, input, output, metadata, and variables.
      required:
      - id
      - mask
      additionalProperties: false
      title: Trace scrubbing plugin
    PIIRedactionPlugin:
      type: object
      properties:
        id:
          type: string
          enum:
          - pii_redaction
          description: PII redaction plugin.
        language:
          type: string
          description: Detector language. Accepts "auto" to detect the language per request; GET /v2/pii/capabilities lists the concrete languages and does not include "auto". Omitting the field defaults to "auto".
        regions:
          type: array
          items:
            type: string
          description: 'Region codes selecting whole regions of coverage (e.g. "nl", "gb"). Every entity type those regions cover is redacted, alongside the base catalog. ["all"] is exclusive, and leaving both this and entities empty also runs every region, so selecting nothing is the widest request rather than the narrowest. Combines with entities: the two selections are unioned, so entities adds types on top of the region coverage.'
        entities:
          type: array
          items:
            type: string
          description: The entity types to redact. A named type is redacted even when it belongs to a region, so a region's types can be selected individually without naming the region. On its own this is a strict allowlist; alongside regions it adds to the region coverage. See GET /v2/pii/capabilities for valid types.
        entity_thresholds:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          description: Per-entity confidence cutoff overrides in [0,1]. Tunes confidence only and never changes which types are redacted, so every key must also appear in entities.
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Baseline confidence cutoff applied to every entity type without a per-entity override.
        on_failure:
          type: string
          enum:
          - block
          - passthrough
          description: Behaviour when detection fails.
      required:
      - id
      additionalProperties: false
      title: PII redaction plugin
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  url: https://docs.orq.ai
  description: orq.ai Documentation
x-speakeasy-timeout: 600000
