  /v2/agents/{key}/task:
    post:
      tags:
      - Agents
      x-cli-group: agents
      x-cli-name: invoke
      deprecated: true
      x-speakeasy-group: agents
      x-speakeasy-name-override: invoke
      x-speakeasy-max-method-params: 11
      operationId: InvokeAgent
      summary: Execute an agent task
      description: Invoke an agent to perform a task with input messages. Supports tool execution, knowledge retrieval, memory context, and model fallback.
      parameters:
      - schema:
          type: string
          description: The key or ID of the agent to invoke
        required: true
        description: The key or ID of the agent to invoke
        name: key
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: string
                  description: Optional task ID to continue an existing agent execution. When provided, the agent will continue the conversation from the existing task state. The task must be in an inactive state to continue.
                message:
                  type: object
                  properties:
                    messageId:
                      type: string
                      description: Optional A2A message ID in ULID format
                    role:
                      anyOf:
                      - type: string
                        enum:
                        - user
                        title: User message
                        description: Message from the end user
                      - type: string
                        enum:
                        - tool
                        title: Tool message
                        description: Message containing tool execution results
                      description: Message role (user or tool for continuing executions)
                    parts:
                      type: array
                      items:
                        oneOf:
                        - allOf:
                          - $ref: '#/components/schemas/TextPart'
                          - description: Text content part. Use this to send text messages to the agent.
                        - allOf:
                          - $ref: '#/components/schemas/FilePart'
                          - description: File attachment part. Use this to send files (images, documents, etc.) to the agent for processing.
                        - allOf:
                          - $ref: '#/components/schemas/ToolResultPart'
                          - description: Tool execution result part. Use this ONLY when providing results for a pending tool call from the agent. The tool_call_id must match the ID from the agent's tool call request.
                        - allOf:
                          - $ref: '#/components/schemas/ErrorPart'
                          - description: Error content part. Generated by the system when an error occurs during agent execution.
                        discriminator:
                          propertyName: kind
                          mapping:
                            text: '#/components/schemas/TextPart'
                            file: '#/components/schemas/FilePart'
                            tool_result: '#/components/schemas/ToolResultPart'
                            error: '#/components/schemas/ErrorPart'
                        title: Public Message Part
                        description: Message part that can be provided by users. Use "text" for regular messages, "file" for attachments, or "tool_result" when responding to tool call requests.
                      description: 'A2A message parts (text, file, or tool_result only). Note: Tool role messages must only contain tool_result parts.'
                  required:
                  - role
                  - parts
                  title: A2A Message
                  description: The A2A message to send to the agent (user input or tool results)
                variables:
                  type: object
                  additionalProperties: {}
                  description: Optional variables for template replacement in system prompt, instructions, and messages
                identity:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique identifier for the contact
                      example: contact_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    display_name:
                      type: string
                      description: Display name of the contact
                      example: Jane Doe
                    email:
                      type: string
                      format: email
                      description: Email address of the contact
                      example: jane.doe@example.com
                    metadata:
                      type: array
                      items:
                        type: object
                        additionalProperties: {}
                      description: A hash of key/value pairs containing any other data about the contact
                      example:
                      - department: Engineering
                        role: Senior Developer
                    logo_url:
                      type: string
                      description: URL to the contact's avatar or logo
                      example: https://example.com/avatars/jane-doe.jpg
                    tags:
                      type: array
                      items:
                        type: string
                      description: A list of tags associated with the contact
                      example:
                      - hr
                      - engineering
                  required:
                  - id
                  description: Information about the identity making the request. If the identity does not exist, it will be created automatically.
                contact:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique identifier for the contact
                      example: contact_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    display_name:
                      type: string
                      description: Display name of the contact
                      example: Jane Doe
                    email:
                      type: string
                      format: email
                      description: Email address of the contact
                      example: jane.doe@example.com
                    metadata:
                      type: array
                      items:
                        type: object
                        additionalProperties: {}
                      description: A hash of key/value pairs containing any other data about the contact
                      example:
                      - department: Engineering
                        role: Senior Developer
                    logo_url:
                      type: string
                      description: URL to the contact's avatar or logo
                      example: https://example.com/avatars/jane-doe.jpg
                    tags:
                      type: array
                      items:
                        type: string
                      description: A list of tags associated with the contact
                      example:
                      - hr
                      - engineering
                  required:
                  - id
                  description: '@deprecated Use identity instead. Information about the contact making the request.'
                  deprecated: true
                thread:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique thread identifier to group related invocations.
                      example: thread_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    tags:
                      type: array
                      items:
                        type: string
                      description: Optional tags to differentiate or categorize threads
                      example:
                      - customer-support
                      - priority-high
                  required:
                  - id
                  description: Thread information to group related requests
                memory:
                  type: object
                  properties:
                    entity_id:
                      type: string
                      description: An entity ID used to link memory stores to a specific user, session, or conversation. This ID is used to isolate and retrieve memories specific to the entity across agent executions.
                  required:
                  - entity_id
                  description: Memory configuration for the agent execution. Used to associate memory stores with specific entities like users or sessions.
                metadata:
                  type: object
                  additionalProperties: {}
                  description: Optional metadata for the agent invocation as key-value pairs that will be included in traces
                engine:
                  type: string
                  enum:
                  - text
                  - jinja
                  - mustache
                  description: Override template engine for this invocation. If not provided, uses the agent default.
                configuration:
                  type: object
                  properties:
                    blocking:
                      type: boolean
                      default: false
                      description: Whether to block until the agent task completes. When true, the response will include the full task with messages. When false (default), returns immediately with task ID and status.
                  description: Configuration options for the agent invocation
              required:
              - message
              title: A2A Invoke Request
              description: Request body for invoking an existing agent (stream-task endpoint). Used to start a new task or continue an existing conversation.
      responses:
        '200':
          description: Agent task successfully initiated. Returns the task details including task ID, execution status, and initial response. Use the task ID to track execution progress and retrieve full results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique ID of the created agent execution task
                  contextId:
                    type: string
                    description: The correlation ID for this execution (used for tracking)
                  kind:
                    type: string
                    enum:
                    - task
                    description: A2A entity type identifier
                  status:
                    type: object
                    properties:
                      state:
                        type: string
                        enum:
                        - submitted
                        - working
                        - input-required
                        - auth-required
                        - completed
                        - failed
                        - canceled
                        - rejected
                        title: Task State
                        description: 'Current state of the agent task execution. Values: submitted (queued), working (executing), input-required (awaiting user input), completed (finished successfully), failed (error occurred). Note: auth-required, canceled, and rejected statuses are defined for A2A protocol compatibility but are not currently supported in task execution.'
                      timestamp:
                        type: string
                        description: ISO 8601 timestamp of when the status was updated
                      message:
                        type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - message
                          messageId:
                            type: string
                          role:
                            type: string
                            enum:
                            - user
                            - agent
                            - tool
                            - system
                            title: Extended Message Role
                            description: 'Role of the message sender in the A2A protocol. Values: user (end user), agent (AI agent), tool (tool execution result), system (system instructions/prompts).'
                          parts:
                            type: array
                            items:
                              oneOf:
                              - $ref: '#/components/schemas/TextPart'
                              - $ref: '#/components/schemas/ErrorPart'
                              - $ref: '#/components/schemas/DataPart'
                              - $ref: '#/components/schemas/FilePart'
                              - $ref: '#/components/schemas/ToolCallPart'
                              - $ref: '#/components/schemas/ToolResultPart'
                              discriminator:
                                propertyName: kind
                                mapping:
                                  text: '#/components/schemas/TextPart'
                                  error: '#/components/schemas/ErrorPart'
                                  data: '#/components/schemas/DataPart'
                                  file: '#/components/schemas/FilePart'
                                  tool_call: '#/components/schemas/ToolCallPart'
                                  tool_result: '#/components/schemas/ToolResultPart'
                        required:
                        - kind
                        - messageId
                        - role
                        - parts
                        title: Task Status Message
                        description: Optional A2A message providing additional context about the current status
                    required:
                    - state
                    title: Task Status
                    description: Current task status information
                  messages:
                    type: array
                    description: Array of messages in the task conversation. Only present when blocking mode is enabled.
                    items:
                      $ref: '#/components/schemas/ExtendedMessage'
                  metadata:
                    type: object
                    additionalProperties: {}
                    description: Task metadata containing workspace_id and trace_id for feedback and tracking
                required:
                - id
                - contextId
                - kind
                - status
                title: A2A Task Response
                description: Response format following the Agent-to-Agent (A2A) protocol. Returned when starting or continuing an agent task execution.
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/agents/run:
    post:
      tags:
      - Agents
      x-cli-group: agents
      x-cli-name: run
      deprecated: true
      x-speakeasy-group: agents
      x-speakeasy-name-override: run
      x-speakeasy-max-method-params: 21
      operationId: RunAgent
      summary: Run an agent with configuration
      description: Run an agent with inline configuration or existing agent reference. Supports A2A messages, memory context, tool execution, and model fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  minLength: 1
                  pattern: ^[A-Za-z][A-Za-z0-9]*([._-][A-Za-z0-9]+)*$
                  description: A unique identifier for the agent. This key must be unique within the same workspace and cannot be reused. When executing the agent, this key determines if the agent already exists. If the agent version differs, a new version is created at the end of the execution, except for the task. All agent parameters are evaluated to decide if a new version is needed.
                task_id:
                  type: string
                  description: Optional task ID to continue an existing agent execution. When provided, the agent will continue the conversation from the existing task state. The task must be in an inactive state to continue.
                model:
                  anyOf:
                  - type: string
                    description: '


                      A model ID string (e.g., `openai/gpt-5.6-sol` or `anthropic/claude-sonnet-5`). The agent can be run with a wide range of models with different capabilities, performance characteristics, and price points. Only models that support tool calling (function_calling) can be used to run agents. See [supported models](/ai-gateway/supported-models) documentation for the complete list of available models.'
                  - type: object
                    properties:
                      id:
                        type: string
                        description: A model ID string (e.g., `openai/gpt-5.6-sol` or `anthropic/claude-sonnet-5`). Only models that support tool calling can be used with agents.
                      parameters:
                        type: object
                        properties:
                          name:
                            type: string
                            description: The name to display on the trace. If not specified, the default system name will be used.
                          frequency_penalty:
                            type:
                            - number
                            - 'null'
                            description: Number between -2.0 and 2.0. Positive values penalize new tokens based on their existing frequency in the text so far, decreasing the model's likelihood to repeat the same line verbatim.
                          max_tokens:
                            type:
                            - integer
                            - 'null'
                            description: "`[Deprecated]`. The maximum number of tokens that can be generated in the chat completion. This value can be used to control costs for text generated via API. \n\n This value is now `deprecated` in favor of `max_completion_tokens`, and is not compatible with o1 series models."
                          max_completion_tokens:
                            type:
                            - integer
                            - 'null'
                            exclusiveMinimum: 0
                            description: An upper bound for the number of tokens that can be generated for a completion, including visible output tokens and reasoning tokens
                          presence_penalty:
                            type:
                            - number
                            - 'null'
                            description: Number between -2.0 and 2.0. Positive values penalize new tokens based on whether they appear in the text so far, increasing the model's likelihood to talk about new topics.
                          response_format:
                            oneOf:
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - text
                              required:
                              - type
                              title: Text
                              description: '


                                Default response format. Used to generate text responses'
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - json_object
                              required:
                              - type
                              title: JSON object
                              description: '


                                JSON object response format. An older method of generating JSON responses. Using `json_schema` is recommended for models that support it. Note that the model will not generate JSON without a system or user message instructing it to do so.'
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - json_schema
                                json_schema:
                                  type: object
                                  properties:
                                    description:
                                      type: string
                                      description: A description of what the response format is for, used by the model to determine how to respond in the format.
                                    name:
                                      type: string
                                      description: The name of the response format. Must be a-z, A-Z, 0-9, or contain underscores and dashes, with a maximum length of 64.
                                    schema:
                                      description: The schema for the response format, described as a JSON Schema object.
                                    strict:
                                      type: boolean
                                      default: false
                                      description: Whether to enable strict schema adherence when generating the output. If set to true, the model will always follow the exact schema defined in the schema field. Only a subset of JSON Schema is supported when strict is true.
                                  required:
                                  - name
                              required:
                              - type
                              - json_schema
                              title: JSON schema
                              description: '


                                JSON Schema response format. Used to generate structured JSON responses'
                            description: An object specifying the format that the model must output
                          reasoning_effort:
                            type: string
                            enum:
                            - none
                            - minimal
                            - low
                            - medium
                            - high
                            - xhigh
                            - max
                            description: 'Constrains effort on reasoning for [reasoning models](https://platform.openai.com/docs/guides/reasoning). Currently supported values are `none`, `minimal`, `low`, `medium`, `high`, `xhigh`, and `max`. Reducing reasoning effort can result in faster responses and fewer tokens used on reasoning in a response.


                              - `gpt-5.1` defaults to `none`, which does not perform reasoning. The supported reasoning values for `gpt-5.1` are `none`, `low`, `medium`, and `high`. Tool calls are supported for all reasoning values in gpt-5.1.

                              - All models before `gpt-5.1` default to `medium` reasoning effort, and do not support `none`.

                              - The `gpt-5-pro` model defaults to (and only supports) `high` reasoning effort.

                              - `xhigh` is currently only supported for `gpt-5.1-codex-max`.


                              Any of "none", "minimal", "low", "medium", "high", "xhigh", "max".'
                          verbosity:
                            type: string
                            description: Adjusts response verbosity. Lower levels yield shorter answers.
                          seed:
                            type:
                            - number
                            - 'null'
                            description: If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same seed and parameters should return the same result.
                          stop:
                            anyOf:
                            - type: string
                            - type: array
                              items:
                                type: string
                              maxItems: 4
                            - type: 'null'
                            description: Up to 4 sequences where the API will stop generating further tokens.
                          thinking:
                            oneOf:
                            - $ref: '#/components/schemas/ThinkingConfigDisabledSchema'
                            - $ref: '#/components/schemas/ThinkingConfigEnabledSchema'
                            - $ref: '#/components/schemas/ThinkingConfigAdaptiveSchema'
                            discriminator:
                              propertyName: type
