                                    format: ulid
                                    pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                                    readOnly: true
                                    description: The id of the resource
                                  key:
                                    type: string
                                    description: Optional tool key for custom tools
                                  action_type:
                                    type: string
                                  display_name:
                                    type: string
                                  description:
                                    type: string
                                    description: Optional tool description
                                  configuration:
                                    type: object
                                    additionalProperties: {}
                                    description: Static tool configuration set at design time. Merged over LLM-provided arguments at execution time.
                                  requires_approval:
                                    type: boolean
                                    default: false
                                  tool_id:
                                    type: string
                                    description: Nested tool ID for MCP tools (identifies specific tool within MCP server)
                                  conditions:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        condition:
                                          type: string
                                          description: The argument of the tool call to evaluate
                                        operator:
                                          type: string
                                          description: The operator to use
                                        value:
                                          type: string
                                          description: The value to compare against
                                      required:
