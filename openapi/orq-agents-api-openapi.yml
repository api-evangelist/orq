                                          items:
                                            type: number
                                            minimum: 100
                                            maximum: 599
                                          minItems: 1
                                          description: HTTP status codes that trigger retry logic
                                          example:
                                          - 429
                                          - 500
                                          - 502
                                          - 503
                                          - 504
                                      description: Retry configuration for this fallback model. Allows customizing retry count (1-5) and HTTP status codes that trigger retries.
                                  required:
                                  - id
