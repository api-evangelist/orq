              type: string
            inputMessage:
              type: object
              properties:
                messageId:
                  type: string
                role:
                  type: string
                  enum:
                  - user
                  - agent
                  - tool
                  - system
                  description: Extended A2A message role
                parts:
                  type: array
                  items:
                    oneOf:
                    - $ref: '#/components/schemas/TextPart'
