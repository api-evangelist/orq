                  description: A chat completion message generated by the model.
                logprobs:
                  type:
                  - object
                  - 'null'
                  properties:
                    content:
                      type:
                      - array
                      - 'null'
                      items:
                        type: object
                        properties:
                          token:
                            type: string
                            description: The token.
                          logprob:
                            type: number
                            description: The log probability of this token, if it is within the top 20 most likely tokens. Otherwise, the value -9999.0 is used to signify that the token is very unlikely.
                          bytes:
                            type:
                            - array
                            - 'null'
                            items:
                              type: number
                            description: A list of integers representing the UTF-8 bytes representation of the token.
                          top_logprobs:
                            type: array
                            items:
                              type: object
                              properties:
                                token:
                                  type: string
                                  description: The token.
                                logprob:
                                  type: number
                                  description: The log probability of this token, if it is within the top 20 most likely tokens. Otherwise, the value -9999.0 is used to signify that the token is very unlikely.
                                bytes:
                                  type:
                                  - array
                                  - 'null'
                                  items:
                                    type: number
                                  description: A list of integers representing the UTF-8 bytes representation of the token.
                              required:
                              - token
                              - logprob
                              - bytes
                            description: List of the most likely tokens and their log probability, at this token position.
                        required:
                        - token
                        - logprob
                        - bytes
                        - top_logprobs
                      description: A list of message content tokens with log probability information.
                    refusal:
                      type:
                      - array
                      - 'null'
                      items:
                        type: object
                        properties:
                          token:
                            type: string
                            description: The token.
                          logprob:
                            type: number
                            description: The log probability of this token, if it is within the top 20 most likely tokens. Otherwise, the value -9999.0 is used to signify that the token is very unlikely.
                          bytes:
                            type:
                            - array
                            - 'null'
                            items:
                              type: number
                            description: A list of integers representing the UTF-8 bytes representation of the token.
                          top_logprobs:
                            type: array
                            items:
                              type: object
                              properties:
                                token:
                                  type: string
                                  description: The token.
                                logprob:
                                  type: number
                                  description: The log probability of this token, if it is within the top 20 most likely tokens. Otherwise, the value -9999.0 is used to signify that the token is very unlikely.
                                bytes:
                                  type:
                                  - array
                                  - 'null'
                                  items:
                                    type: number
                                  description: A list of integers representing the UTF-8 bytes representation of the token.
                              required:
                              - token
                              - logprob
                              - bytes
                            description: List of the most likely tokens and their log probability, at this token position.
                        required:
                        - token
                        - logprob
                        - bytes
                        - top_logprobs
                      description: A list of message refusal tokens with log probability information.
                  required:
                  - content
                  - refusal
                  description: Log probability information for the choice.
