      operationId: ListAgents
      summary: List agents
      description: List all agents in the workspace with full configuration details. Supports pagination and sorts agents newest first.
      parameters:
      - schema:
          type: number
          minimum: 1
          maximum: 200
          description: A limit on the number of objects to be returned. Limit can range between 1 and 200. When not provided, returns all agents without pagination.
        required: false
        description: A limit on the number of objects to be returned. Limit can range between 1 and 200. When not provided, returns all agents without pagination.
        name: limit
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        required: false
        description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
