                          - draft
                          - pending
                          - published
                          description: The status of the agent. `Live` is the latest version of the agent. `Draft` is a version that is not yet published. `Pending` is a version that is pending approval. `Published` is a version that was live and has been replaced by a new version.
                        version:
                          type: string
                          description: Current semantic version of the agent manifest.
                        path:
                          type: string
                          description: 'Entity storage path.


                            With workspace-level API keys, use the format `project/folder/subfolder/...`. The first element must be the display name of an existing project, followed by nested folders (auto-created as needed). Example: `Default Project/agents`.


                            With project-level API keys, the project is predetermined by the API key, so the path is relative to that project. Example: `agents`. For backward compatibility, a leading project name is ignored when it matches the scoped project.'
                          example: Default Project
                        memory_stores:
                          type: array
                          items:
                            type: string
                          default: []
                          description: Array of memory store identifiers. Accepts both memory store IDs and keys.
                        team_of_agents:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                description: The unique key of the agent within the workspace
                              role:
                                type: string
                                description: The role of the agent in this context. This is used to give extra information to the leader to help it decide which agent to hand off to.
                            required:
                            - key
                          default: []
                          description: The agents that are accessible to this orchestrator. The main agent can hand off to these agents to perform tasks.
                        skills:
                          type: array
                          items:
                            type: string
                          default: []
                          description: List of skills that the agent can utilize. This field allows you to specify which skills the agent has access to, enabling more complex and dynamic behavior.
                        metrics:
                          type: object
                          properties:
