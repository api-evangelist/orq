                  type:
                  - number
                  - 'null'
                audio_tokens:
                  type:
                  - integer
                  - 'null'
                  description: The number of audio output tokens produced by the response.
          description: Token usage from the agent execution
        finish_reason:
          type: string
          enum:
          - stop
          - length
          - tool_calls
          - content_filter
          - function_call
          - max_iterations
          - max_time
          description: The reason why the agent stopped generating
        pending_tool_calls:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                - function
              function:
                type: object
                properties:
                  name:
                    type: string
                  arguments:
                    type: string
            required:
            - id
            - type
            - function
          description: Tool calls awaiting user response (when finish_reason is function_call)
        telemetry:
          $ref: '#/components/schemas/Telemetry'
      required:
      - _id
      - task_id
      - output
      - created_at
      - model
      title: Create Agent Response
      description: Response type from the create-response endpoint.
    JsonSchemaToolInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - json_schema
          default: json_schema
          description: JSON Schema tool type
        key:
          type: string
          description: The key of the pre-created JSON Schema tool
        id:
          type: string
          description: The ID of the pre-created JSON Schema tool
        requires_approval:
          type: boolean
          default: false
          description: Whether this tool requires approval before execution
      title: JSON Schema Tool
      description: Enforces structured output format using JSON Schema. Must reference a pre-created JSON Schema tool by key or id.
    HonoApiError:
      type: object
      properties:
        code:
          type: string
          description: HTTP status code
        message:
          type: string
          description: Error message
      required:
      - message
    FileSystemToolInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - file_system
        requires_approval:
          type: boolean
          description: Whether this tool requires approval before execution
        configuration:
          type: object
          properties:
            file_system_id:
              type: string
              minLength: 1
              description: The id of the file system to attach.
            file_system_key:
              type: string
              minLength: 1
              description: The key of the file system to attach.
            access_mode:
              type: string
              enum:
              - read_only
              - read_write
              default: read_only
              description: Whether the agent may only read this file system, or also write to it.
      required:
      - type
      - configuration
      title: File system tool
      description: Attaches a persistent file system to the agent, named by file_system_id or file_system_key in the configuration. The agent may only read it unless the configured access_mode is read_write.
    ExtendedMessage:
      type: object
      properties:
        kind:
          type: string
          enum:
          - message
        messageId:
          type: string
          description: Unique identifier for the message
        role:
          type: string
          enum:
          - user
          - agent
          - tool
          - system
          title: Extended Message Role
          description: 'Role of the message sender in the A2A protocol. Values: user (end user), agent (AI agent), tool (tool execution result), system (system instructions/prompts).'
        parts:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/TextPart'
            - $ref: '#/components/schemas/ErrorPart'
            - $ref: '#/components/schemas/DataPart'
            - $ref: '#/components/schemas/FilePart'
            - $ref: '#/components/schemas/ToolCallPart'
            - $ref: '#/components/schemas/ToolResultPart'
            discriminator:
              propertyName: kind
              mapping:
                text: '#/components/schemas/TextPart'
                error: '#/components/schemas/ErrorPart'
                data: '#/components/schemas/DataPart'
                file: '#/components/schemas/FilePart'
                tool_call: '#/components/schemas/ToolCallPart'
                tool_result: '#/components/schemas/ToolResultPart'
          description: Array of message parts (text, file, tool_call, tool_result)
        taskId:
          type: string
          description: Associated task ID if applicable
        contextId:
          type: string
          description: Correlation ID for execution tracking
        metadata:
          type: object
          additionalProperties: {}
          description: Additional message metadata
      required:
      - kind
      - messageId
      - role
      - parts
      title: Extended A2A Message
      description: Extended Agent-to-Agent protocol message with support for tool calls and tool results. Extends the base A2A message format with orq.ai-specific features.
    DataPart:
      type: object
      properties:
        kind:
          type: string
          enum:
          - data
        data:
          type: object
          additionalProperties: {}
        metadata:
          type: object
          additionalProperties: {}
      required:
      - kind
      - data
      title: Data Part
      description: A structured data part containing JSON-serializable key-value pairs. Used for passing structured information between agents and tools.
    McpToolInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - mcp
          default: mcp
          description: MCP tool type
        key:
          type: string
          description: The key of the parent MCP tool
        id:
          type: string
          description: The ID of the parent MCP tool
        tool_id:
          type: string
          description: The ID of the specific nested tool within the MCP server
        requires_approval:
          type: boolean
          default: false
          description: Whether this tool requires approval before execution
      required:
      - tool_id
      title: MCP Tool
      description: Executes tools from Model Context Protocol (MCP) servers. Specify the parent MCP tool using "key" or "id", and the specific nested tool using "tool_id".
      example:
        type: mcp
        id: 01KA84ND5J0SWQMA2Q8HY5WZZZ
        tool_id: 01KXYZ123456789
        requires_approval: false
    AgentInactiveStreamingEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - event.agents.inactive
        timestamp:
          type: string
          description: ISO timestamp of the event
        data:
          type: object
          properties:
            last_message:
              type: string
            last_message_full:
              type: object
              properties:
                messageId:
                  type: string
                role:
                  type: string
                  enum:
                  - user
                  - agent
                  - tool
                  - system
                  description: Extended A2A message role
                parts:
                  type: array
                  items:
                    oneOf:
                    - $ref: '#/components/schemas/TextPart'
                    - $ref: '#/components/schemas/ErrorPart'
                    - $ref: '#/components/schemas/DataPart'
                    - $ref: '#/components/schemas/FilePart'
                    - $ref: '#/components/schemas/ToolCallPart'
                    - $ref: '#/components/schemas/ToolResultPart'
                    discriminator:
                      propertyName: kind
                      mapping:
                        text: '#/components/schemas/TextPart'
                        error: '#/components/schemas/ErrorPart'
                        data: '#/components/schemas/DataPart'
                        file: '#/components/schemas/FilePart'
                        tool_call: '#/components/schemas/ToolCallPart'
                        tool_result: '#/components/schemas/ToolResultPart'
                metadata:
                  type: object
                  additionalProperties: {}
              required:
              - role
              - parts
              description: Full last message in A2A format (for backwards compatibility)
            finish_reason:
              type: string
              enum:
              - stop
              - length
              - tool_calls
              - content_filter
              - function_call
              - max_iterations
              - max_time
              description: The reason why the agent execution became inactive
            pending_tool_calls:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                    enum:
                    - function
                  function:
                    type: object
                    properties:
                      name:
                        type: string
                      arguments:
                        type: string
                required:
                - id
                - type
                - function
              description: Tool calls that are pending user response (for function_call finish reason)
            usage:
              type: object
              properties:
                completion_tokens:
                  type: number
                  description: Number of tokens in the generated completion.
                prompt_tokens:
                  type: number
                  description: Number of tokens in the prompt.
                total_tokens:
                  type: number
                  description: Total number of tokens used in the request (prompt + completion).
                prompt_tokens_details:
                  type:
                  - object
                  - 'null'
                  properties:
                    cached_tokens:
                      type:
                      - integer
                      - 'null'
                    cache_creation_tokens:
                      type:
                      - integer
                      - 'null'
                    audio_tokens:
                      type:
                      - integer
                      - 'null'
                      description: The number of audio input tokens consumed by the request.
                completion_tokens_details:
                  type:
                  - object
                  - 'null'
                  properties:
                    reasoning_tokens:
                      type:
                      - number
                      - 'null'
                    accepted_prediction_tokens:
                      type:
                      - number
                      - 'null'
                    rejected_prediction_tokens:
                      type:
                      - number
                      - 'null'
                    audio_tokens:
                      type:
                      - integer
                      - 'null'
                      description: The number of audio output tokens produced by the response.
                time_to_first_token:
                  type: number
              description: Token usage from the last agent message
            billing:
              type: object
              properties:
                total_cost:
                  type: number
                  minimum: 0
                input_cost:
                  type: number
                  minimum: 0
                output_cost:
                  type: number
                  minimum: 0
                billable:
                  type: boolean
                integration_id:
                  type:
                  - string
                  - 'null'
              required:
              - total_cost
              - input_cost
              - output_cost
              - billable
              - integration_id
              description: Billing information for the agent execution
            workflowRunId:
              type: string
            responseId:
              type: string
              description: ID of the response tracking this execution
          required:
          - last_message
          - finish_reason
          - workflowRunId
      required:
      - type
      - timestamp
      - data
      title: Agent Inactive Event
      description: Emitted when the agent completes processing or pauses for input. Contains the final message, finish reason (stop, tool_calls, max_iterations, etc.), and any pending tool calls awaiting user response.
    PartDeltaEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - part.delta
        timestamp:
          type: string
          description: ISO timestamp of when the event occurred
        data:
          type: object
          properties:
            partId:
              type: string
              description: 'Unique identifier for this part. Format: {kind}_{ulid}. Use to correlate with part.done event.'
              example: text_01hxyz123abc
            delta:
              $ref: '#/components/schemas/PartDelta'
          required:
          - partId
          - delta
      required:
      - type
      - timestamp
      - data
      title: Part Delta Event
      description: Emitted for each content chunk streamed from the LLM. The delta field contains a discriminated union based on the kind field.
    GetAgentResponse:
      allOf:
      - $ref: '#/components/schemas/CreateAgentResponse'
      - type: object
        properties:
          status:
            type: string
            enum:
            - in_progress
            - completed
            - failed
            description: Current status of the agent response
          error:
            type: string
            description: Error message when status is failed
        required:
        - status
      title: Get Agent Response
      description: Response type from the get-response endpoint. Includes a status field indicating the current state of the agent execution.
    RefreshExternalAgentCardRequest:
      required: []
      type: object
      properties: {}
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  url: https://docs.orq.ai
  description: orq.ai Documentation
