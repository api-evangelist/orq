                                            type: integer
                                            minimum: 400
                                            maximum: 599
                                          maxItems: 20
                                          description: HTTP status codes that trigger fallback. Enter up to 20 unique integers from 400 to 599. When omitted or empty, defaults to [408, 429, 500, 502, 503, 504, 529].
                                      description: Optional model parameters specific to this fallback model. Overrides primary model parameters if this fallback is used.
                                    retry:
