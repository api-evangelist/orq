openapi: 3.2.0
info:
  title: orq.ai Datasets API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- name: Datasets
paths:
  /v2/datasets:
    get:
      tags:
      - Datasets
      x-speakeasy-group: datasets
      x-speakeasy-name-override: list
      x-cli-group: datasets
      x-cli-name: list
      operationId: ListDatasets
      summary: List datasets
      description: Retrieves a paginated list of datasets for the current workspace. Results can be paginated using cursor-based pagination.
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
          description: A limit on the number of objects to be returned. Limit can range between 1 and 200, and the default is 10
        required: false
        description: A limit on the number of objects to be returned. Limit can range between 1 and 200, and the default is 10
        name: limit
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        required: false
        description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        name: starting_after
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        required: false
        description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        name: ending_before
        in: query
      - schema:
          type: string
          description: Filter datasets by display name (case-insensitive match).
        required: false
        description: Filter datasets by display name (case-insensitive match).
        name: search
        in: query
      - schema:
          type: string
          description: Comma-separated list of user IDs; returns datasets last updated by any of them.
        required: false
        description: Comma-separated list of user IDs; returns datasets last updated by any of them.
        name: updated_by
        in: query
      responses:
        '200':
          description: Datasets Retrieved Successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          anyOf:
                          - type: string
                          - type: string
                            format: ulid
                            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                            readOnly: true
                            description: The id of the resource
                          description: The unique identifier of the dataset
                        display_name:
                          type: string
                          minLength: 1
                          maxLength: 128
                          description: The display name of the dataset
                        project_id:
                          anyOf:
                          - type: string
                          - type: string
                            format: ulid
                            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                            readOnly: true
                            description: The id of the resource
                          description: The unique identifier of the project it belongs to
                        workspace_id:
                          anyOf:
                          - type: string
                          - type: string
                            format: ulid
                            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                            readOnly: true
                            description: The id of the resource
                          description: The unique identifier of the workspace it belongs to
                        metadata:
                          type: object
                          properties:
                            total_versions:
                              type: number
                            datapoints_count:
                              type: number
                          required:
                          - total_versions
                          - datapoints_count
                        created_by_id:
                          anyOf:
                          - type: string
                          - type: string
                            format: ulid
                            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                            readOnly: true
                            description: The id of the resource
                          - type: 'null'
                          description: The unique identifier of the user who created the dataset
                        updated_by_id:
                          anyOf:
                          - type: string
                          - type: string
                            format: ulid
                            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                            readOnly: true
                            description: The id of the resource
                          - type: 'null'
                          description: The unique identifier of the user who last updated the dataset
                        created:
                          anyOf:
                          - type: string
                            format: date-time
                          - type: string
                            format: date-time
                          default: '2026-09-15T17:33:09.320Z'
                          readOnly: true
                          format: date-time
                          description: The date and time the resource was created
                        updated:
                          anyOf:
                          - type: string
                            format: date-time
                            default: '2026-09-15T17:33:09.324Z'
                          - type: string
                            format: date-time
                          readOnly: true
                          format: date-time
                          description: The date and time the resource was last updated
                      required:
                      - _id
                      - display_name
                      - project_id
                      - workspace_id
                      - metadata
                  has_more:
                    type: boolean
                required:
                - object
                - data
                - has_more
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Datasets
      x-speakeasy-group: datasets
      x-speakeasy-name-override: create
      x-cli-group: datasets
      x-cli-name: create
      operationId: CreateDataset
      summary: Create a dataset
      description: Creates a new dataset in the specified project.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: The display name of the dataset
                path:
                  type: string
                  description: 'Entity storage path.


                    With workspace-level API keys, use the format `project/folder/subfolder/...`. The first element must be the display name of an existing project, followed by nested folders (auto-created as needed). Example: `Default Project/agents`.


                    With project-level API keys, the project is predetermined by the API key, so the path is relative to that project. Example: `agents`. For backward compatibility, a leading project name is ignored when it matches the scoped project.'
                  example: Default Project
              required:
              - display_name
              - path
      responses:
        '200':
          description: Dataset created successfully. Returns the newly created dataset object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    description: The unique identifier of the dataset
                  display_name:
                    type: string
                    minLength: 1
                    maxLength: 128
                    description: The display name of the dataset
                  project_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    description: The unique identifier of the project it belongs to
                  workspace_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    description: The unique identifier of the workspace it belongs to
                  metadata:
                    type: object
                    properties:
                      total_versions:
                        type: number
                      datapoints_count:
                        type: number
                    required:
                    - total_versions
                    - datapoints_count
                  created_by_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    - type: 'null'
                    description: The unique identifier of the user who created the dataset
                  updated_by_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    - type: 'null'
                    description: The unique identifier of the user who last updated the dataset
                  created:
                    anyOf:
                    - type: string
                      format: date-time
                    - type: string
                      format: date-time
                    default: '2026-09-15T17:33:09.320Z'
                    readOnly: true
                    format: date-time
                    description: The date and time the resource was created
                  updated:
                    anyOf:
                    - type: string
                      format: date-time
                      default: '2026-09-15T17:33:09.324Z'
                    - type: string
                      format: date-time
                    readOnly: true
                    format: date-time
                    description: The date and time the resource was last updated
                required:
                - _id
                - display_name
                - project_id
                - workspace_id
                - metadata
        '401':
          description: Authentication required. See https://docs.orq.ai/reference/errors for the error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/datasets/{dataset_id}:
    get:
      tags:
      - Datasets
      x-speakeasy-group: datasets
      x-speakeasy-name-override: retrieve
      x-cli-group: datasets
      x-cli-name: retrieve
      operationId: RetrieveDataset
      summary: Retrieve a dataset
      description: Retrieves a specific dataset by its unique identifier
      parameters:
      - schema:
          anyOf:
          - type: string
          - type: string
            format: ulid
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
            readOnly: true
            description: The id of the resource
          description: The unique identifier of the dataset
        required: true
        description: The unique identifier of the dataset
        name: dataset_id
        in: path
      responses:
        '200':
          description: Dataset retrieved successfully. Returns the complete dataset object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    description: The unique identifier of the dataset
                  display_name:
                    type: string
                    minLength: 1
                    maxLength: 128
                    description: The display name of the dataset
                  project_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    description: The unique identifier of the project it belongs to
                  workspace_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    description: The unique identifier of the workspace it belongs to
                  metadata:
                    type: object
                    properties:
                      total_versions:
                        type: number
                      datapoints_count:
                        type: number
                    required:
                    - total_versions
                    - datapoints_count
                  created_by_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    - type: 'null'
                    description: The unique identifier of the user who created the dataset
                  updated_by_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    - type: 'null'
                    description: The unique identifier of the user who last updated the dataset
                  created:
                    anyOf:
                    - type: string
                      format: date-time
                    - type: string
                      format: date-time
                    default: '2026-09-15T17:33:09.320Z'
                    readOnly: true
                    format: date-time
                    description: The date and time the resource was created
                  updated:
                    anyOf:
                    - type: string
                      format: date-time
                      default: '2026-09-15T17:33:09.324Z'
                    - type: string
                      format: date-time
                    readOnly: true
                    format: date-time
                    description: The date and time the resource was last updated
                required:
                - _id
                - display_name
                - project_id
                - workspace_id
                - metadata
        '404':
          description: Dataset not found with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HonoApiError'
    patch:
      tags:
      - Datasets
      x-speakeasy-group: datasets
      x-speakeasy-name-override: update
      x-cli-group: datasets
      x-cli-name: update
      operationId: UpdateDataset
      summary: Update a dataset
      parameters:
      - schema:
          anyOf:
          - type: string
          - type: string
            format: ulid
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
            readOnly: true
            description: The id of the resource
          description: The unique identifier of the dataset
        required: true
        description: The unique identifier of the dataset
        name: dataset_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: The display name of the dataset
                project_id:
                  anyOf:
                  - type: string
                  - type: string
                    format: ulid
                    pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                    readOnly: true
                    description: The id of the resource
                  description: The unique identifier of the project it belongs to
                path:
                  type: string
                  description: 'Entity storage path.


                    With workspace-level API keys, use the format `project/folder/subfolder/...`. The first element must be the display name of an existing project, followed by nested folders (auto-created as needed). Example: `Default Project/agents`.


                    With project-level API keys, the project is predetermined by the API key, so the path is relative to that project. Example: `agents`. For backward compatibility, a leading project name is ignored when it matches the scoped project.'
                  example: Default Project
      responses:
        '200':
          description: Dataset updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    description: The unique identifier of the dataset
                  display_name:
                    type: string
                    minLength: 1
                    maxLength: 128
                    description: The display name of the dataset
                  project_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    description: The unique identifier of the project it belongs to
                  workspace_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    description: The unique identifier of the workspace it belongs to
                  metadata:
                    type: object
                    properties:
                      total_versions:
                        type: number
                      datapoints_count:
                        type: number
                    required:
                    - total_versions
                    - datapoints_count
                  created_by_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    - type: 'null'
                    description: The unique identifier of the user who created the dataset
                  updated_by_id:
                    anyOf:
                    - type: string
                    - type: string
                      format: ulid
                      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                      readOnly: true
                      description: The id of the resource
                    - type: 'null'
                    description: The unique identifier of the user who last updated the dataset
                  created:
                    anyOf:
                    - type: string
                      format: date-time
                    - type: string
                      format: date-time
                    default: '2026-09-15T17:33:09.320Z'
                    readOnly: true
                    format: date-time
                    description: The date and time the resource was created
                  updated:
                    anyOf:
                    - type: string
                      format: date-time
                      default: '2026-09-15T17:33:09.324Z'
                    - type: string
                      format: date-time
                    readOnly: true
                    format: date-time
                    description: The date and time the resource was last updated
                required:
                - _id
                - display_name
                - project_id
                - workspace_id
                - metadata
        '404':
          description: Dataset not found with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HonoApiError'
    delete:
      tags:
      - Datasets
      x-speakeasy-group: datasets
      x-speakeasy-name-override: delete
      x-cli-group: datasets
      x-cli-name: delete
      operationId: DeleteDataset
      summary: Delete a dataset
      description: Permanently deletes a dataset and all its datapoints. This action is irreversible.
      parameters:
      - schema:
          anyOf:
          - type: string
          - type: string
            format: ulid
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
            readOnly: true
            description: The id of the resource
          description: The unique identifier of the dataset
        required: true
        description: The unique identifier of the dataset
        name: dataset_id
        in: path
      responses:
        '204':
          description: No content - Dataset successfully deleted
        '404':
          description: Dataset not found - The specified dataset does not exist or has already been deleted
  /v2/datasets/{dataset_id}/datapoints:
    get:
      tags:
      - Datasets
      x-speakeasy-group: datasets
      x-speakeasy-name-override: listDatapoints
      x-cli-group: datasets
      x-cli-name: listDatapoints
      operationId: ListDatasetDatapoints
      summary: List datapoints
      description: Retrieves a paginated list of datapoints from a specific dataset.
      parameters:
      - schema:
          anyOf:
          - type: string
          - type: string
            format: ulid
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
            readOnly: true
            description: The id of the resource
          description: The unique identifier of the dataset
        required: true
        description: The unique identifier of the dataset
        name: dataset_id
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
          description: A limit on the number of objects to be returned. Limit can range between 1 and 200, and the default is 10
        required: false
        description: A limit on the number of objects to be returned. Limit can range between 1 and 200, and the default is 10
        name: limit
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        required: false
        description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `starting_after=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the next page of the list.
        name: starting_after
        in: query
      - schema:
          type: string
          description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        required: false
        description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `01JJ1HDHN79XAS7A01WB3HYSDB`, your subsequent call can include `ending_before=01JJ1HDHN79XAS7A01WB3HYSDB` in order to fetch the previous page of the list.
        name: ending_before
        in: query
      responses:
        '200':
          description: Datapoints retrieved successfully. Returns a paginated list of datapoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: The unique identifier of the dataset item
                        workspace_id:
                          type: string
                          description: The unique identifier of the workspace it belongs to
                        inputs:
                          type: object
                          additionalProperties: {}
                          description: The inputs of the dataset. Key value pairs where the key is the input name and the value is the input value. Nested objects are not supported.
                        messages:
                          type: array
                          items:
                            oneOf:
                            - type: object
                              properties:
                                role:
                                  type: string
                                  enum:
                                  - system
                                  description: The role of the messages author, in this case `system`.
                                content:
                                  anyOf:
                                  - type: string
                                    description: The contents of the system message.
                                  - type: array
                                    items:
                                      $ref: '#/components/schemas/TextContentPartSchema'
                                    minItems: 1
                                    description: An array of content parts with a defined type. For system messages, only type `text` is supported.
                                  description: The contents of the system message.
                                name:
                                  type: string
                                  description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
                              required:
                              - role
                              - content
                              title: System message
                              description: Developer-provided instructions that the model should follow, regardless of messages sent by the user.
                            - type: object
                              properties:
                                role:
                                  type: string
                                  enum:
                                  - developer
                                  description: The role of the messages author, in this case  `developer`.
                                content:
                                  anyOf:
                                  - type: string
                                    description: The contents of the developer message.
                                  - type: array
                                    items:
                                      $ref: '#/components/schemas/TextContentPartSchema'
                                    minItems: 1
                                    description: An array of content parts with a defined type. For developer messages, only type `text` is supported.
                                  description: The contents of the developer message.
                                name:
                                  type: string
                                  description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
                              required:
                              - role
                              - content
                              title: Developer message
                            - type: object
                              properties:
                                role:
                                  type: string
                                  enum:
                                  - user
                                  description: The role of the messages author, in this case `user`.
                                name:
                                  type: string
                                  description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
                                content:
                                  anyOf:
                                  - type: string
                                    description: The text contents of the message.
                                  - type: array
                                    items:
                                      oneOf:
                                      - $ref: '#/components/schemas/TextContentPartSchema'
                                      - $ref: '#/components/schemas/ImageContentPartSchema'
                                      - $ref: '#/components/schemas/AudioContentPartSchema'
                                      - type: object
                                        properties:
                                          type:
                                            type: string
                                            enum:
                                            - file
                                            description: The type of the content part. Always `file`.
                                          cache_control:
                                            type: object
                                            properties:
                                              type:
                                                type: string
                                                enum:
                                                - ephemeral
                                                description: Create a cache control breakpoint at this content block. Accepts only the value "ephemeral".
                                              ttl:
                                                type: string
                                                enum:
                                                - 5m
                                                - 1h
                                                default: 5m
                                                description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                                                  - `5m`: 5 minutes

                                                  - `1h`: 1 hour


                                                  Defaults to `5m`. Only supported by `Anthropic` Claude models.'
                                            required:
                                            - type
                                          file:
                                            $ref: '#/components/schemas/FileContentPartSchema'
                                        required:
                                        - type
                                        - file
                                    description: An array of content parts with a defined type. Supported options differ based on the model being used to generate the response. Can contain text, image, or audio inputs.
                                  description: The contents of the user message.
                              required:
                              - role
                              - content
                              title: User message
