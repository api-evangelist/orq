                                - `5m`: 5 minutes

                                - `1h`: 1 hour


                                Defaults to `5m`. Only supported by `Anthropic` Claude models.'
                          required:
                          - type
                      required:
                      - role
                      - content
                      - tool_call_id
                      title: Tool message
                  description: A list of messages comprising the conversation so far
                expected_output:
                  type: string
