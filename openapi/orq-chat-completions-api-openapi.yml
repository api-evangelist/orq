components:
  schemas:
    APIError:
      additionalProperties: false
      properties:
        code:
          type:
          - string
          - 'null'
        failures: {}
        message:
          type: string
        param:
          type:
          - string
          - 'null'
        type:
          type: string
      required:
      - message
      - type
      - param
      - code
      type: object
    RedactedReasoningPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - redacted_reasoning
          description: The type of the content part. Always `reasoning`.
        data:
          type: string
          description: The encrypted reasoning or thought process behind the response. Used for chain-of-thought or extended thinking.
      required:
      - type
      - data
      title: Reasoning Part
      description: A message part containing reasoning or chain-of-thought content
    APIErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/APIError'
      required:
      - error
    PublicContact:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the contact
          example: contact_01ARZ3NDEKTSV4RRFFQ69G5FAV
        display_name:
          type: string
          description: Display name of the contact
          example: Jane Doe
        email:
          type: string
          format: email
          description: Email address of the contact
          example: jane.doe@example.com
        metadata:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: A hash of key/value pairs containing any other data about the contact
          example:
          - department: Engineering
            role: Senior Developer
        logo_url:
          type: string
          description: URL to the contact's avatar or logo
          example: https://example.com/avatars/jane-doe.jpg
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the contact
          example:
          - hr
          - engineering
      required:
      - id
      description: '@deprecated Use identity instead. Information about the contact making the request.'
      deprecated: true
    AudioContentPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - input_audio
        input_audio:
          type: object
          properties:
            data:
              type: string
              description: Base64 encoded audio data.
            format:
              type: string
              enum:
              - mp3
              - wav
              description: The format of the encoded audio data. Currently supports `wav` and `mp3`.
          required:
          - data
          - format
      required:
      - type
      - input_audio
      title: Audio content part
      description: An audio content part
    ThinkingConfigAdaptiveSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - adaptive
          description: Lets the model dynamically determine when and how much to use extended thinking based on the complexity of each request. Supported on Claude Opus 4.6 and Sonnet 4.6.
      required:
      - type
      title: Thinking config adaptive
      description: Enables adaptive thinking mode where the model dynamically determines thinking depth
    PublicIdentity:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the contact
          example: contact_01ARZ3NDEKTSV4RRFFQ69G5FAV
        display_name:
          type: string
          description: Display name of the contact
          example: Jane Doe
        email:
          type: string
          format: email
          description: Email address of the contact
          example: jane.doe@example.com
        metadata:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: A hash of key/value pairs containing any other data about the contact
          example:
          - department: Engineering
            role: Senior Developer
        logo_url:
          type: string
          description: URL to the contact's avatar or logo
          example: https://example.com/avatars/jane-doe.jpg
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the contact
          example:
          - hr
          - engineering
      required:
      - id
      description: Information about the identity making the request. If the identity does not exist, it will be created automatically.
    ThinkingConfigEnabledSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - enabled
          description: Enables or disables the thinking mode capability
        budget_tokens:
          type: number
          description: Determines how many tokens the model can use for its internal reasoning process. Larger budgets can enable more thorough analysis for complex problems, improving response quality. Must be ≥1024 and less than `max_tokens`.
        thinking_level:
          type: string
          enum:
          - minimal
          - low
          - medium
          - high
          description: The level of reasoning the model should use. This setting is supported only by `gemini-3` models. If budget_tokens is specified and `thinking_level` is available, `budget_tokens` will be ignored.
      required:
      - type
      - budget_tokens
      title: Thinking config enabled
      description: Enables the thinking mode capability
    ReasoningPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - reasoning
          description: The type of the content part. Always `reasoning`.
        reasoning:
          type: string
          description: The reasoning or thought process behind the response. Used for chain-of-thought or extended thinking.
        signature:
          type: string
          description: Optional cryptographic signature to verify the authenticity and integrity of the reasoning content
      required:
      - type
      - reasoning
      - signature
      title: Reasoning Part
      description: A message part containing reasoning or chain-of-thought content
    TextContentPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - text
          description: The type of the content part.
        text:
          type: string
          description: The text content.
        cache_control:
          type: object
          properties:
            type:
              type: string
              enum:
              - ephemeral
              description: Create a cache control breakpoint at this content block. Accepts only the value "ephemeral".
            ttl:
              type: string
              enum:
              - 5m
              - 1h
              default: 5m
              description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                - `5m`: 5 minutes

                - `1h`: 1 hour


                Defaults to `5m`. Only supported by `Anthropic` Claude models.'
          required:
          - type
      required:
      - type
      - text
      title: Text content part
      description: The type of the content part.
    TraceScrubbingPlugin:
      type: object
      properties:
        id:
          type: string
          enum:
          - trace_scrubbing
          description: Plugin discriminator. Must be `trace_scrubbing`.
        mask:
          type: array
          items:
            type: string
            enum:
            - all
            - system
            - input
            - output
            - metadata
            - variables
          minItems: 1
          description: Trace surfaces to scrub. `all` includes system, input, output, metadata, and variables.
      required:
      - id
      - mask
      additionalProperties: false
      title: Trace scrubbing plugin
    ResponseHealingPlugin:
      type: object
      properties:
        id:
          type: string
          enum:
          - response_healing
          description: Plugin discriminator. Must be `response_healing`.
      required:
      - id
      additionalProperties: false
      title: Response healing plugin
    FileContentPartSchema:
      type: object
      properties:
        file_data:
          type: string
          description: 'The file data as a data URI string in the format `data:<mime-type>;base64,<base64-encoded-data>`. Example: `data:image/png;base64,iVBORw0KGgoAAAANS...`'
        uri:
          type: string
          description: URL of the file. Supported for PDFs on Anthropic Claude models and for `https://` and Google Cloud Storage `gs://` URIs on Vertex AI Gemini models.
        mimeType:
          type: string
          description: MIME type of the file (e.g., application/pdf, image/png). Inferred from `filename` or the URI extension when omitted.
        file_id:
          type: string
          description: 'A provider file reference: a Google Cloud Storage `gs://` URI for Vertex AI Gemini models, or an OpenAI file ID (`file-...`) for OpenAI models.'
        filename:
          type: string
          description: The name of the file, used when passing the file to the model as a string.
      description: File data for the content part. Must contain exactly one of file_data, file_id or uri.
    ThinkingConfigDisabledSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - disabled
          description: Disables the thinking mode capability
      required:
      - type
      title: Thinking config disabled
      description: Disables the thinking mode capability
    ImageContentPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - image_url
        image_url:
          type: object
          properties:
            url:
              type: string
              description: Either a URL of the image or the base64 encoded image data.
            detail:
              type: string
              enum:
              - low
              - high
              - auto
              description: Specifies the detail level of the image.
          required:
          - url
        cache_control:
          type: object
          properties:
            type:
              type: string
              enum:
              - ephemeral
              description: Create a cache control breakpoint at this content block. Accepts only the value "ephemeral".
            ttl:
              type: string
              enum:
              - 5m
              - 1h
              default: 5m
              description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                - `5m`: 5 minutes

                - `1h`: 1 hour


                Defaults to `5m`. Only supported by `Anthropic` Claude models.'
          required:
          - type
      required:
      - type
      - image_url
      title: Image content part
      description: An image content part
    RefusalPartSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - refusal
          description: The type of the content part. Always `refusal`.
        refusal:
          type: string
          description: The refusal message generated by the model.
      required:
      - type
      title: Refusal part
      description: A message part containing a refusal message.
    PIIRedactionPlugin:
      type: object
      properties:
        id:
          type: string
          enum:
          - pii_redaction
          description: PII redaction plugin.
        language:
          type: string
          description: Detector language. Accepts "auto" to detect the language per request; GET /v2/pii/capabilities lists the concrete languages and does not include "auto". Omitting the field defaults to "auto".
        regions:
          type: array
          items:
            type: string
          description: 'Region codes selecting whole regions of coverage (e.g. "nl", "gb"). Every entity type those regions cover is redacted, alongside the base catalog. ["all"] is exclusive, and leaving both this and entities empty also runs every region, so selecting nothing is the widest request rather than the narrowest. Combines with entities: the two selections are unioned, so entities adds types on top of the region coverage.'
        entities:
          type: array
          items:
            type: string
          description: The entity types to redact. A named type is redacted even when it belongs to a region, so a region's types can be selected individually without naming the region. On its own this is a strict allowlist; alongside regions it adds to the region coverage. See GET /v2/pii/capabilities for valid types.
        entity_thresholds:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          description: Per-entity confidence cutoff overrides in [0,1]. Tunes confidence only and never changes which types are redacted, so every key must also appear in entities.
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Baseline confidence cutoff applied to every entity type without a per-entity override.
        on_failure:
          type: string
          enum:
          - block
          - passthrough
          description: Behaviour when detection fails.
      required:
      - id
      additionalProperties: false
      title: PII redaction plugin
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  url: https://docs.orq.ai
  description: orq.ai Documentation
x-speakeasy-timeout: 600000
