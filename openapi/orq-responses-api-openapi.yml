    PublicPlugin:
      additionalProperties: false
      properties:
        entities:
          description: pii_redaction only. Entity types to redact (e.g. EMAIL_ADDRESS, BSN). On its own this is a strict allowlist; alongside regions it adds to the region coverage. Omit to redact every type detected for the language and regions. See GET /v2/pii/capabilities for valid types.
          items:
            type: string
          type:
          - array
          - 'null'
        entity_thresholds:
          additionalProperties:
            format: double
            type: number
          description: pii_redaction only. Per-entity confidence cutoff overrides in [0,1], keyed by entity type. An override replaces threshold for that type and may sit above or below it. Every key must also appear in entities.
          type: object
        id:
          description: Plugin discriminator. pii_redaction redacts PII, response_healing repairs malformed JSON, and trace_scrubbing removes selected sensitive fields from exported traces.
          enum:
          - pii_redaction
          - response_healing
          - trace_scrubbing
          type: string
        language:
          description: 'pii_redaction only. Detector language, or "auto" to detect it per request. Defaults to auto. The accepted values are whatever GET /v2/pii/capabilities lists, so they are not enumerated here: a fixed enum would reject a language the detector has since added.'
          type: string
        mask:
          description: trace_scrubbing only. Trace surfaces to scrub. At least one value required.
          items:
            enum:
            - all
            - system
            - input
            - output
            - metadata
            - variables
            type: string
          minItems: 1
          type:
          - array
          - 'null'
        on_failure:
          description: pii_redaction only. Behavior when redaction is unavailable. block (default) fails the request; passthrough sends the original text.
          enum:
          - block
          - passthrough
          type: string
        regions:
          description: 'pii_redaction only. Region codes selecting whole regions of coverage (e.g. nl, gb). Every entity type those regions cover is redacted, alongside the base catalog. ["all"] cannot be combined with other region codes, and leaving both this and entities empty also runs every region, so selecting nothing is the widest request rather than the narrowest. Combines with entities: the two selections are unioned.'
          items:
            type: string
          type:
          - array
          - 'null'
        threshold:
          description: pii_redaction only. Detector confidence cutoff in [0,1].
          format: double
          maximum: 1
          minimum: 0
          type: number
      required:
      - id
      type: object
