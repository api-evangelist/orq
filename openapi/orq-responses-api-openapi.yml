openapi: 3.2.0
info:
  title: orq.ai Responses API
  version: '2.0'
  description: orq.ai API documentation
servers:
- url: https://my.orq.ai
security:
- ApiKey: []
tags:
- name: Responses
paths:
  /v3/router/responses:
    post:
      description: Creates a model response for the given input. Returns a response object or a stream of server-sent events.
      operationId: create-router-response
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                background:
                  description: If true, the response runs asynchronously in the background.
                  type: boolean
                cache:
                  $ref: '#/components/schemas/CacheConfig'
                  description: Exact-match response cache configuration for this request.
                cache_control:
                  description: Top-level cache control automatically applies a cache_control marker to the last cacheable block in the request.
                  properties:
                    ttl:
                      default: 5m
                      description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                        - `5m`: 5 minutes

                        - `1h`: 1 hour


                        Defaults to `5m`. Only supported by Anthropic Claude models.'
                      enum:
                      - 5m
                      - 1h
                      type: string
                    type:
                      description: Create a cache control breakpoint. Accepts only the value "ephemeral".
                      enum:
                      - ephemeral
                      type: string
                  required:
                  - type
                  title: Cache control
                  type: object
                context_management:
                  description: Context management entries. One compaction entry summarizes history older than compact_threshold into a single item. See the [Context Compaction](https://docs.orq.ai/ai-gateway/features/context-compaction) guide.
                  items:
                    $ref: '#/components/schemas/OpenAIContextManagement'
                  type:
                  - array
                  - 'null'
                conversation:
                  $ref: '#/components/schemas/ConversationParam'
                  description: Conversation context for multi-turn interactions.
                fallbacks:
                  description: Fallback models to try if the primary model fails. Each entry specifies a model in provider/model format.
                  items:
                    $ref: '#/components/schemas/FallbackConfig'
                  type:
                  - array
                  - 'null'
                frequency_penalty:
                  description: Penalize new tokens based on their frequency in the text so far. Between -2.0 and 2.0.
                  format: double
                  type: number
                guardrails:
                  description: Guardrails to evaluate the request against.
                  items:
                    $ref: '#/components/schemas/EvaluatorRef'
                  type: array
                identity:
                  $ref: '#/components/schemas/ResponseIdentity'
                  description: Identity/contact information for the end-user.
                include:
                  description: Additional fields to include in the response. Use web_search_call.action.sources to add source URLs and titles to a web search action, or web_search_call.results for detailed results. See the [Web search](https://docs.orq.ai/ai-gateway/features/web-search) guide for the supported values.
                  items:
                    type: string
                  type: array
                input:
                  anyOf:
                  - description: A simple text string as input.
                    title: Text
                    type: string
                  - description: An array of input items.
                    items:
                      description: 'An input item. The "type" field determines the item kind: "message", "function_call", "function_call_output", "item_reference", etc.'
                      properties:
                        arguments:
                          description: The function arguments as a JSON string (for function_call items).
                          type: string
                        async:
                          description: Whether a function or custom tool call runs asynchronously.
                          type: boolean
                        call_id:
                          description: The function call identifier (for function_call and function_call_output items).
                          type: string
                        content:
                          anyOf:
                          - title: Text
                            type: string
                          - items:
                              anyOf:
                              - description: A text content part.
                                properties:
                                  cache_control:
                                    properties:
                                      ttl:
                                        default: 5m
                                        description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                                          - `5m`: 5 minutes

                                          - `1h`: 1 hour


                                          Defaults to `5m`. Only supported by Anthropic Claude models.'
                                        enum:
                                        - 5m
                                        - 1h
                                        type: string
                                      type:
                                        description: Create a cache control breakpoint at this content block. Accepts only the value "ephemeral".
                                        enum:
                                        - ephemeral
                                        type: string
                                    required:
                                    - type
                                    title: Cache control
                                    type: object
                                  text:
                                    description: The text content.
                                    type: string
                                  type:
                                    enum:
                                    - input_text
                                    type: string
                                  prompt_cache_breakpoint:
                                    description: An explicit OpenAI cache boundary for GPT-5.6 and later. Omitted ttl inherits prompt_cache_options.ttl.
                                    properties:
                                      mode:
                                        enum:
                                        - explicit
                                        type: string
                                      ttl:
                                        enum:
                                        - 30m
                                        - 12h
                                        type: string
                                    required:
                                    - mode
                                    type: object
                                required:
                                - type
                                - text
                                title: Text
                                type: object
                              - description: An image content part.
                                properties:
                                  cache_control:
                                    properties:
                                      ttl:
                                        default: 5m
                                        description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                                          - `5m`: 5 minutes

                                          - `1h`: 1 hour


                                          Defaults to `5m`. Only supported by Anthropic Claude models.'
                                        enum:
                                        - 5m
                                        - 1h
                                        type: string
                                      type:
                                        description: Create a cache control breakpoint at this content block. Accepts only the value "ephemeral".
                                        enum:
                                        - ephemeral
                                        type: string
                                    required:
                                    - type
                                    title: Cache control
                                    type: object
                                  detail:
                                    description: The detail level for image understanding.
                                    enum:
                                    - auto
                                    - low
                                    - high
                                    type: string
                                  file_id:
                                    description: The ID of a previously uploaded file.
                                    type: string
                                  image_url:
                                    description: The URL of the image.
                                    type: string
                                  type:
                                    enum:
                                    - input_image
                                    type: string
                                  prompt_cache_breakpoint:
                                    description: An explicit OpenAI cache boundary for GPT-5.6 and later. Omitted ttl inherits prompt_cache_options.ttl.
                                    properties:
                                      mode:
                                        enum:
                                        - explicit
                                        type: string
                                      ttl:
                                        enum:
                                        - 30m
                                        - 12h
                                        type: string
                                    required:
                                    - mode
                                    type: object
                                required:
                                - type
                                title: Image
                                type: object
                              - description: A file content part. Provide file_id, file_data (base64), or file_url.
                                properties:
                                  cache_control:
                                    properties:
                                      ttl:
                                        default: 5m
                                        description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                                          - `5m`: 5 minutes

                                          - `1h`: 1 hour


                                          Defaults to `5m`. Only supported by Anthropic Claude models.'
                                        enum:
                                        - 5m
                                        - 1h
                                        type: string
                                      type:
                                        description: Create a cache control breakpoint at this content block. Accepts only the value "ephemeral".
                                        enum:
                                        - ephemeral
                                        type: string
                                    required:
                                    - type
                                    title: Cache control
                                    type: object
                                  file_data:
                                    description: Base64-encoded file content.
                                    type: string
                                  file_id:
                                    description: The ID of a previously uploaded file.
                                    type: string
                                  file_url:
                                    description: A URL to fetch the file from.
                                    type: string
                                  filename:
                                    description: The name of the file.
                                    type: string
                                  mime_type:
                                    description: The MIME type of the file (e.g., application/pdf).
                                    type: string
                                  type:
                                    enum:
                                    - input_file
                                    type: string
                                  prompt_cache_breakpoint:
                                    description: An explicit OpenAI cache boundary for GPT-5.6 and later. Omitted ttl inherits prompt_cache_options.ttl.
                                    properties:
                                      mode:
                                        enum:
                                        - explicit
                                        type: string
                                      ttl:
                                        enum:
                                        - 30m
                                        - 12h
                                        type: string
                                    required:
                                    - mode
                                    type: object
                                required:
                                - type
                                title: File
                                type: object
                              description: A content part within a message.
                            title: Content parts
                            type: array
                          description: 'The content of the item: a string or an array of content parts.'
                        id:
                          description: The ID of the item. For item_reference items, this identifies the referenced item.
                          type: string
                        name:
                          description: The name of the function that was called (for function_call items).
                          type: string
                        output:
                          description: The output of the function call (for function_call_output type).
                          type: string
                        reasoning:
                          description: Reasoning settings applied by a configuration_update item.
                          properties:
                            effort:
                              enum:
                              - none
                              - minimal
                              - low
                              - medium
                              - high
                              - xhigh
                              - max
                              type: string
                          type: object
                        role:
                          description: The role of the message sender (for message items).
                          enum:
                          - user
                          - assistant
                          - system
                          - developer
                          type: string
                        status:
                          description: The status of a model-generated input item.
                          enum:
                          - in_progress
                          - completed
                          - incomplete
                          type: string
                        type:
                          description: The type of item.
                          enum:
                          - message
                          - function_call
                          - function_call_output
                          - item_reference
                          - reasoning
                          - custom_tool_call
                          - custom_tool_call_output
                          - computer_call
                          - computer_call_output
                          - local_shell_call
                          - local_shell_call_output
                          - shell_call
                          - shell_call_output
                          - apply_patch_call
                          - apply_patch_call_output
                          - tool_search_call
                          - tool_search_output
                          - additional_tools
                          - compaction
                          - program
                          - program_output
                          - mcp_call
                          - mcp_list_tools
                          - mcp_approval_request
                          - mcp_approval_response
                          - configuration_update
                          type: string
                      type: object
                    title: Items
                    type: array
                  description: 'Input to the model: a string or an array of input items (messages, files, etc.).'
                instructions:
                  description: System prompt / instructions for the model.
                  type: string
                integration_id:
                  description: Integration ID used to resolve provider credentials for this request.
                  type: string
                limits:
                  $ref: '#/components/schemas/ResponseExecutionLimits'
                  description: 'Bound agent-loop execution. Fields: max_iterations (LLM turns), max_execution_time (seconds), max_cost (USD; send 0 to disable a manifest-configured cap), max_depth (sub-agent nesting), tool_timeout (seconds). Body values override agent-manifest defaults.'
                load_balancer:
                  $ref: '#/components/schemas/LoadBalancerConfig'
                  description: Load balancing configuration for selecting among multiple models.
                max_output_tokens:
                  description: Maximum number of tokens in the response output.
                  format: int64
                  type: integer
                max_tool_calls:
                  description: Maximum number of tool call rounds in the agentic loop.
                  format: int64
                  type: integer
                memory:
                  $ref: '#/components/schemas/MemoryParam'
                  description: Attach a memory store entity to enable persistent memory across requests. See Memory Stores documentation for setup.
                metadata:
                  additionalProperties:
                    type: string
                  description: 'Developer-defined key-value pairs attached to the response (OpenAI spec: `Map<string, string>`). Non-string values are rejected with a 400.'
                  type: object
                model:
                  description: The model to use in provider/model format (e.g. openai/gpt-4o). Use `agent/<key>` to invoke a pre-configured agent from the orq.ai platform.
                  type: string
                parallel_tool_calls:
                  description: Whether to allow parallel tool calls.
                  type: boolean
                plugins:
                  description: Request-scoped transforms applied to the text exchanged with the model. Supports pii_redaction, which replaces PII with placeholders before the provider sees it and restores the original values in the response; response_healing, which repairs malformed JSON in non-streaming model output; and trace_scrubbing, which removes selected sensitive fields from exported traces.
                  items:
                    $ref: '#/components/schemas/PublicPlugin'
                  type:
                  - array
                  - 'null'
                presence_penalty:
                  description: Penalize new tokens based on their presence in the text so far. Between -2.0 and 2.0.
                  format: double
                  type: number
                previous_response_id:
                  description: The ID of a previous response to continue from. Requires store to be true (default) on the original response.
                  type: string
                prompt_cache_key:
                  description: Key for prompt caching across requests.
                  type: string
                prompt_cache_options:
                  $ref: '#/components/schemas/OpenAIPromptCacheOptions'
                  description: OpenAI prompt cache options. GPT-5.6 and later support ttl=30m (default) or 12h. 12h cache writes cost twice the 30m rate.
                reasoning:
                  $ref: '#/components/schemas/ReasoningParam'
                  description: Configure reasoning behavior. Set effort (none, minimal, low, medium, high, xhigh, max) to control how much the model thinks before answering. Higher effort means more reasoning tokens and better answers for complex tasks, at higher cost.
                retry:
                  $ref: '#/components/schemas/ResponseRetryConfig'
                  description: Retry configuration. Specify the number of retries and which HTTP status codes should trigger a retry.
                safety_identifier:
                  description: Safety identifier for content filtering.
                  type: string
                security:
                  $ref: '#/components/schemas/SecurityConfig'
                  description: Trace masking configuration for request and response data.
                service_tier:
                  description: Processing mode for the request. Fast uses premium low-latency processing; priority remains a backward-compatible alias.
                  enum:
                  - auto
                  - default
                  - flex
                  - fast
                  - scale
                  - priority
                  type: string
                stop_sequences:
                  description: Custom text sequences that cause the model to stop generating. Forwarded to providers that support it (e.g. Anthropic); ignored otherwise.
                  items:
                    type: string
                  type: array
                store:
                  description: 'Whether to persist the response (default: true). When false, the response cannot be retrieved later and previous_response_id will not work for follow-up requests.'
                  type: boolean
                stream:
                  description: If true, returns a stream of server-sent events.
                  type: boolean
                stream_options:
                  $ref: '#/components/schemas/StreamOptions'
                temperature:
                  description: Sampling temperature between 0 and 2.
                  format: double
                  type: number
                template_engine:
                  description: Template engine for variable substitution in instructions. Defaults to the agent manifest's engine when invoking an agent, otherwise text.
                  enum:
                  - text
                  - jinja
                  - mustache
                  type: string
                text:
                  description: Configuration for text output.
                  properties:
                    format:
                      anyOf:
                      - properties:
                          type:
                            enum:
                            - text
                            type: string
                        required:
                        - type
                        title: Plain text
                        type: object
                      - properties:
                          description:
                            description: A description of what the response format is for, used by the model to determine how to respond in the format.
                            type: string
                          name:
                            description: The name of the response format. Must be a-z, A-Z, 0-9, or contain underscores and dashes, with a maximum length of 64.
                            maxLength: 64
                            pattern: ^[a-zA-Z0-9_-]+$
                            type: string
                          schema:
                            additionalProperties: true
                            description: The schema for the response format, described as a JSON Schema object.
                            type: object
                          strict:
                            description: Whether to enable strict schema adherence when generating the output. If set to true, the model will always follow the exact schema defined in the `schema` field.
                            type: boolean
                          type:
                            description: The type of response format being defined. Always `json_schema`.
                            enum:
                            - json_schema
                            type: string
                        required:
                        - type
                        - name
                        - schema
                        title: JSON Schema
                        type: object
                      description: 'The output format: plain text or structured JSON schema.'
                    verbosity:
                      description: Controls the verbosity of the model output.
                      enum:
                      - low
                      - medium
                      - high
                      type: string
                  type: object
                thinking:
                  $ref: '#/components/schemas/ThinkingParam'
                  description: Extended thinking configuration for Google Gemini and Anthropic models. Carries type, budget_tokens, and thinking_level. See the [Reasoning](https://docs.orq.ai/ai-gateway/features/reasoning) guide.
                thread:
                  $ref: '#/components/schemas/ResponseThread'
                  description: Thread for grouping related requests.
                timeout:
                  $ref: '#/components/schemas/TimeoutConfig'
                  description: Provider call timeout configuration in milliseconds.
                tool_choice:
                  anyOf:
                  - description: 'Shorthand: "auto" lets the model decide, "none" disables tools, "required" forces tool use.'
                    enum:
                    - auto
                    - none
                    - required
                    title: Shorthand
                    type: string
                  - description: Select a specific function tool by name.
                    properties:
                      name:
                        description: The name of the function to call.
                        type: string
                      type:
                        enum:
                        - function
                        type: string
                    required:
                    - type
                    - name
                    title: Specific function
                    type: object
                  description: How the model should use the provided tools. Can be a string shorthand or a specific function selector.
                tools:
                  description: Tools available to the model.
                  items:
                    anyOf:
                    - description: A function tool the model can call.
                      properties:
                        async:
                          description: Whether the tool response can be returned asynchronously.
                          type: boolean
                        cache_control:
                          properties:
                            ttl:
                              default: 5m
                              description: 'The time-to-live for the cache control breakpoint. This may be one of the following values:


                                - `5m`: 5 minutes

                                - `1h`: 1 hour


                                Defaults to `5m`. Only supported by Anthropic Claude models.'
                              enum:
                              - 5m
                              - 1h
                              type: string
                            type:
                              description: Create a cache control breakpoint at this content block. Accepts only the value "ephemeral".
                              enum:
                              - ephemeral
                              type: string
                          required:
                          - type
                          title: Cache control
                          type: object
                        description:
                          description: A description of what the function does.
                          type: string
                        name:
                          description: The name of the function.
                          type: string
                        parameters:
                          additionalProperties: true
                          description: The parameters the function accepts, as a JSON Schema object.
                          type: object
                        strict:
                          description: Whether to enforce strict parameter validation.
                          type: boolean
                        type:
                          enum:
                          - function
                          type: string
                      required:
                      - type
                      - name
                      title: Function
                      type: object
                    - description: A custom tool that accepts free-form input.
                      properties:
                        async:
                          description: Whether the tool response can be returned asynchronously.
                          type: boolean
                        description:
                          description: A description of what the custom tool does.
                          type: string
                        name:
                          description: The name of the custom tool.
                          type: string
                        type:
                          enum:
                          - custom
                          type: string
                      required:
                      - type
                      - name
                      title: Custom
                      type: object
                    - $ref: '#/components/schemas/OrqAdvisorTool'
                    - $ref: '#/components/schemas/OrqSidekickTool'
                    - description: An orq.ai platform tool reference. For MCP tools, prefer type 'mcp' with 'key' instead of 'orq:mcp' with 'tool_id'.
                      properties:
                        files:
                          description: Files to stage in /workspace for orq:code_interpreter. Maximum 10 files.
                          items:
                            properties:
                              file_id:
                                description: The workspace file ID.
                                type: string
                              name:
                                description: The file name exposed under /workspace.
                                type: string
                            required:
                            - file_id
                            - name
                            type: object
                          maxItems: 10
                          type: array
                        network:
                          description: Network access intent for orq:code_interpreter. Stored and validated today; runtime enforcement by the sandbox egress layer is rolling out and until then sandbox executions retain default public internet egress.
                          properties:
                            allowlist:
                              default: []
                              description: Allowed network hostnames or IPv4 addresses when mode is allowlist. Maximum 50 entries.
                              items:
                                type: string
                              maxItems: 50
                              type: array
                            mode:
                              default: disabled
                              description: Network mode. Defaults to disabled.
                              enum:
                              - disabled
                              - allowlist
                              type: string
                          type: object
                        timezone:
                          description: Default IANA timezone for orq:datetime (e.g., "Europe/Amsterdam").
                          type: string
                        tool_id:
                          description: The tool ID (for orq:mcp, orq:http, orq:function).
                          type: string
                        type:
                          description: The orq.ai tool type. orq:web_search, orq:web_fetch, and orq:datetime are the canonical names for orq:google_search, orq:web_scraper, and orq:current_date.
                          enum:
                          - orq:web_search
                          - orq:web_fetch
                          - orq:datetime
                          - orq:search_models
                          - orq:image_generation
                          - orq:apply_patch
                          - orq:fusion
                          - orq:shell
                          - orq:query_knowledge_base
                          - orq:retrieve_knowledge_bases
                          - orq:current_date
                          - orq:google_search
                          - orq:web_scraper
                          - orq:code_interpreter
                          - orq:mcp
                          - orq:http
                          - orq:function
                          type: string
                      required:
                      - type
                      title: orq.ai Tool
                      type: object
                    - description: An MCP (Model Context Protocol) server tool. Provide server_url for inline mode, or key to reference a pre-configured MCP server.
                      properties:
                        allowed_tools:
                          description: Filter which tools from the MCP server are exposed.
                          properties:
                            read_only:
                              description: Only expose tools with readOnlyHint annotation.
                              type: boolean
                            tool_names:
                              description: List of allowed tool names.
                              items:
                                type: string
                              type: array
                          type: object
                        headers:
                          additionalProperties:
                            type: string
                          description: Custom headers to send with MCP requests. Values support {{variable}} templates.
                          type: object
                        key:
                          description: Unique identifier. Required for pre-configured MCP servers (lookup key). For inline servers, used as a trace/display label.
                          type: string
                        server_description:
                          description: Human-readable description of the server.
                          type: string
                        server_url:
                          description: The MCP server endpoint URL (inline mode).
                          type: string
                        type:
                          enum:
                          - mcp
                          type: string
                      required:
                      - type
                      title: MCP Tool
                      type: object
                    description: A tool definition. The "type" field determines the tool kind.
                  type: array
                top_k:
                  description: Only sample from the top K options for each subsequent token. Forwarded to providers that support it (e.g. Anthropic); ignored otherwise.
                  format: int64
                  type: integer
                top_logprobs:
                  description: Number of most likely tokens to return at each position.
                  format: int64
                  type: integer
                top_p:
                  description: Nucleus sampling parameter.
                  format: double
                  type: number
                variables:
                  additionalProperties: {}
                  description: 'Template variables for prompt substitution. Plain values fill {{variable}} placeholders in instructions. For secrets, use {"secret": true, "value": "sensitive-data"} — secrets are automatically passed to platform tools (Python, HTTP, MCP) and redacted from traces.'
                  type: object
                fallback_on_codes:
                  description: HTTP status codes that trigger fallback. Defaults to [408,429,500,502,503,504,529]. Each code must be unique and between 400 and 599.
                  items:
                    format: int64
                    type: integer
                  maxItems: 20
                  type:
                  - array
                  - 'null'
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  background:
                    type: boolean
                  completed_at:
                    format: int64
                    type:
                    - integer
                    - 'null'
                  conversation:
                    $ref: '#/components/schemas/ConversationParam'
                  created_at:
                    format: int64
                    type: integer
                  error:
                    anyOf:
                    - $ref: '#/components/schemas/ResponseError'
                    - type: 'null'
                  frequency_penalty:
                    format: double
                    type: number
                  id:
                    type: string
                  incomplete_details:
                    anyOf:
                    - $ref: '#/components/schemas/IncompleteDetails'
                    - type: 'null'
                  input:
                    description: Array of input items (messages, function call outputs, etc.)
                    items: {}
                    type:
                    - array
                    - 'null'
                  instructions:
                    type:
                    - string
                    - 'null'
                  max_output_tokens:
                    format: int64
                    type:
                    - integer
                    - 'null'
                  max_tool_calls:
                    format: int64
                    type:
                    - integer
                    - 'null'
                  memory:
                    $ref: '#/components/schemas/MemoryParam'
                  metadata:
                    additionalProperties:
                      type: string
                    description: 'Developer-defined key-value pairs attached to the response (OpenAI spec: `Map<string, string>`).'
                    type: object
                  model:
                    type: string
                  object:
                    description: Always "response"
                    type: string
                  output:
                    description: Array of output items (messages, function calls, reasoning, etc.)
                    items: {}
                    type:
                    - array
                    - 'null'
                  parallel_tool_calls:
                    type: boolean
                  presence_penalty:
                    format: double
                    type: number
                  previous_response_id:
                    type:
                    - string
                    - 'null'
                  prompt_cache_key:
                    type:
                    - string
                    - 'null'
                  prompt_cache_options:
                    anyOf:
                    - $ref: '#/components/schemas/OpenAIPromptCacheOptions'
                    - type: 'null'
                  prompt_cache_retention:
                    type:
                    - string
                    - 'null'
                  reasoning:
                    anyOf:
