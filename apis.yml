aid: orq
name: Orq.ai
image: https://framerusercontent.com/images/2WPqC5CejT04oQzpwkTC8lYFeL0.jpg
description: Orq.ai provides a sovereign AI gateway and software factory enabling enterprises to build, govern, and deploy AI-driven applications
  with robust observability, risk management, and compliance features. The platform offers AI model management, policy enforcement, and a unified
  API to integrate large language models, tools, and custom agents, targeting use cases from coding assistants to enterprise AI governance.
